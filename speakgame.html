}

function startNewRun() {
  SFX.click();
  // Build the run map: 3 normal fights (distinct audiences) + 1 elite + 1 boss.
  // The elite slots in at position 3 (4th node).
  const usedIds = [];
  const nodes = [];
  for (let i = 0; i < 3; i++) {
    const aud = pickNormalAudience(usedIds);
    usedIds.push(aud.id);
    nodes.push({ kind: 'fight', audienceId: aud.id, done: false, isBoss: false, isElite: false });
  }
  const elite = pickEliteAudience();
  nodes.push({ kind: 'fight', audienceId: elite.id, done: false, isBoss: false, isElite: true });
  nodes.push({ kind: 'fight', audienceId: 'b01', done: false, isBoss: true, isElite: false });

  state.deckRun = {
    active: true,
    deck: STARTER_DECK_IDS.slice(),
    composureMax: 70,
    composure: 70,
    coinsThisRun: 0,
    fightsCompleted: 0,
    totalFights: 5,
    nodes,
    crossroads: null,           // {kind:'pick'|'shop'|'rest'} or null
    shopState: null,            // {cardsForSale, prices, sold:[bool], removeUsed, upgradeUsed} or null
    pickerState: null,          // {kind:'remove'|'upgrade-shop'|'upgrade-rest', returnTo:'shop'|'map', priceCharged:N}
    pendingReward: null,        // legacy: now only populated for new-card pick within crossroads
    runsCompleted: state.deckRun?.runsCompleted || 0,
    runsLost: state.deckRun?.runsLost || 0
  };
  saveState();
  renderDeck();
}

function abandonRun() {
  if (!confirm('Abandon this run? Your deck and progress will be lost — your XP and Coins so far are kept.')) return;
  state.deckRun.active = false;
  saveState();
  renderDeck();
}

// ================================================================
// DECK MODE — Fight engine
// _fight is transient; lives only for the duration of one fight.
// ================================================================
let _fight = null;

function startFight(nodeIdx) {
  const node = state.deckRun.nodes[nodeIdx];
  if (!node || node.done) return;
  const audience = audienceById(node.audienceId);
  if (!audience) return;
  SFX.click();

  // Build draw pile from full deck, shuffled
  const draw = shuffleArr(state.deckRun.deck.slice());
  _fight = {
    nodeIdx,
    audience: {
      id: audience.id,
      name: audience.name,
      emoji: audience.emoji,
      desc: audience.desc,
      isBoss: audience.isBoss || false,
      isElite: audience.isElite || false,
      passive: audience.passive || null,
      skepticismMax: audience.skepticism,
      skepticism: audience.skepticism,
      resistance: 0,
      conviction: 0,
      intents: audience.intents.slice(),
      intentIdx: 0,
      skipNextIntent: false,
      // Session-3 modifiers
      halveNextAttack: false,
      nullifyNextAttack: false
    },
    composureMax: state.deckRun.composureMax,
    composure: state.deckRun.composure,
    block: 0,
    energyMax: 3,
    energy: 3,
    drawPile: draw,
    hand: [],
    discard: [],
    exhaust: [],
    playLog: [],          // mini cards shown for this turn
    powers: [],           // {cardId, special}
    turnFlags: {
      attacksPlayed: 0,
      skillsPlayed: 0,
      doubleNextAttack: false,
      cardsPlayed: 0,                     // for first-card / empty-hand checks
      firstAttackBoardDebuffApplied: false // tracks the Bored Board's -2-on-first-attack passive
    },
    over: false,
    won: false,
    // Animation queue — UI consumes once per render
    _fx: []
  };
  drawCards(5);
  renderDeck();
}

function shuffleArr(arr, rng) {
  const r = rng || Math.random;
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function drawCards(n) {
  for (let i = 0; i < n; i++) {
    if (_fight.drawPile.length === 0) {
      if (_fight.discard.length === 0) return; // truly empty
      _fight.drawPile = shuffleArr(_fight.discard);
      _fight.discard = [];
    }
    _fight.hand.push(_fight.drawPile.shift());
  }
}

function getCurrentIntent() {
  return _fight.audience.intents[_fight.audience.intentIdx % _fight.audience.intents.length];
}

// Deal damage to player composure. Respects block. Triggers passives (thorns).
// Returns the damage that actually went through to composure.
function damagePlayer(rawAmount) {
  const blocked = Math.min(_fight.block, rawAmount);
  const through = rawAmount - blocked;
  _fight.block -= blocked;
  _fight.composure = Math.max(0, _fight.composure - through);
  if (through > 0) {
    SFX.miss();
    _fight._fx.push({ kind: 'damage', value: through, target: 'player' });
    // Thorns power: deal persuasion back when hit
    const thorns2 = _fight.powers.find(p => p.special === 'thorns-2');
    const thorns4 = _fight.powers.find(p => p.special === 'thorns-4');
    const thornsAmt = thorns4 ? 4 : (thorns2 ? 2 : 0);
    if (thornsAmt > 0) {
      const resisted = Math.max(0, thornsAmt - _fight.audience.resistance);
      _fight.audience.resistance = Math.max(0, _fight.audience.resistance - thornsAmt);
      _fight.audience.skepticism = Math.max(0, _fight.audience.skepticism - resisted);
      _fight._fx.push({ kind: 'damage', value: resisted, target: 'audience', flavor: 'thorns' });
    }
  }
  return through;
}

// Audience passive: numbers-demanded (CFO) reduces attacks by 1 unless a Skill was played earlier this turn.
function applyAttackPassiveModifier(card, basePersuasion) {
  let p = basePersuasion;
  const passId = _fight.audience.passive && _fight.audience.passive.id;
  if (passId === 'numbers-demanded' && card.type === 'attack' && _fight.turnFlags.skillsPlayed === 0) {
    p = Math.max(0, p - 1);
  }
  if (passId === 'heard-it-all' && card.type === 'attack' && !_fight.turnFlags.firstAttackBoardDebuffApplied) {
    p = Math.max(0, p - 2);
    _fight.turnFlags.firstAttackBoardDebuffApplied = true;
  }
  return p;
}

function playCard(handIdx) {
  if (!_fight || _fight.over) return;
  const cardId = _fight.hand[handIdx];
  if (!cardId) return;
  const card = cardById(cardId);
  if (!card) return;
  if (_fight.energy < card.cost) {
    showToast('Not enough energy.', 'error');
    return;
  }
  // Some cards have play conditions
  if (card.effect && card.effect.special === 'must-be-last' && _fight.hand.length > 1) {
    showToast('Mic Drop can only be played as your last card.', 'error');
    return;
  }

  _fight.energy -= card.cost;
  _fight.hand.splice(handIdx, 1);
  _fight.playLog.push(card.name);
  SFX.place();

  // Was this the first card played this turn? (used by Punchline)
  const isFirstCardThisTurn = _fight.turnFlags.cardsPlayed === 0;
  _fight.turnFlags.cardsPlayed++;

  // Tally turn flags
  if (card.type === 'attack') _fight.turnFlags.attacksPlayed++;
  if (card.type === 'skill')  _fight.turnFlags.skillsPlayed++;

  // ----- APPLY EFFECTS -----
  const e = card.effect || {};
  let persuasion = e.persuasion || 0;

  // Combo bonus: comboWith ('attack'|'skill') checks prior plays this turn
  if (e.comboWith === 'attack' && _fight.turnFlags.attacksPlayed > 1) {
    persuasion += e.comboBonus || 0;
  } else if (e.comboWith === 'skill' && _fight.turnFlags.skillsPlayed > (card.type === 'skill' ? 1 : 0)) {
    persuasion += e.comboBonus || 0;
  }

  // Special effects
  if (e.special === 'damage-equals-block') {
    const mult = e._mult || 1;
    persuasion += Math.floor(_fight.block * mult);
  }
  if (e.special === 'big-if-discard-3' && _fight.discard.length >= 3) {
    persuasion += e._bigBonus || 6;
  }
  if (e.special === 'scale-with-attacks') {
    const scale = e._scale || 3;
    persuasion += scale * _fight.turnFlags.attacksPlayed;
  }
  if (e.special === 'scale-with-discard') {
    const base = e._base !== undefined ? e._base : 8;
    persuasion = base + _fight.discard.length;
  }
  if (e.special === 'block-equals-intent') {
    const intent = getCurrentIntent();
    if (intent.kind === 'attack') {
      const mult = e._mult || 1;
      _fight.block += Math.floor((intent.value + _fight.audience.conviction) * mult);
    }
  }
  if (e.special === 'recall-discard') {
    _fight.drawPile = shuffleArr([..._fight.drawPile, ..._fight.discard]);
    _fight.discard = [];
  }
  if (e.special === 'reduce-resistance') {
    _fight.audience.resistance = Math.max(0, _fight.audience.resistance - (e._val || 6));
  }
  if (e.special === 'halve-next-attack') {
    _fight.audience.halveNextAttack = true;
  }
  if (e.special === 'nullify-next-attack') {
    _fight.audience.nullifyNextAttack = true;
  }
  if (e.special === 'give-conviction') {
    _fight.audience.conviction += (e._val || 3);
  }
  if (e.special === 'add-card-to-discard') {
    _fight.discard.push(e._addId);
  }
  if (e.special === 'draw-if-first' && isFirstCardThisTurn) {
    drawCards(e._drawN || 1);
  }

  // Apply Confident Tone (+1 / +2 to all attacks) if active
  if (card.type === 'attack') {
    if (_fight.powers.some(p => p.special === 'attack-buff-2')) persuasion += 2;
    else if (_fight.powers.some(p => p.special === 'attack-buff-1')) persuasion += 1;
  }

  // Audience passive: numbers-demanded / heard-it-all modify attack damage
  persuasion = applyAttackPassiveModifier(card, persuasion);

  // Authority: double next attack
  if (_fight.turnFlags.doubleNextAttack && card.type === 'attack') {
    persuasion *= 2;
    _fight.turnFlags.doubleNextAttack = false;
  }
  if (e.special === 'double-next-attack') {
    _fight.turnFlags.doubleNextAttack = true;
  }

  // Block + persuasion application
  if (e.block) _fight.block += e.block;
  if (persuasion > 0) {
    const resisted = Math.max(0, persuasion - _fight.audience.resistance);
    _fight.audience.resistance = Math.max(0, _fight.audience.resistance - persuasion);
    _fight.audience.skepticism = Math.max(0, _fight.audience.skepticism - resisted);
    if (resisted > 0) _fight._fx.push({ kind: 'damage', value: resisted, target: 'audience' });
  }

  // Self damage (Strong Hook) — does NOT trigger thorns since it's self-inflicted
  if (e.selfDamage) {
    _fight.composure = Math.max(0, _fight.composure - e.selfDamage);
    _fight._fx.push({ kind: 'damage', value: e.selfDamage, target: 'player', flavor: 'self' });
  }

  // Energy gain
  if (e.gainEnergy) _fight.energy += e.gainEnergy;

  // Draw cards
  if (e.draw) drawCards(e.draw);

  // Power card → moves to powers, not discard
  if (e.powerful) {
    _fight.powers.push({ cardId: card.id, special: e.special });
  }

  // Skip next intent
  if (e.special === 'skip-next-intent') {
    _fight.audience.skipNextIntent = true;
  }

  // Draw if power (for c33)
  if (e.special === 'draw-if-power' && _fight.powers.length > 0) {
    drawCards(2);
  }

  // Audience passive: twisted-quotes — costly cards build their conviction
  if (_fight.audience.passive && _fight.audience.passive.id === 'twisted-quotes' && card.cost >= 2) {
    _fight.audience.conviction += 2;
  }

  // Where does the card go?
  if (e.exhaust || e.powerful) {
    _fight.exhaust.push(cardId);
  } else {
    _fight.discard.push(cardId);
  }

  // Check win
  if (_fight.audience.skepticism <= 0) {
    finishFight(true);
    return;
  }
  // Check lose (e.g., self-damage killed us)
  if (_fight.composure <= 0) {
    finishFight(false);
    return;
  }

  renderDeck();
}

function endTurn() {
  if (!_fight || _fight.over) return;
  SFX.submit();

  // Audience passive: cutting-mind — empty hand at end of turn = 4 damage
  const passId = _fight.audience.passive && _fight.audience.passive.id;
  if (passId === 'cutting-mind' && _fight.hand.length === 0) {
    damagePlayer(4);
    if (_fight.composure <= 0) { finishFight(false); return; }
  }

  // Audience passive: phone-buzz — discard 1 random card from hand at end of turn
  if (passId === 'phone-buzz' && _fight.hand.length > 0) {
    const idx = Math.floor(Math.random() * _fight.hand.length);
    _fight.discard.push(_fight.hand.splice(idx, 1)[0]);
  }

  // Discard remaining hand
  while (_fight.hand.length > 0) {
    _fight.discard.push(_fight.hand.shift());
  }
  // Block expires
  _fight.block = 0;

  // --- AUDIENCE TURN ---
  const audience = _fight.audience;
  let intent = audience.intents[audience.intentIdx % audience.intents.length];

  if (audience.skipNextIntent) {
    audience.skipNextIntent = false;
    showToast('Audience intent skipped.', 'success');
  } else {
    if (intent.kind === 'attack') {
      let dmg = intent.value + audience.conviction;
      audience.conviction = 0; // conviction is consumed on attack
      // Disarm modifiers
      if (audience.nullifyNextAttack) {
        dmg = 0;
        audience.nullifyNextAttack = false;
      } else if (audience.halveNextAttack) {
        dmg = Math.floor(dmg / 2);
        audience.halveNextAttack = false;
      }
      damagePlayer(dmg);
    } else if (intent.kind === 'defend') {
      audience.resistance += intent.value;
    } else if (intent.kind === 'buff') {
      audience.conviction += intent.value;
    }
  }
  audience.intentIdx++;

  // Check lose
  if (_fight.composure <= 0) {
    finishFight(false);
    return;
  }

  // --- NEW PLAYER TURN ---
  _fight.energy = _fight.energyMax;
  _fight.block = 0;
  _fight.playLog = [];
  _fight.turnFlags = {
    attacksPlayed: 0, skillsPlayed: 0, doubleNextAttack: false,
    cardsPlayed: 0, firstAttackBoardDebuffApplied: false
  };

  // Audience passive: pivot-master (elite Founder) — +2 resistance at turn start
  if (passId === 'pivot-master') {
    _fight.audience.resistance += 2;
  }

  // Powers that trigger at start of turn
  for (const p of _fight.powers) {
    if (p.special === 'draw-extra') drawCards(1);
    if (p.special === 'turn-start-damage') {
      const power = _fight.powers.find(pp => pp.special === 'turn-start-damage');
      const card = power ? cardById(power.cardId) : null;
      const val = (card && card.effect && card.effect._val) || 3;
      const through = Math.max(0, val - _fight.audience.resistance);
      _fight.audience.resistance = Math.max(0, _fight.audience.resistance - val);
      _fight.audience.skepticism = Math.max(0, _fight.audience.skepticism - through);
      if (through > 0) _fight._fx.push({ kind: 'damage', value: through, target: 'audience', flavor: 'aura' });
      if (_fight.audience.skepticism <= 0) { finishFight(true); return; }
    }
    if (p.special === 'energy-power')   _fight.energy += 1;
    if (p.special === 'energy-power-2') _fight.energy += 2;
  }

  drawCards(5);
  renderDeck();
}

function finishFight(won) {
  if (!_fight) return;
  _fight.over = true;
  _fight.won = won;

  if (won) {
    SFX.win();
    const node = state.deckRun.nodes[_fight.nodeIdx];
    node.done = true;
    state.deckRun.fightsCompleted++;
    state.deckRun.composure = _fight.composure; // persist remaining composure

    const isBoss = node.isBoss;
    const isElite = node.isElite;
    // Elite gives bigger rewards than normal; boss is biggest.
    const baseXp = isBoss ? 100 : isElite ? 60 : 30;
    const baseCoins = isBoss ? 60 : isElite ? 35 : 18;
    const composureBonus = Math.round(_fight.composure / 8);
    const xpEarned = baseXp + composureBonus;
    const coinsEarned = baseCoins + composureBonus;

    state.xp += xpEarned;
    state.coins += coinsEarned;
    state.deckRun.coinsThisRun += coinsEarned;
    refreshHeaderStats();

    if (!isBoss) {
      // Crossroads: player picks New Card / Shop / Rest. No auto-heal —
      // the user makes a meaningful choice. The fight reward (XP+Coins)
      // is shown on the Crossroads.
      state.deckRun.crossroads = {
        kind: 'choose',
        fightLabel: node.audienceId,
        xpEarned,
        coinsEarned,
        isElite
      };
    } else {
      // Run complete!
      state.deckRun.runsCompleted++;
      state.deckRun.active = false;
      state.deckRun.lastResult = { won: true, xpEarned, coinsEarned, coinsThisRun: state.deckRun.coinsThisRun };
    }
    saveState();
  } else {
    SFX.lose();
    state.deckRun.runsLost++;
    state.deckRun.active = false;
    state.deckRun.composure = 0;
    // Consolation reward
    const xpEarned = 15 + state.deckRun.fightsCompleted * 8;
    state.xp += xpEarned;
    state.deckRun.lastResult = { won: false, xpEarned, fightsCompleted: state.deckRun.fightsCompleted };
    refreshHeaderStats();
    saveState();
  }
  renderDeck();
}

function rollRewardCards(rarityBoostUncommon) {
  // Default odds: 70% common, 25% uncommon, 5% rare. Elite boost: more uncommons.
  const pool = [];
  const seen = new Set();
  for (let i = 0; i < 3; i++) {
    const r = Math.random();
    let rarity;
    if (rarityBoostUncommon) {
      rarity = r < 0.10 ? 'rare' : r < 0.55 ? 'uncommon' : 'common';
    } else {
      rarity = r < 0.05 ? 'rare' : r < 0.30 ? 'uncommon' : 'common';
    }
    const tier = cardsByRarity(rarity);
    let pick = null;
    for (let tries = 0; tries < 10; tries++) {
      const candidate = tier[Math.floor(Math.random() * tier.length)];
      if (!seen.has(candidate.id)) { pick = candidate; break; }
    }
    if (!pick) pick = tier[Math.floor(Math.random() * tier.length)];
    seen.add(pick.id);
    pool.push(pick.id);
  }
  return pool;
}

// ---------- Crossroads (between-fight choice) ----------
function chooseCrossroads(kind) {
  SFX.click();
  const cr = state.deckRun.crossroads;
  if (!cr) return;
  if (kind === 'card') {
    cr.kind = 'pick-card';
    cr.cardChoices = rollRewardCards(cr.isElite);
  } else if (kind === 'shop') {
    openShop();
    return;
  } else if (kind === 'rest') {
    cr.kind = 'rest';
  }
  saveState();
  renderDeck();
}

function pickCrossroadsCard(cardId) {
  const cr = state.deckRun.crossroads;
  if (!cr || cr.kind !== 'pick-card') return;
  if (!cr.cardChoices.includes(cardId)) return;
  state.deckRun.deck.push(cardId);
  SFX.coin();
  state.deckRun.crossroads = null;
  saveState();
  renderDeck();
}
function skipCrossroadsCard() {
  // Free skip — return to crossroads choice, no penalty
  const cr = state.deckRun.crossroads;
  if (!cr) return;
  cr.kind = 'choose';
  delete cr.cardChoices;
  SFX.click();
  saveState();
  renderDeck();
}

// ---------- Shop ----------
const SHOP_PRICES = { common: 30, uncommon: 55, rare: 90, remove: 50, upgrade: 35 };

function openShop() {
  // Build shop state: 3 random cards (mix of rarities) for sale
  const cards = rollRewardCards(false);
  const prices = cards.map(id => {
    const c = cardById(id);
    return SHOP_PRICES[c.rarity] || 50;
  });
  state.deckRun.shopState = {
    cards, prices,
    sold: [false, false, false],
    removeUsed: false,
    upgradeUsed: false
  };
  state.deckRun.crossroads.kind = 'shop';
  saveState();
  renderDeck();
}
function buyShopCard(idx) {
  const ss = state.deckRun.shopState;
  if (!ss || ss.sold[idx]) return;
  const price = ss.prices[idx];
  if (state.coins < price) { showToast('Not enough Charisma Coins.', 'error'); return; }
  state.coins -= price;
  ss.sold[idx] = true;
  state.deckRun.deck.push(ss.cards[idx]);
  SFX.coin();
  refreshHeaderStats();
  saveState();
  renderDeck();
}
function shopOpenRemove() {
  const ss = state.deckRun.shopState;
  if (!ss || ss.removeUsed) return;
  if (state.coins < SHOP_PRICES.remove) { showToast('Not enough Charisma Coins.', 'error'); return; }
  if (state.deckRun.deck.length <= 5) { showToast('Deck is too small to remove from.', 'error'); return; }
  state.deckRun.pickerState = { kind: 'remove', returnTo: 'shop', price: SHOP_PRICES.remove };
  saveState();
  renderDeck();
}
function shopOpenUpgrade() {
  const ss = state.deckRun.shopState;
  if (!ss || ss.upgradeUsed) return;
  if (state.coins < SHOP_PRICES.upgrade) { showToast('Not enough Charisma Coins.', 'error'); return; }
  // Need at least one un-upgraded card
  if (!state.deckRun.deck.some(id => !isUpgradedId(id) && cardById(id) && cardById(id).upgrade)) {
    showToast('No upgradeable cards in deck.', 'error');
    return;
  }
  state.deckRun.pickerState = { kind: 'upgrade-shop', returnTo: 'shop', price: SHOP_PRICES.upgrade };
  saveState();
  renderDeck();
}
function leaveShop() {
  state.deckRun.shopState = null;
  state.deckRun.crossroads = null; // done with this crossroads
  SFX.click();
  saveState();
  renderDeck();
}

// ---------- Rest ----------
function chooseRest(option) {
  SFX.click();
  if (option === 'heal') {
    const healAmt = 25;
    state.deckRun.composure = Math.min(state.deckRun.composureMax, state.deckRun.composure + healAmt);
    state.deckRun.crossroads = null;
    saveState();
    renderDeck();
  } else if (option === 'upgrade') {
    if (!state.deckRun.deck.some(id => !isUpgradedId(id) && cardById(id) && cardById(id).upgrade)) {
      showToast('No upgradeable cards in deck.', 'error');
      return;
    }
    state.deckRun.pickerState = { kind: 'upgrade-rest', returnTo: 'map', price: 0 };
    saveState();
    renderDeck();
  }
}

// ---------- Card-pick (for upgrade or remove) ----------
function applyPickerCard(deckIdx) {
  const ps = state.deckRun.pickerState;
  if (!ps) return;
  const currentId = state.deckRun.deck[deckIdx];
  if (currentId === undefined) return;

  if (ps.kind === 'remove') {
    state.deckRun.deck.splice(deckIdx, 1);
    state.coins -= ps.price;
    state.deckRun.shopState.removeUsed = true;
    SFX.unplace();
    refreshHeaderStats();
  } else if (ps.kind === 'upgrade-shop') {
    if (isUpgradedId(currentId)) { showToast('Already upgraded.', 'error'); return; }
    const c = cardById(currentId);
    if (!c || !c.upgrade) { showToast('Card has no upgrade.', 'error'); return; }
    state.deckRun.deck[deckIdx] = upgradedIdOf(currentId);
    state.coins -= ps.price;
    state.deckRun.shopState.upgradeUsed = true;
    SFX.coin();
    refreshHeaderStats();
  } else if (ps.kind === 'upgrade-rest') {
    if (isUpgradedId(currentId)) { showToast('Already upgraded.', 'error'); return; }
    const c = cardById(currentId);
    if (!c || !c.upgrade) { showToast('Card has no upgrade.', 'error'); return; }
    state.deckRun.deck[deckIdx] = upgradedIdOf(currentId);
    SFX.coin();
  }

  // Return to shop or close crossroads
  const returnTo = ps.returnTo;
  state.deckRun.pickerState = null;
  if (returnTo === 'map') {
    state.deckRun.crossroads = null;
  }
  saveState();
  renderDeck();
}
function cancelPicker() {
  state.deckRun.pickerState = null;
  SFX.click();
  saveState();
  renderDeck();
}

function dismissRunResult() {
  state.deckRun.lastResult = null;
  saveState();
  renderDeck();
}

// ================================================================
// DECK MODE — Renderers
// ================================================================
function renderDeck() {
  const container = document.getElementById('deck-content');
  if (!container) return;
  const dr = state.deckRun;

  // 1. End-of-run screen takes priority
  if (dr.lastResult && !dr.active) {
    container.innerHTML = renderRunEnd(dr.lastResult);
    return;
  }
  // 2. Mid-fight has its own UI
  if (_fight && !_fight.over) {
    container.innerHTML = renderFight();
    applyFightAnimations();
    return;
  }
  // 3. Active run states (in priority order):
  if (dr.active) {
    // Card picker (for upgrade or remove) overrides everything
    if (dr.pickerState) {
      container.innerHTML = renderCardPicker(dr.pickerState);
      return;
    }
    // Crossroads sub-states
    if (dr.crossroads) {
      if (dr.crossroads.kind === 'choose') {
        container.innerHTML = renderCrossroads(dr.crossroads);
        return;
      }
      if (dr.crossroads.kind === 'pick-card') {
        container.innerHTML = renderCardPick(dr.crossroads);
        return;
      }
      if (dr.crossroads.kind === 'shop') {
        container.innerHTML = renderShop();
        return;
      }
      if (dr.crossroads.kind === 'rest') {
        container.innerHTML = renderRest();
        return;
      }
    }
    // Default: run map
    container.innerHTML = renderRunMap();
    return;
  }
  // 5. No active run: show home
  container.innerHTML = renderDeckHome();
}

// Consume any queued FX from the last play action (damage floats, shakes).
function applyFightAnimations() {
  if (!_fight || !_fight._fx || _fight._fx.length === 0) return;
  const fx = _fight._fx.slice();
  _fight._fx = [];
  for (const f of fx) {
    if (f.kind === 'damage') {
      if (f.target === 'player') {
        const el = document.querySelector('.composure-bar-wrap');
        if (el) {
          el.classList.add('hit');
          setTimeout(() => el.classList.remove('hit'), 320);
          spawnDamageFloat(el, '-' + f.value);
        }
        const ap = document.querySelector('.audience-panel');
        if (ap && f.flavor !== 'self' && !f.flavor) {
          // No shake on self-damage
        }
      } else if (f.target === 'audience') {
        const em = document.querySelector('.audience-emoji');
        const panel = document.querySelector('.audience-panel');
        if (em) { em.classList.add('hit'); setTimeout(() => em.classList.remove('hit'), 460); }
        if (panel) {
          spawnDamageFloat(panel, '-' + f.value, 'persuasion' + (f.value >= 12 ? ' heavy' : ''));
        }
      }
    }
  }
}
function spawnDamageFloat(parent, text, extraCls) {
  if (!parent) return;
  if (state.settings && state.settings.animations === false) return;
  // Parent needs position:relative; .audience-panel and .composure-bar-wrap both have it implicitly
  const wrap = parent;
  if (getComputedStyle(wrap).position === 'static') wrap.style.position = 'relative';
  const el = document.createElement('div');
  el.className = 'damage-float ' + (extraCls || '');
  el.textContent = text;
  wrap.appendChild(el);
  setTimeout(() => { try { el.remove(); } catch(e){} }, 900);
}

  return `

        <div class="run-stats">
          <div class="run-stat"><div class="run-stat-label">Runs Won</div><div class="run-stat-value">${dr.runsCompleted || 0}</div></div>
          <div class="run-stat"><div class="run-stat-label">Runs Lost</div><div class="run-stat-value">${dr.runsLost || 0}</div></div>

function composureClass(cur, max) {
  const pct = cur / max;
  if (pct <= 0.25) return 'critical';
  if (pct <= 0.5) return 'low';
  return '';
}

  const dr = state.deckRun;

  return `

function renderMapNode(node, idx, dr) {
  const aud = audienceById(node.audienceId);
  const done = node.done;
  const isCurrent = !done && idx === dr.fightsCompleted;
  const isLocked = !done && !isCurrent;
  const tierLabel = node.isBoss ? 'Boss' : node.isElite ? 'Elite' : 'Normal';
  const cls = [done ? 'done' : '', isCurrent ? 'current' : '', isLocked ? 'locked' : '',
               node.isBoss ? 'boss' : '', node.isElite ? 'boss' : ''].filter(Boolean).join(' ');
  const click = isCurrent ? `onclick="startFight(${idx})"` : '';
  const cta = done ? '✓ Done' : isCurrent ? `Fight ${node.isBoss ? '👑' : node.isElite ? '⚡' : '→'}` : 'Locked';
  return `
    <div class="map-node ${cls}" ${click}>
      <div class="map-node-icon">${aud ? aud.emoji : '?'}</div>
      <div class="map-node-body">
        <div class="map-node-title">${aud ? aud.name : 'Unknown'}${node.isBoss ? ' (Boss)' : node.isElite ? ' (Elite)' : ''}</div>
        <div class="map-node-sub">${aud ? aud.desc : ''}${aud && aud.passive ? ` · <em style="color:var(--purple)">${aud.passive.label}</em>` : ''}</div>
      </div>
      <div class="map-node-cta">${cta}</div>
    </div>
  `;
}

function renderCardHTML(card) {

  `;
}

function renderCardHTMLForHand(card, handIdx, energy) {

  return `
    <div class="card ${cls}" data-type="${card.type}" data-cost="${card.cost}" data-rarity="${card.rarity}" ${click}>

// ---------- Card picker (for upgrade or remove) ----------
function renderCardPicker(ps) {
  // For upgrade: only show un-upgraded cards with available upgrade defs.
  // For remove: show everything.
  const showAll = ps.kind === 'remove';
  const eligible = state.deckRun.deck
    .map((id, idx) => ({ id, idx }))
    .filter(({ id }) => {
      if (showAll) return true;
      if (isUpgradedId(id)) return false;
      const c = cardById(id);
      return c && c.upgrade;
    });

  let title, sub;
  if (ps.kind === 'remove')       { title = 'Pick a card to remove'; sub = 'It will be permanently removed from this run\'s deck.'; }
  else                            { title = 'Pick a card to upgrade'; sub = ps.kind === 'upgrade-shop' ? `Cost: ${ps.price} 🪙. The upgraded version replaces the original in your deck.` : 'The upgraded version replaces the original in your deck.'; }

  return `
    <div class="card-pick-screen">
      <div class="card-pick-header">
        <div>
          <h2>${title}</h2>
          <div class="sub">${sub}</div>
        </div>
        <button class="btn btn-ghost" onclick="cancelPicker()">Cancel</button>
      </div>
      ${eligible.length === 0 ? `
        <div class="card-pick-empty">Nothing eligible to ${ps.kind === 'remove' ? 'remove' : 'upgrade'}.</div>
      ` : `
        <div class="card-grid">
          ${eligible.map(({ id, idx }) => {
            const c = cardById(id);
            if (!c) return '';
            return `<div onclick="applyPickerCard(${idx})">${renderCardHTML(c)}</div>`;
          }).join('')}
        </div>
      `}
    </div>
  `;
}

// ================================================================

function navigate(view) {
  SFX.click();
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const target = document.getElementById('view-' + view);
  if (target) target.classList.add('active');
  if (view === 'home') renderHome();
  if (view === 'wordle') renderWordle();
  if (view === 'deck')  renderDeck();
  if (view === 'composer') renderComposer();
  if (view === 'tower') renderTower();
  if (view === 'pulse') renderPulse();
  if (view === 'settings') renderSettings();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ================================================================
// WORDLE — gameplay
// ================================================================
let _wordle = null; // transient session state

function startWordleSession() {
  const today = todayKey();
  const puzzle = todayPuzzle();

  // Resume if mid-game
  if (state.wordleInProgress && state.wordleInProgress.day === today) {
    _wordle = {
      day: today,
      puzzleId: puzzle.id,
      puzzle,
      tilePool: buildTilePool(puzzle, today),
      attempts: state.wordleInProgress.attempts.slice(),
      slots: state.wordleInProgress.slots.slice(),
      selectedSlot: 0,
      finished: false
    };
  } else {
    _wordle = {
      day: today,
      puzzleId: puzzle.id,
      puzzle,
      tilePool: buildTilePool(puzzle, today),
      attempts: [],
      slots: puzzle.slots.map(() => null),
      selectedSlot: 0,
      finished: false
    };
    state.wordleInProgress = { day: today, attempts: [], slots: _wordle.slots.slice(), puzzleId: puzzle.id };
    saveState();
  }

  // If already finished today, present the endgame screen
  if (state.wordleDailyResult && state.wordleDailyResult.day === today) {
    _wordle.finished = true;
  }
}

function persistWordleProgress() {
  if (!_wordle || _wordle.finished) return;
  state.wordleInProgress = {
    day: _wordle.day,
    attempts: _wordle.attempts.slice(),
    slots: _wordle.slots.slice(),
    puzzleId: _wordle.puzzleId
  };
  saveState();
}

function renderWordle() {
  if (!_wordle || _wordle.day !== todayKey()) startWordleSession();
  const container = document.getElementById('wordle-content');
  const w = _wordle;
  const usedTileIds = new Set(w.slots.filter(Boolean));
  const attemptsLeft = WORDLE_MAX_ATTEMPTS - w.attempts.length;
  const allSlotsFilled = w.slots.every(Boolean);
  const todayResult = (state.wordleDailyResult && state.wordleDailyResult.day === w.day) ? state.wordleDailyResult : null;

  container.innerHTML = `
    <div class="wordle-back" onclick="navigate('home')">← Back to modes</div>

    <div class="wordle">

      <div class="wordle-main">

        ${todayResult ? renderEndgame(todayResult) : ''}

        <div class="wordle-prompt-card">
          <div class="wordle-meta">
            <span>SpeakGame #${todayPuzzleNumber()}</span>
            <span class="wordle-meta-divider">·</span>
            <span>${w.puzzle.framework}</span>
            <span class="wordle-meta-divider">·</span>
            <span>${attemptsLeft} ${attemptsLeft === 1 ? 'attempt' : 'attempts'} left</span>
          </div>
          <div class="wordle-prompt">${w.puzzle.prompt}</div>
        </div>

        <div class="wordle-slots">
          ${w.slots.map((tileId, i) => {
            const slot = w.puzzle.slots[i];
            const filled = !!tileId;
            const selected = !w.finished && !todayResult && i === w.selectedSlot && !filled;
            return `
              <div class="wordle-slot ${filled ? 'filled' : ''} ${selected ? 'selected' : ''}"
                   onclick="onSlotClick(${i})">
                <span class="wordle-slot-label">${slot.label}</span>
                <div class="wordle-slot-content">
                  ${filled
                    ? `<span class="wordle-slot-text">${phraseById(tileId).text}</span>`
                    : `<span class="wordle-slot-empty">Tap to fill from the pool below…</span>`}
                </div>
                ${filled ? `<button class="wordle-slot-clear" onclick="event.stopPropagation(); clearSlot(${i})" aria-label="Clear slot">✕</button>` : ''}
              </div>
            `;
          }).join('')}
        </div>

        ${!todayResult ? `
          <div class="tile-pool" id="tile-pool">
            ${w.tilePool.map(tileId => {
              const ph = phraseById(tileId);
              const used = usedTileIds.has(tileId);
              return `
                <button class="tile ${used ? 'used' : ''}"
                        ${used ? '' : `onclick="onTileClick('${tileId}')"`}
                        title="${ph.role}">
                  ${ph.text}
                </button>
              `;
            }).join('')}
          </div>

          <div class="wordle-actions">
            <button class="btn btn-ghost btn-sm" onclick="resetCurrentAttempt()">
              Clear slots
            </button>
            <div class="spacer"></div>
            <div class="wordle-attempts-left">${w.attempts.length} / ${WORDLE_MAX_ATTEMPTS} attempts used</div>
            <button class="btn btn-primary btn-lg" ${allSlotsFilled ? '' : 'disabled'}
                    onclick="submitWordleAttempt()">
              Submit attempt
            </button>
          </div>
        ` : ''}

      </div>

      <aside class="wordle-side">
        <div class="side-card">
          <h4>Attempts</h4>
          ${w.attempts.length === 0 ? `
            <p style="color:var(--text-mute);font-size:0.85rem">Your guesses will appear here, color-coded.</p>
          ` : w.attempts.map(a => `
            <div class="wordle-history-row">
              ${a.feedback.map(f => `
                <div class="wordle-history-cell ${f}">
                  ${f === 'correct' ? '✓' : f === 'misplaced' ? '◐' : '·'}
                </div>
              `).join('')}
            </div>
          `).join('')}
        </div>

        <div class="side-card">
          <h4>Streak</h4>
          <div class="streak-big">${state.wordleStreak}🔥</div>
          <div class="streak-sub">${state.wordleStreak === 0 ? 'Solve today to start' : 'consecutive day' + (state.wordleStreak === 1 ? '' : 's')}</div>
          <div class="streak-sub">Best: ${state.wordleLongestStreak}</div>
        </div>

        <div class="side-card">
          <h4>How it works</h4>
          <p style="font-size:0.85rem;color:var(--text-dim);line-height:1.5">
            🟩 <strong>Green</strong> — phrase is correct for that slot.<br>
            🟨 <strong>Yellow</strong> — correct phrase, wrong slot.<br>
            ⬜ <strong>Grey</strong> — not in today’s answer.<br><br>
            Filler-buzzword tiles are never the answer. Avoid them.
          </p>
        </div>
      </aside>

    </div>
  `;
}

function onTileClick(tileId) {
  if (!_wordle || _wordle.finished) return;
  const w = _wordle;
  // Already used?
  if (w.slots.includes(tileId)) return;
  // Find next empty slot starting at selectedSlot, wrapping
  let targetSlot = w.selectedSlot;
  if (w.slots[targetSlot] !== null) {
    // Find first empty
    const firstEmpty = w.slots.findIndex(s => s === null);
    if (firstEmpty === -1) {
      showToast('All slots are filled — submit or clear one.');
      return;
    }
    targetSlot = firstEmpty;
  }
  w.slots[targetSlot] = tileId;
  // Advance selectedSlot to next empty
  const next = w.slots.findIndex((s, i) => i > targetSlot && s === null);
  w.selectedSlot = next === -1 ? w.slots.findIndex(s => s === null) : next;
  if (w.selectedSlot === -1) w.selectedSlot = targetSlot;
  SFX.place();
  persistWordleProgress();
  renderWordle();
}

function onSlotClick(slotIdx) {
  if (!_wordle || _wordle.finished) return;
  _wordle.selectedSlot = slotIdx;
  SFX.click();
  renderWordle();
}

function clearSlot(slotIdx) {
  if (!_wordle || _wordle.finished) return;
  _wordle.slots[slotIdx] = null;
  _wordle.selectedSlot = slotIdx;
  SFX.unplace();
  persistWordleProgress();
  renderWordle();
}

function resetCurrentAttempt() {
  if (!_wordle || _wordle.finished) return;
  _wordle.slots = _wordle.puzzle.slots.map(() => null);
  _wordle.selectedSlot = 0;
  SFX.unplace();
  persistWordleProgress();
  renderWordle();
}

// Submit an attempt: compute per-slot feedback, check win, record.
function submitWordleAttempt() {
  const w = _wordle;
  if (!w || w.finished) return;
  if (!w.slots.every(Boolean)) {
    showToast('Fill every slot first.', 'error');
    return;
  }
  SFX.submit();

  const correctIds = w.puzzle.slots.map(s => s.correctId);
  const feedback = w.slots.map((tileId, i) => {
    if (tileId === correctIds[i]) return 'correct';
    if (correctIds.includes(tileId)) return 'misplaced';
    return 'wrong';
  });
  w.attempts.push({ slots: w.slots.slice(), feedback });

  const won = feedback.every(f => f === 'correct');
  const lost = !won && w.attempts.length >= WORDLE_MAX_ATTEMPTS;

  if (won) {
    SFX.win();
    finishWordleSession(true);
  } else if (lost) {
    SFX.lose();
    finishWordleSession(false);
  } else {
    SFX.miss();
    // Clear slots for next attempt, but keep selectedSlot at 0
    w.slots = w.puzzle.slots.map(() => null);
    w.selectedSlot = 0;
    persistWordleProgress();
    renderWordle();
  }
}

function finishWordleSession(won) {
  const w = _wordle;
  const attemptsUsed = w.attempts.length;
  // Rewards: sliding scale based on attempts. Lose = participation reward.
  const rewardTable = [
    { xp: 100, coins: 50 },
    { xp: 80,  coins: 40 },
    { xp: 65,  coins: 32 },
    { xp: 50,  coins: 25 },
    { xp: 40,  coins: 18 },
    { xp: 30,  coins: 12 }
  ];
  const reward = won ? rewardTable[attemptsUsed - 1] : { xp: 10, coins: 0 };

  // Streak bookkeeping
  if (won) {
    const today = w.day;
    const last = state.wordleLastPlayedDay;
    if (last) {
      const yesterday = (() => {
        const d = new Date(); d.setDate(d.getDate() - 1);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      })();
      if (last === yesterday) state.wordleStreak += 1;
      else if (last !== today) state.wordleStreak = 1;
      // if last === today, no change (already counted)
    } else {
      state.wordleStreak = 1;
    }
    state.wordleLongestStreak = Math.max(state.wordleLongestStreak, state.wordleStreak);
  } else {
    state.wordleStreak = 0;
  }
  state.wordleLastPlayedDay = w.day;

  // Apply reward
  state.xp += reward.xp;
  state.coins += reward.coins;
  if (reward.coins > 0) setTimeout(() => SFX.coin(), 250);

  // Build the share grid (3 emoji per attempt row)
  const emojiFor = f => f === 'correct' ? '🟩' : f === 'misplaced' ? '🟨' : '⬛';
  const gridText = w.attempts.map(a => a.feedback.map(emojiFor).join('')).join('\n');

  state.wordleDailyResult = {
    day: w.day,
    won,
    attempts: attemptsUsed,
    rows: w.attempts.map(a => a.feedback),
    xpEarned: reward.xp,
    coinsEarned: reward.coins,
    gridText
  };
  state.wordleInProgress = null;
  saveState();
  refreshHeaderStats();

  w.finished = true;
  renderWordle();
}

function renderEndgame(result) {
  const headline = result.won
    ? (result.attempts === 1 ? 'Perfect. First try.' : `Solved in ${result.attempts}.`)
    : 'Streak broken — back tomorrow.';
  const sub = result.won
    ? 'New puzzle at local midnight. Streak holds if you come back tomorrow.'
    : 'The solution is shown below in green. New puzzle at local midnight.';
  return `
    <div class="endgame ${result.won ? '' : 'lose'}">
      <h2>${headline}</h2>
      <p>${sub}</p>
      <div class="endgame-rewards">
        <span class="endgame-reward xp">+${result.xpEarned} XP</span>
        ${result.coinsEarned > 0 ? `<span class="endgame-reward coins">+${result.coinsEarned} 🪙</span>` : ''}
        ${result.won ? `<span class="endgame-reward">🔥 ${state.wordleStreak} streak</span>` : ''}
      </div>
      <div class="endgame-share-grid">SpeakGame #${todayPuzzleNumber()} ${result.won ? result.attempts : 'X'}/${WORDLE_MAX_ATTEMPTS}\n${result.gridText}</div>
      <button class="btn btn-primary" onclick="copyShareGrid()">Copy share grid</button>
      <button class="btn btn-ghost" onclick="navigate('home')">Back to modes</button>
    </div>
  `;
}

function copyShareGrid() {
  const result = state.wordleDailyResult;
  if (!result) return;
  const text = `SpeakGame #${todayPuzzleNumber()} ${result.won ? result.attempts : 'X'}/${WORDLE_MAX_ATTEMPTS}\n${result.gridText}`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => showToast('Copied to clipboard.', 'success'),
      () => showToast('Copy failed — long-press to select.', 'error')
    );
  } else {
    showToast('Long-press to copy.', 'error');
  }
}

// ================================================================
// SETTINGS
// ================================================================
function renderSettings() {
  const s = state.settings;
  const container = document.getElementById('settings-content');
  container.innerHTML = `
    <div class="settings-card">
      <h3>Display</h3>
      <div class="setting-row">
        <div>
          <div class="setting-label">Dark mode</div>
          <div class="setting-desc">Switch between dark (default) and light themes.</div>
        </div>
        <div class="setting-toggle ${s.theme === 'dark' ? 'on' : ''}" onclick="toggleSetting('theme')"></div>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-label">Animations</div>
          <div class="setting-desc">Card flips, score bounces. Turn off for snappier (and less juicy) UI.</div>
        </div>
        <div class="setting-toggle ${s.animations ? 'on' : ''}" onclick="toggleSetting('animations')"></div>
      </div>
    </div>

    <div class="settings-card">
      <h3>Sound</h3>
      <div class="setting-row">
        <div>
          <div class="setting-label">Sound effects</div>
          <div class="setting-desc">Web-Audio tones for clicks, tile placement, wins, and misses.</div>
        </div>
        <div class="setting-toggle ${s.sound ? 'on' : ''}" onclick="toggleSetting('sound')"></div>
      </div>
    </div>

    <div class="settings-card">
      <h3>Data</h3>
      <div class="setting-row">
        <div>
          <div class="setting-label">Reset SpeakGame progress</div>
          <div class="setting-desc">Permanently delete XP, Coins, streak, and today’s puzzle progress. Cannot be undone.</div>
        </div>
        <button class="btn btn-sm" style="color:var(--red);border-color:var(--red)" onclick="resetEverything()">Reset</button>
      </div>
    </div>

    <p style="font-size:0.75rem;color:var(--text-mute);text-align:center;margin-top:1rem">
      SpeakGame v0.1 — Daily Wordle live. Deckbuilder, Composer, Tower coming.
    </p>
  `;
}

function toggleSetting(key) {
  SFX.click();
  if (key === 'theme') {
    state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
    applyTheme();
  } else {
    state.settings[key] = !state.settings[key];
  }
  if (key === 'animations') applyAnimations();
  saveState();
  renderSettings();
}
function applyTheme() { document.body.setAttribute('data-theme', state.settings.theme); }
function applyAnimations() {
  document.body.style.setProperty('--anim-on', state.settings.animations ? '1' : '0');
  // The reduced-motion rules cover this if needed; we leave individual animations to honor the OS pref.
}

function resetEverything() {
  if (!confirm('Reset all SpeakGame progress? This deletes XP, Coins, streak, and today’s puzzle.')) return;
  localStorage.removeItem(STATE_KEY);
  location.reload();
}

// ================================================================
// TOAST
// ================================================================
let _toastTimer = null;
function showToast(msg, kind) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.classList.remove('show'); }, 2200);
}

// INIT
// ================================================================
function init() {
  loadState();
  applyTheme();
  applyAnimations();
  refreshHeaderStats();
  renderHome();
}
document.addEventListener('DOMContentLoaded', init);
