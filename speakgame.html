<title>SpeakGame — A game of rhetoric</title>

<style>
/* ================================================================
   THEME VARIABLES — dark mode primary, light mode also supported
   ================================================================ */
:root {
  /* Dark theme (default) */
  --bg: #0a1726;
  --bg-elev: #122236;
  --bg-elev-2: #1a2d45;
  --bg-card: #14253b;
  --border: #243752;
  --border-strong: #34527a;

  --text: #e6eef8;
  --text-dim: #9ab0c8;
  --text-mute: #5e7796;

  --accent: #2dd4bf;          /* neon teal — primary action */
  --accent-soft: rgba(45,212,191,0.14);
  --accent-glow: rgba(45,212,191,0.45);

  --gold: #ffd166;
  --gold-soft: rgba(255,209,102,0.16);
  --orange: #ff8a4c;
  --pink: #ff5d8f;
  --red: #ef5350;
  --red-soft: rgba(239,83,80,0.18);
  --green: #4ade80;
  --green-soft: rgba(74,222,128,0.18);
  --yellow: #facc15;
  --yellow-soft: rgba(250,204,21,0.18);
  --purple: #a78bfa;

  --shadow: 0 8px 30px rgba(0,0,0,0.45);
  --shadow-lg: 0 18px 50px rgba(0,0,0,0.55);
  --shadow-glow: 0 0 30px var(--accent-glow);

  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 18px;
  --radius-xl: 28px;

  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --font-display: "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
}
[data-theme="light"] {
  --bg: #fdfaf5;
  --bg-elev: #ffffff;
  --bg-elev-2: #f5efe4;
  --bg-card: #ffffff;
  --border: #e8dccb;
  --border-strong: #cdb999;

  --text: #1f1a14;
  --text-dim: #5a5045;
  --text-mute: #95887a;

  --accent: #0d9488;
  --accent-soft: rgba(13,148,136,0.10);
  --accent-glow: rgba(13,148,136,0.25);

  --gold: #d4a017;
  --gold-soft: rgba(212,160,23,0.12);
  --orange: #ea580c;
  --pink: #be185d;
  --red: #b91c1c;
  --red-soft: rgba(185,28,28,0.10);
  --green: #15803d;
  --green-soft: rgba(21,128,61,0.12);
  --yellow: #ca8a04;
  --yellow-soft: rgba(202,138,4,0.12);
  --purple: #7c3aed;

  --shadow: 0 4px 14px rgba(60,40,10,0.10);
  --shadow-lg: 0 10px 30px rgba(60,40,10,0.15);
  --shadow-glow: 0 0 24px var(--accent-glow);
}

/* ================================================================
   GLOBAL RESET + BASE
   ================================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 16px; line-height: 1.45;
  overscroll-behavior: none;
  /* iOS safe-area handling */
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); text-decoration: none; }
[hidden] { display: none !important; }

/* ================================================================
   LAYOUT — header + main + view system
   ================================================================ */
.app {
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
  max-width: 1400px; margin: 0 auto;
  padding: 1rem;
}
@media (min-width: 900px) { .app { padding: 1.5rem 2rem; } }

.header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; margin-bottom: 1.25rem;
  padding-bottom: 1rem; border-bottom: 1px solid var(--border);
}
.brand {
  display: flex; align-items: center; gap: 0.6rem;
  font-family: var(--font-display); font-weight: 800; font-size: 1.25rem;
  letter-spacing: -0.01em;
  cursor: pointer;
}
.brand-mark {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; color: #0a1726; font-size: 1.1rem;
  box-shadow: var(--shadow-glow);
}
.brand-name span { color: var(--accent); }

.header-stats {
  display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  justify-content: flex-end;
}
.stat-chip {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.4rem 0.7rem; border-radius: 999px;
  background: var(--bg-elev); border: 1px solid var(--border);
  font-size: 0.85rem; font-weight: 600;
}
.stat-chip.xp { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.stat-chip.coins { color: var(--gold); border-color: var(--gold); background: var(--gold-soft); }
.stat-chip-ico { font-size: 1rem; line-height: 1; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px;
  background: var(--bg-elev); border: 1px solid var(--border);
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform 0.1s ease, border-color 0.15s ease;
}
.icon-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.icon-btn:active { transform: translateY(0); }
.icon-btn svg { width: 18px; height: 18px; }

main { flex: 1; }
.view { display: none; }
.view.active { display: block; animation: fade-in 0.18s ease; }
@keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* ================================================================
   HOME — mode picker
   ================================================================ */
.hero {
  padding: 1.5rem; margin-bottom: 1.25rem;
  background: linear-gradient(135deg, var(--bg-elev) 0%, var(--bg-elev-2) 100%);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at top right, var(--accent-glow), transparent 50%);
  opacity: 0.5; pointer-events: none;
}
.hero h1 {
  font-family: var(--font-display); font-weight: 900;
  font-size: clamp(1.6rem, 4vw, 2.4rem); line-height: 1.1;
  letter-spacing: -0.02em;
  margin-bottom: 0.4rem;
  position: relative;
}
.hero h1 span { color: var(--accent); }
.hero p {
  color: var(--text-dim); max-width: 560px;
  position: relative;
}

.mode-grid {
  display: grid; gap: 1rem;
  grid-template-columns: 1fr;
}
@media (min-width: 640px) { .mode-grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1100px) { .mode-grid { grid-template-columns: repeat(2, 1fr); gap: 1.2rem; } }

.mode-card {
  position: relative;
  padding: 1.5rem; min-height: 180px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); cursor: pointer;
  display: flex; flex-direction: column; gap: 0.65rem;
  transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  overflow: hidden;
  text-align: left;
}
.mode-card:hover:not(.locked) {
  border-color: var(--accent); transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
}
.mode-card.locked { opacity: 0.55; cursor: not-allowed; }
.mode-card::before {
  content: ''; position: absolute; inset: 0;
  background: var(--accent-tint, transparent);
  opacity: 0.06; pointer-events: none;
}
.mode-card[data-accent="teal"]   { --accent-tint: var(--accent); }
.mode-card[data-accent="gold"]   { --accent-tint: var(--gold); }
.mode-card[data-accent="orange"] { --accent-tint: var(--orange); }
.mode-card[data-accent="purple"] { --accent-tint: var(--purple); }

.mode-card-head {
  display: flex; align-items: center; gap: 0.75rem;
}
.mode-card-icon {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--bg-elev-2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; line-height: 1; flex-shrink: 0;
}
.mode-card[data-accent="teal"] .mode-card-icon   { color: var(--accent); border-color: var(--accent); }
.mode-card[data-accent="gold"] .mode-card-icon   { color: var(--gold); border-color: var(--gold); }
.mode-card[data-accent="orange"] .mode-card-icon { color: var(--orange); border-color: var(--orange); }
.mode-card[data-accent="purple"] .mode-card-icon { color: var(--purple); border-color: var(--purple); }
.mode-card h3 {
  font-family: var(--font-display); font-size: 1.15rem; font-weight: 800;
  letter-spacing: -0.01em;
}
.mode-card-tag {
  font-size: 0.68rem; font-weight: 700; color: var(--text-mute);
  letter-spacing: 0.06em; text-transform: uppercase;
}
.mode-card p { color: var(--text-dim); font-size: 0.92rem; line-height: 1.45; flex: 1; }
.mode-card-footer {
  display: flex; align-items: center; justify-content: space-between;
  gap: 0.5rem; padding-top: 0.5rem;
  border-top: 1px solid var(--border);
}
.mode-card-status {
  font-size: 0.78rem; color: var(--text-dim); font-weight: 600;
}
.mode-card-status.fresh { color: var(--accent); }
.mode-card-status.done { color: var(--green); }
.mode-card-cta {
  font-size: 0.85rem; font-weight: 700; color: var(--accent);
  display: inline-flex; align-items: center; gap: 0.3rem;
}
.locked-pill {
  display: inline-block; padding: 0.15rem 0.55rem; border-radius: 999px;
  background: var(--bg-elev); border: 1px solid var(--border);
  color: var(--text-mute); font-size: 0.65rem; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
}

/* ================================================================
   BUTTONS
   ================================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 0.5rem; padding: 0.7rem 1.1rem; border-radius: var(--radius);
  font-weight: 700; font-size: 0.95rem; cursor: pointer;
  background: var(--bg-elev); border: 1px solid var(--border);
  color: var(--text); transition: all 0.15s ease;
  user-select: none;
}
.btn:hover { transform: translateY(-1px); border-color: var(--text-mute); }
.btn:active { transform: translateY(0); }
.btn-primary {
  background: var(--accent); border-color: var(--accent);
  color: #0a1726; box-shadow: var(--shadow-glow);
}
.btn-primary:hover { filter: brightness(1.1); border-color: var(--accent); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-dim); }
.btn-ghost:hover { color: var(--text); background: var(--bg-elev); }
.btn-sm { padding: 0.4rem 0.7rem; font-size: 0.82rem; }
.btn-lg { padding: 0.85rem 1.4rem; font-size: 1.02rem; }
.btn[disabled] { opacity: 0.5; pointer-events: none; }

/* ================================================================
   WORDLE MODE
   ================================================================ */
.wordle {
  display: grid; gap: 1.25rem;
  grid-template-columns: 1fr;
}
@media (min-width: 1100px) {
  .wordle { grid-template-columns: 1fr 360px; }
}

.wordle-back {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-size: 0.85rem; color: var(--text-dim); font-weight: 600;
  margin-bottom: 0.75rem; cursor: pointer;
}
.wordle-back:hover { color: var(--accent); }

.wordle-main { min-width: 0; }

.wordle-prompt-card {
  padding: 1.25rem 1.4rem;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); margin-bottom: 1rem;
}
.wordle-meta {
  display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;
  margin-bottom: 0.6rem;
  font-size: 0.75rem; color: var(--text-mute);
  letter-spacing: 0.04em; text-transform: uppercase; font-weight: 700;
}
.wordle-meta-divider { color: var(--border-strong); }
.wordle-prompt {
  font-family: var(--font-display); font-size: 1.1rem; line-height: 1.45;
  font-weight: 600;
}
.wordle-prompt em { font-style: normal; color: var(--accent); font-weight: 700; }

.wordle-slots {
  display: grid; gap: 0.6rem; margin-bottom: 1.2rem;
  grid-template-columns: 1fr;
}
.wordle-slot {
  position: relative;
  display: flex; align-items: center;
  min-height: 56px; padding: 0.7rem 1rem;
  background: var(--bg-elev); border: 2px dashed var(--border);
  border-radius: var(--radius); transition: all 0.15s ease;
  font-size: 0.92rem; line-height: 1.35;
}
.wordle-slot:hover { border-color: var(--text-mute); }
.wordle-slot.selected { border-color: var(--accent); background: var(--accent-soft); border-style: solid; }
.wordle-slot.filled { border-style: solid; }
.wordle-slot-label {
  font-size: 0.65rem; font-weight: 700; color: var(--text-mute);
  letter-spacing: 0.08em; text-transform: uppercase;
  position: absolute; top: -8px; left: 14px;
  padding: 0 0.4rem; background: var(--bg);
}
.wordle-slot-content { width: 100%; }
.wordle-slot-empty {
  color: var(--text-mute); font-style: italic; font-size: 0.85rem;
}
.wordle-slot-text { color: var(--text); }
.wordle-slot-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--bg-elev-2); color: var(--text-mute);
  display: none; align-items: center; justify-content: center; font-size: 0.85rem;
}
.wordle-slot.filled .wordle-slot-clear { display: inline-flex; }
.wordle-slot-clear:hover { color: var(--red); }

.tile-pool {
  display: grid; gap: 0.5rem;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  margin-bottom: 1.25rem;
}
@media (min-width: 900px) {
  .tile-pool { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
}
.tile {
  padding: 0.7rem 0.9rem; min-height: 60px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); cursor: pointer;
  font-size: 0.85rem; line-height: 1.4;
  text-align: left; user-select: none;
  transition: transform 0.1s ease, border-color 0.15s ease, opacity 0.15s ease;
  position: relative;
}
.tile:hover { transform: translateY(-2px); border-color: var(--accent); }
.tile.used { opacity: 0.35; cursor: not-allowed; }
.tile.used:hover { transform: none; border-color: var(--border); }
.tile.feedback-correct { border-color: var(--green); background: var(--green-soft); }
.tile.feedback-misplaced { border-color: var(--yellow); background: var(--yellow-soft); }
.tile.feedback-wrong { border-color: var(--border); opacity: 0.4; }

.wordle-actions {
  display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem;
  align-items: center;
}
.wordle-actions .spacer { flex: 1; }
.wordle-attempts-left {
  font-size: 0.85rem; color: var(--text-dim); font-weight: 600;
}

/* Attempts history grid (a la Wordle) */
.wordle-history {
  padding: 1rem 1.1rem;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.wordle-history h4 {
  font-family: var(--font-display); font-size: 0.92rem; font-weight: 700;
  margin-bottom: 0.6rem; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.wordle-history-row {
  display: flex; gap: 0.35rem; margin-bottom: 0.4rem;
}
.wordle-history-cell {
  width: 32px; height: 32px; border-radius: 6px;
  background: var(--bg-elev); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; font-weight: 700;
}
.wordle-history-cell.correct  { background: var(--green); color: #0a1726; border-color: var(--green); }
.wordle-history-cell.misplaced { background: var(--yellow); color: #0a1726; border-color: var(--yellow); }
.wordle-history-cell.wrong    { background: var(--bg-elev-2); color: var(--text-mute); }

.wordle-side {
  display: flex; flex-direction: column; gap: 1rem;
}
.side-card {
  padding: 1rem 1.2rem;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.side-card h4 {
  font-family: var(--font-display); font-size: 0.85rem; font-weight: 700;
  color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 0.6rem;
}
.streak-big {
  font-family: var(--font-display); font-size: 2.5rem; font-weight: 900;
  line-height: 1; color: var(--accent);
}
.streak-sub { font-size: 0.85rem; color: var(--text-dim); margin-top: 0.25rem; }

/* End-of-game overlay */
.endgame {
  padding: 1.5rem 1.4rem; margin-bottom: 1rem;
  background: linear-gradient(135deg, var(--bg-elev) 0%, var(--bg-elev-2) 100%);
  border: 2px solid var(--accent); border-radius: var(--radius-lg);
  text-align: center;
  animation: pop-in 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.endgame.lose { border-color: var(--orange); }
.endgame h2 {
  font-family: var(--font-display); font-size: 1.5rem; font-weight: 900;
  margin-bottom: 0.4rem;
}
.endgame p { color: var(--text-dim); margin-bottom: 0.85rem; }
.endgame-rewards {
  display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;
  margin-bottom: 0.85rem;
}
.endgame-reward {
  padding: 0.4rem 0.85rem; border-radius: 999px;
  background: var(--bg-elev); border: 1px solid var(--border);
  font-weight: 700;
}
.endgame-reward.xp { color: var(--accent); border-color: var(--accent); }
.endgame-reward.coins { color: var(--gold); border-color: var(--gold); }
.endgame-share-grid {
  font-family: var(--font-mono); font-size: 1.3rem; line-height: 1.2;
  margin: 0.85rem 0; user-select: all;
  white-space: pre;
}
@keyframes pop-in {
  0% { transform: scale(0.9); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* Tile flip animation when feedback arrives */
@keyframes flip-cell {
  0%   { transform: rotateX(0); }
  50%  { transform: rotateX(90deg); }
  100% { transform: rotateX(0); }
}
.wordle-history-cell.flipping { animation: flip-cell 0.45s ease; }

/* ================================================================
   SETTINGS
   ================================================================ */
.settings-card {
  padding: 1.2rem; margin-bottom: 1rem;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.settings-card h3 {
  font-family: var(--font-display); font-size: 0.92rem; font-weight: 700;
  color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em;
  margin-bottom: 0.75rem;
}
.setting-row {
  display: flex; justify-content: space-between; align-items: center;
  gap: 1rem; padding: 0.65rem 0;
  border-bottom: 1px solid var(--border);
}
.setting-row:last-child { border-bottom: none; }
.setting-label { font-weight: 600; }
.setting-desc { font-size: 0.8rem; color: var(--text-dim); margin-top: 0.2rem; }
.setting-toggle {
  width: 46px; height: 26px; border-radius: 999px;
  background: var(--bg-elev-2); border: 1px solid var(--border);
  position: relative; cursor: pointer; transition: background 0.18s ease;
  flex-shrink: 0;
}
.setting-toggle::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--text-dim); transition: all 0.18s ease;
}
.setting-toggle.on { background: var(--accent); border-color: var(--accent); }
.setting-toggle.on::after { left: 22px; background: #0a1726; }

/* ================================================================
   TOAST
   ================================================================ */
.toast {
  position: fixed; bottom: max(1rem, env(safe-area-inset-bottom));
  left: 50%; transform: translateX(-50%);
  padding: 0.7rem 1.1rem; border-radius: 999px;
  background: var(--bg-elev-2); border: 1px solid var(--border-strong);
  font-size: 0.9rem; font-weight: 600;
  box-shadow: var(--shadow-lg);
  z-index: 9999; opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { color: var(--red); border-color: var(--red); }
.toast.success { color: var(--green); border-color: var(--green); }

/* ================================================================
   DECK MODE — run map, fight UI, cards, audience
   ================================================================ */

/* --- Deck home / run map --- */
.deck-screen { max-width: 980px; margin: 0 auto; }

.run-banner {
  padding: 1.5rem 1.4rem; margin-bottom: 1.25rem;
  background: linear-gradient(135deg, var(--bg-elev) 0%, var(--bg-elev-2) 100%);
  border: 1px solid var(--gold); border-radius: var(--radius-lg);
  position: relative; overflow: hidden;
}
.run-banner::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at top right, var(--gold-soft), transparent 60%);
  pointer-events: none;
}
.run-banner h2 {
  font-family: var(--font-display); font-size: 1.5rem; font-weight: 900;
  margin-bottom: 0.25rem; position: relative;
}
.run-banner p { color: var(--text-dim); position: relative; }

.run-stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem;
  margin: 0.85rem 0 0.5rem; position: relative;
}
.run-stat {
  padding: 0.6rem 0.8rem; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius);
}
.run-stat-label {
  font-size: 0.65rem; font-weight: 700; color: var(--text-mute);
  text-transform: uppercase; letter-spacing: 0.06em;
}
.run-stat-value {
  font-family: var(--font-display); font-size: 1.4rem; font-weight: 800;
  margin-top: 0.15rem;
}
.run-stat-value.coins { color: var(--gold); }
.run-stat-value.composure { color: var(--green); }
.run-stat-value.composure.low { color: var(--orange); }
.run-stat-value.composure.critical { color: var(--red); }

.run-map {
  display: flex; flex-direction: column; gap: 0.6rem;
  margin-bottom: 1.25rem;
}
.map-node {
  display: flex; align-items: center; gap: 0.85rem;
  padding: 0.95rem 1.1rem;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer;
  transition: transform 0.15s ease, border-color 0.15s ease;
  position: relative;
}
.map-node:hover:not(.locked):not(.done) {
  transform: translateX(4px); border-color: var(--accent);
}
.map-node.done { opacity: 0.6; cursor: default; border-color: var(--green); }
.map-node.locked { opacity: 0.4; cursor: not-allowed; }
.map-node.current { border-color: var(--accent); box-shadow: var(--shadow-glow); }
.map-node.boss { border-color: var(--gold); }
.map-node.boss.current { box-shadow: 0 0 30px var(--gold-soft); }
.map-node-icon {
  width: 42px; height: 42px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; flex-shrink: 0;
  background: var(--bg-elev-2); border: 1px solid var(--border);
}
.map-node.done .map-node-icon { background: var(--green-soft); border-color: var(--green); }
.map-node.boss .map-node-icon { background: var(--gold-soft); border-color: var(--gold); }
.map-node-body { flex: 1; min-width: 0; }
.map-node-title { font-weight: 700; font-size: 1rem; }
.map-node-sub { font-size: 0.78rem; color: var(--text-dim); margin-top: 0.15rem; }
.map-node-cta {
  font-size: 0.82rem; font-weight: 700; color: var(--accent);
  white-space: nowrap;
}
.map-node.done .map-node-cta { color: var(--green); }
.map-node.locked .map-node-cta { color: var(--text-mute); }

/* --- Deck inspection (between fights) --- */
.deck-section { margin-bottom: 1.25rem; }
.deck-section h3 {
  font-family: var(--font-display); font-size: 0.85rem; font-weight: 700;
  color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 0.5rem;
}
.card-grid {
  display: grid; gap: 0.6rem;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
}

/* --- Card visuals --- */
.card {
  position: relative;
  padding: 0.75rem 0.85rem; min-height: 130px;
  background: var(--bg-card); border: 2px solid var(--border);
  border-radius: var(--radius); cursor: pointer;
  display: flex; flex-direction: column; gap: 0.45rem;
  font-size: 0.82rem; line-height: 1.35; user-select: none;
  transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.12s ease;
  overflow: hidden;
}
.card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: var(--shadow); }
.card[data-type="attack"]  { border-color: var(--orange); }
.card[data-type="skill"]   { border-color: var(--accent); }
.card[data-type="power"]   { border-color: var(--purple); }
.card[data-type="combo"]   { border-color: var(--gold); }
.card[data-rarity="rare"]      { box-shadow: 0 0 18px rgba(167,139,250,0.25); }
.card[data-rarity="uncommon"]  { box-shadow: 0 0 12px rgba(45,212,191,0.18); }
.card.played { opacity: 0.55; transform: scale(0.96); pointer-events: none; }
.card.unaffordable { opacity: 0.42; cursor: not-allowed; }
.card.unaffordable:hover { transform: none; }
.card.selected { transform: translateY(-8px); box-shadow: var(--shadow-glow), 0 12px 24px rgba(0,0,0,0.4); }

.card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 0.4rem;
}
.card-name { font-family: var(--font-display); font-weight: 800; font-size: 0.92rem; line-height: 1.15; }
.card-cost {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--bg-elev-2); border: 1px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 0.85rem; color: var(--accent);
  flex-shrink: 0;
}
.card[data-cost="0"] .card-cost { color: var(--green); }
.card-type-pill {
  display: inline-block; padding: 0.05rem 0.45rem;
  border-radius: 999px; font-size: 0.62rem; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  background: var(--bg-elev-2); color: var(--text-mute);
  border: 1px solid var(--border);
}
.card[data-type="attack"] .card-type-pill { color: var(--orange); border-color: var(--orange); }
.card[data-type="skill"]  .card-type-pill { color: var(--accent); border-color: var(--accent); }
.card[data-type="power"]  .card-type-pill { color: var(--purple); border-color: var(--purple); }
.card[data-type="combo"]  .card-type-pill { color: var(--gold); border-color: var(--gold); }
.card-text { color: var(--text-dim); font-size: 0.78rem; flex: 1; }
.card-text strong { color: var(--text); font-weight: 700; }
.card-text .hl { color: var(--accent); font-weight: 700; }

/* Compact card variant for hand on small screens */
.card.compact { min-height: 110px; font-size: 0.75rem; }

/* --- Fight screen --- */
.fight {
  display: grid; grid-template-rows: auto auto 1fr auto;
  gap: 0.85rem;
}
@media (min-width: 1000px) {
  .fight { grid-template-rows: auto auto 1fr auto; }
}

.audience-panel {
  padding: 1rem 1.1rem;
  background: var(--bg-card); border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  position: relative;
}
.audience-head {
  display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.65rem;
}
.audience-emoji {
  width: 48px; height: 48px; border-radius: 14px;
  background: var(--bg-elev-2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; flex-shrink: 0;
}
.audience-name {
  font-family: var(--font-display); font-size: 1.1rem; font-weight: 800;
}
.audience-desc { font-size: 0.78rem; color: var(--text-dim); }
.skepticism-bar-wrap {
  height: 18px; border-radius: 999px;
  background: var(--bg-elev-2); border: 1px solid var(--border);
  position: relative; overflow: hidden;
}
.skepticism-bar {
  height: 100%; background: linear-gradient(90deg, var(--red), var(--orange));
  transition: width 0.4s ease;
}
.skepticism-label {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem; font-weight: 800; color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.6);
}
.audience-state {
  display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem;
  flex-wrap: wrap; font-size: 0.8rem;
}
.audience-state .badge {
  display: inline-flex; align-items: center; gap: 0.3rem;
  padding: 0.2rem 0.55rem; border-radius: 999px;
  background: var(--bg-elev); border: 1px solid var(--border);
  font-weight: 700;
}
.audience-state .badge.resistance { color: var(--purple); border-color: var(--purple); }
.audience-state .badge.conviction { color: var(--red); border-color: var(--red); }
.intent-card {
  margin-top: 0.6rem; padding: 0.55rem 0.8rem;
  background: var(--bg-elev-2); border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
}
.intent-card .intent-label {
  font-size: 0.65rem; color: var(--text-mute); font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.15rem;
}
.intent-card.attack { border-left-color: var(--red); }
.intent-card.defend { border-left-color: var(--purple); }
.intent-card.buff { border-left-color: var(--orange); }

/* Player stats strip */
.player-strip {
  display: grid; grid-template-columns: 1fr auto auto; gap: 0.75rem;
  padding: 0.7rem 1rem;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius);
  align-items: center;
}
.composure-block {
  display: flex; flex-direction: column; gap: 0.25rem; min-width: 0;
}
.composure-label {
  font-size: 0.7rem; color: var(--text-mute); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.composure-bar-wrap {
  height: 14px; border-radius: 999px;
  background: var(--bg-elev-2); border: 1px solid var(--border);
  overflow: hidden; position: relative;
}
.composure-bar {
  height: 100%; background: linear-gradient(90deg, var(--green) 0%, var(--accent) 100%);
  transition: width 0.4s ease;
}
.composure-text {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem; font-weight: 800; color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.7);
}
.block-pill {
  padding: 0.3rem 0.6rem; border-radius: 999px;
  background: var(--purple); color: #fff;
  font-weight: 800; font-size: 0.85rem;
  display: inline-flex; align-items: center; gap: 0.25rem;
  border: none; min-width: 50px; justify-content: center;
}
.block-pill.zero { background: var(--bg-elev-2); color: var(--text-mute); border: 1px solid var(--border); }
.energy-pill {
  padding: 0.3rem 0.7rem; border-radius: 999px;
  background: var(--accent); color: #0a1726;
  font-weight: 800; font-size: 0.95rem;
  display: inline-flex; align-items: center; gap: 0.25rem;
  border: none;
}
.energy-pill.empty { background: var(--bg-elev-2); color: var(--text-mute); }

/* Play log (cards played this turn) */
.play-log {
  min-height: 70px; padding: 0.7rem;
  background: var(--bg-elev); border: 1px dashed var(--border);
  border-radius: var(--radius);
  display: flex; flex-wrap: wrap; gap: 0.4rem;
  align-items: center; justify-content: center;
  color: var(--text-mute); font-size: 0.85rem;
}
.play-log.empty::before {
  content: 'Played cards appear here'; font-style: italic;
}
.play-log .mini-card {
  padding: 0.3rem 0.55rem; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 0.75rem; font-weight: 700;
  animation: card-pop 0.35s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes card-pop {
  0%   { transform: scale(0.3) translateY(20px); opacity: 0; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}

/* Hand of cards */
.hand-area {
  display: flex; flex-direction: column; gap: 0.5rem;
}
.hand-meta {
  display: flex; align-items: center; justify-content: space-between;
  gap: 0.5rem; font-size: 0.78rem; color: var(--text-dim);
}
.hand-meta .pile { font-weight: 700; }
.hand-meta .pile span { color: var(--text); }
.hand {
  display: grid; gap: 0.5rem;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
}
@media (max-width: 700px) {
  .hand {
    grid-template-columns: none;
    grid-auto-flow: column;
    grid-auto-columns: 78%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding-bottom: 0.5rem;
  }
  .hand .card { scroll-snap-align: start; }
}
.end-turn-btn {
  width: 100%; padding: 0.85rem; border-radius: var(--radius);
  background: var(--orange); color: #0a1726;
  font-weight: 800; font-size: 1rem; cursor: pointer;
  border: none; transition: filter 0.15s ease, transform 0.1s ease;
}
.end-turn-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.end-turn-btn:active { transform: translateY(0); }

/* --- Reward picker --- */
.reward-screen { max-width: 900px; margin: 0 auto; text-align: center; }
.reward-screen h2 {
  font-family: var(--font-display); font-size: 1.8rem; font-weight: 900;
  margin-bottom: 0.35rem;
}
.reward-screen .victory-sub {
  color: var(--text-dim); margin-bottom: 1.25rem;
}
.reward-rewards {
  display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;
  margin-bottom: 1.5rem;
}
.reward-pill {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.45rem 0.95rem; border-radius: 999px;
  background: var(--bg-elev); border: 1px solid var(--border);
  font-weight: 700; font-size: 0.92rem;
}
.reward-pill.xp { color: var(--accent); border-color: var(--accent); }
.reward-pill.coins { color: var(--gold); border-color: var(--gold); }
.reward-pill.heal { color: var(--green); border-color: var(--green); }

.card-pick-row {
  display: grid; gap: 0.85rem; margin-bottom: 1rem;
  grid-template-columns: 1fr;
}
@media (min-width: 700px) {
  .card-pick-row { grid-template-columns: repeat(3, 1fr); max-width: 700px; margin: 0 auto 1rem; }
}
.card-pick-row .card { min-height: 160px; cursor: pointer; }
.card-pick-row .card:hover { transform: translateY(-6px); }

/* --- End of run --- */
.run-end {
  max-width: 700px; margin: 0 auto; padding: 2rem 1.5rem;
  background: linear-gradient(135deg, var(--bg-elev) 0%, var(--bg-elev-2) 100%);
  border: 2px solid var(--accent); border-radius: var(--radius-lg);
  text-align: center;
}
.run-end.lost { border-color: var(--orange); }
.run-end .crown {
  font-size: 3rem; line-height: 1; margin-bottom: 0.5rem;
}
.run-end h2 {
  font-family: var(--font-display); font-size: 2rem; font-weight: 900;
  margin-bottom: 0.4rem;
}
.run-end p { color: var(--text-dim); margin-bottom: 1.25rem; }

/* --- Coming-fight preview chip --- */
.preview-chip {
  display: inline-flex; align-items: center; gap: 0.35rem;
  font-size: 0.72rem; color: var(--text-mute); font-weight: 700;
  letter-spacing: 0.04em; text-transform: uppercase;
}

/* ================================================================
   SESSION 3 — Crossroads, Shop, Rest, upgrades, audience passives
   ================================================================ */

/* Crossroads picker — between fights */
.crossroads { max-width: 900px; margin: 0 auto; text-align: center; }
.crossroads h2 {
  font-family: var(--font-display); font-size: 1.6rem; font-weight: 900;
  margin-bottom: 0.3rem;
}
.crossroads p { color: var(--text-dim); margin-bottom: 1.25rem; }
.crossroads-grid {
  display: grid; gap: 0.85rem;
  grid-template-columns: 1fr;
  max-width: 700px; margin: 0 auto;
}
@media (min-width: 700px) {
  .crossroads-grid { grid-template-columns: repeat(3, 1fr); }
}
.crossroads-card {
  padding: 1.5rem 1rem; min-height: 200px;
  background: var(--bg-card); border: 2px solid var(--border);
  border-radius: var(--radius-lg); cursor: pointer;
  display: flex; flex-direction: column; gap: 0.55rem;
  align-items: center; text-align: center;
  transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
.crossroads-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.crossroads-card[data-kind="card"]:hover { border-color: var(--accent); }
.crossroads-card[data-kind="shop"]:hover { border-color: var(--gold); }
.crossroads-card[data-kind="rest"]:hover { border-color: var(--green); }
.crossroads-icon { font-size: 2.5rem; line-height: 1; }
.crossroads-card h3 {
  font-family: var(--font-display); font-size: 1.15rem; font-weight: 800;
}
.crossroads-card p { color: var(--text-dim); font-size: 0.85rem; line-height: 1.45; margin: 0; }

/* Shop view */
.shop { max-width: 980px; margin: 0 auto; }
.shop-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem;
  padding: 1rem 1.2rem;
  background: linear-gradient(135deg, var(--bg-elev) 0%, var(--bg-elev-2) 100%);
  border: 1px solid var(--gold); border-radius: var(--radius-lg);
}
.shop-header h2 {
  font-family: var(--font-display); font-size: 1.4rem; font-weight: 900;
  display: flex; align-items: center; gap: 0.5rem;
}
.shop-coins {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.4rem 0.85rem; border-radius: 999px;
  background: var(--gold-soft); border: 1px solid var(--gold);
  color: var(--gold); font-weight: 800;
}
.shop-section { margin-bottom: 1.5rem; }
.shop-section h3 {
  font-family: var(--font-display); font-size: 0.85rem; font-weight: 700;
  color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 0.5rem;
}

/* Buyable card — card + price overlay */
.shop-card-wrap { position: relative; }
.shop-card-wrap .card { cursor: pointer; }
.shop-card-wrap.bought .card { opacity: 0.4; pointer-events: none; }
.shop-card-wrap.unaffordable .card {
  opacity: 0.5; cursor: not-allowed; border-style: dashed;
}
.shop-price-tag {
  position: absolute; top: -10px; right: -8px;
  padding: 0.25rem 0.65rem; border-radius: 999px;
  background: var(--gold); color: #0a1726;
  font-weight: 800; font-size: 0.78rem;
  display: inline-flex; align-items: center; gap: 0.2rem;
  z-index: 2; pointer-events: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.shop-card-wrap.bought .shop-price-tag { background: var(--green); }
.shop-card-wrap.unaffordable .shop-price-tag { background: var(--red); color: #fff; }

.shop-services {
  display: grid; gap: 0.75rem;
  grid-template-columns: 1fr;
}
@media (min-width: 640px) {
  .shop-services { grid-template-columns: 1fr 1fr; }
}
.shop-service {
  padding: 1rem; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer;
  transition: border-color 0.15s ease, transform 0.1s ease;
  display: flex; gap: 0.85rem; align-items: center;
}
.shop-service:hover:not(.used):not(.unaffordable) {
  border-color: var(--accent); transform: translateY(-1px);
}
.shop-service.used { opacity: 0.5; cursor: not-allowed; }
.shop-service.unaffordable { opacity: 0.55; cursor: not-allowed; border-style: dashed; }
.shop-service-icon {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--bg-elev-2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; flex-shrink: 0;
}
.shop-service-body { flex: 1; min-width: 0; }
.shop-service-title { font-weight: 700; font-size: 1rem; }
.shop-service-desc { font-size: 0.8rem; color: var(--text-dim); margin-top: 0.15rem; }
.shop-service-price {
  font-weight: 800; color: var(--gold); white-space: nowrap;
  font-size: 0.92rem;
}
.shop-service.used .shop-service-price { color: var(--green); }

/* Rest view */
.rest { max-width: 700px; margin: 0 auto; text-align: center; }
.rest h2 {
  font-family: var(--font-display); font-size: 1.6rem; font-weight: 900;
  margin-bottom: 0.4rem;
}
.rest > p { color: var(--text-dim); margin-bottom: 1.25rem; }
.rest-options {
  display: grid; gap: 0.85rem;
  grid-template-columns: 1fr;
}
@media (min-width: 600px) {
  .rest-options { grid-template-columns: 1fr 1fr; }
}
.rest-option {
  padding: 1.5rem 1rem; background: var(--bg-card);
  border: 2px solid var(--border); border-radius: var(--radius-lg);
  cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease;
  display: flex; flex-direction: column; gap: 0.5rem; align-items: center;
}
.rest-option:hover:not(.unavailable) { transform: translateY(-3px); }
.rest-option[data-kind="heal"]:hover:not(.unavailable) { border-color: var(--green); }
.rest-option[data-kind="upgrade"]:hover:not(.unavailable) { border-color: var(--accent); }
.rest-option.unavailable { opacity: 0.45; cursor: not-allowed; }
.rest-option-icon { font-size: 2.5rem; }
.rest-option h3 { font-family: var(--font-display); font-size: 1.1rem; font-weight: 800; }
.rest-option p { font-size: 0.85rem; color: var(--text-dim); margin: 0; }

/* Card-pick (for upgrade or remove inside shop/rest) */
.card-pick-screen { max-width: 980px; margin: 0 auto; }
.card-pick-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 0.5rem; margin-bottom: 1rem;
}
.card-pick-header h2 {
  font-family: var(--font-display); font-size: 1.3rem; font-weight: 900;
}
.card-pick-header .sub { font-size: 0.85rem; color: var(--text-dim); margin-top: 0.2rem; }
.card-pick-empty {
  padding: 2rem; text-align: center;
  background: var(--bg-card); border: 1px dashed var(--border);
  border-radius: var(--radius-lg); color: var(--text-mute);
}

/* Upgrade badge on cards */
.card.upgraded { box-shadow: 0 0 14px rgba(45,212,191,0.35); }
.card .upgrade-badge {
  position: absolute; top: 4px; right: 28px;
  padding: 0.1rem 0.4rem; border-radius: 999px;
  background: var(--accent); color: #0a1726;
  font-size: 0.62rem; font-weight: 800;
  letter-spacing: 0.05em;
}

/* Audience passive ability badge */
.audience-passive {
  display: inline-flex; align-items: center; gap: 0.35rem;
  margin-top: 0.5rem;
  padding: 0.4rem 0.7rem; border-radius: var(--radius-sm);
  background: var(--bg-elev-2); border: 1px solid var(--purple);
  font-size: 0.78rem; line-height: 1.35;
}
.audience-passive .pass-ico { color: var(--purple); font-weight: 800; flex-shrink: 0; }

/* Animations */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}
.audience-panel.hit { animation: shake 0.35s ease; }
.audience-emoji.hit { animation: shake 0.45s ease; }
.composure-bar-wrap.hit { animation: shake 0.3s ease; }

@keyframes damage-float {
  0%   { transform: translate(-50%, 0) scale(0.8); opacity: 0; }
  20%  { opacity: 1; }
  100% { transform: translate(-50%, -50px) scale(1.2); opacity: 0; }
}
.damage-float {
  position: absolute; left: 50%; top: 30%;
  font-family: var(--font-display); font-weight: 900; font-size: 1.8rem;
  color: var(--orange); text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  pointer-events: none; z-index: 5;
  animation: damage-float 0.9s ease-out forwards;
}
.damage-float.persuasion { color: var(--accent); }
.damage-float.heavy { font-size: 2.4rem; color: var(--red); }

@keyframes mini-card-pop {
  0%   { transform: scale(0.4) translateY(30px) rotateZ(-10deg); opacity: 0; }
  60%  { transform: scale(1.08) translateY(-2px) rotateZ(2deg); opacity: 1; }
  100% { transform: scale(1) translateY(0) rotateZ(0); opacity: 1; }
}
.play-log .mini-card { animation: mini-card-pop 0.4s cubic-bezier(0.34,1.56,0.64,1); }

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(167,139,250,0); }
  50%      { box-shadow: 0 0 0 8px rgba(167,139,250,0.4); }
}
.block-pill.pulse { animation: pulse-glow 0.6s ease; }

/* Coin-fly when buying */
@keyframes coin-fly {
  0%   { transform: translate(-50%, 0) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -60px) scale(0.6); opacity: 0; }
}
.coin-fly {
  position: absolute; left: 50%; top: 50%;
  font-weight: 900; color: var(--gold); font-size: 1.4rem;
  pointer-events: none; z-index: 5;
  animation: coin-fly 0.7s ease-out forwards;
  text-shadow: 0 2px 8px rgba(0,0,0,0.6);
}

/* ================================================================
   SESSION 4 — Composer mode
   ================================================================ */
.composer { max-width: 1100px; margin: 0 auto; }

/* Top banner — prompt + framework guidance */
.composer-banner {
  padding: 1.25rem 1.4rem; margin-bottom: 1rem;
  background: linear-gradient(135deg, var(--bg-elev) 0%, var(--bg-elev-2) 100%);
  border: 1px solid var(--orange); border-radius: var(--radius-lg);
  position: relative; overflow: hidden;
}
.composer-banner::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at top right, rgba(255,138,76,0.2), transparent 60%);
  pointer-events: none;
}
.composer-meta {
  display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
  margin-bottom: 0.5rem;
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text-mute);
  position: relative;
}
.composer-meta .divider { color: var(--border-strong); }
.composer-meta .framework {
  color: var(--orange); background: rgba(255,138,76,0.12);
  padding: 0.15rem 0.5rem; border-radius: 999px;
  border: 1px solid rgba(255,138,76,0.3);
}
.composer-prompt {
  font-family: var(--font-display); font-size: 1.1rem; font-weight: 600;
  line-height: 1.45; position: relative;
}
.composer-suggested {
  margin-top: 0.65rem; font-size: 0.78rem; color: var(--text-dim);
  position: relative;
}
.composer-suggested-roles {
  display: inline-flex; align-items: center; gap: 0.3rem; flex-wrap: wrap;
}
.role-pill {
  display: inline-flex; align-items: center;
  padding: 0.15rem 0.5rem; border-radius: 999px;
  background: var(--bg-card); border: 1px solid var(--border);
  font-size: 0.7rem; font-weight: 700; text-transform: capitalize;
  color: var(--text-dim);
}
.role-pill[data-role="hook"]     { color: var(--pink);   border-color: var(--pink); }
.role-pill[data-role="point"]    { color: var(--accent); border-color: var(--accent); }
.role-pill[data-role="reason"]   { color: var(--orange); border-color: var(--orange); }
.role-pill[data-role="example"]  { color: var(--gold);   border-color: var(--gold); }
.role-pill[data-role="bridge"]   { color: var(--purple); border-color: var(--purple); }
.role-pill[data-role="restated"] { color: var(--green);  border-color: var(--green); }
.role-pill[data-role="closer"]   { color: var(--red);    border-color: var(--red); }
.role-pill[data-role="filler"]   { color: var(--text-mute); border-style: dashed; }
.role-arrow { color: var(--text-mute); font-weight: 700; }

/* Canvas */
.canvas-section { margin-bottom: 1rem; }
.canvas-label {
  font-family: var(--font-display); font-size: 0.85rem; font-weight: 700;
  color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 0.5rem;
  display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
}
.canvas-label .count {
  font-family: var(--font-body); font-weight: 600; color: var(--text); font-size: 0.85rem;
  text-transform: none; letter-spacing: 0;
}
.canvas {
  min-height: 110px;
  padding: 0.75rem;
  background: var(--bg-elev); border: 2px dashed var(--border);
  border-radius: var(--radius-lg);
  display: flex; flex-direction: column; gap: 0.4rem;
}
.canvas.empty {
  align-items: center; justify-content: center;
  color: var(--text-mute); font-style: italic;
  font-size: 0.9rem;
}
.canvas-tile {
  display: flex; align-items: stretch; gap: 0.4rem;
  background: var(--bg-card); border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 0.55rem 0.7rem;
  font-size: 0.85rem; line-height: 1.4;
  transition: transform 0.12s ease, border-color 0.12s ease;
}
.canvas-tile:hover { transform: translateX(2px); }
.canvas-tile[data-role="hook"]     { border-left-color: var(--pink); }
.canvas-tile[data-role="point"]    { border-left-color: var(--accent); }
.canvas-tile[data-role="reason"]   { border-left-color: var(--orange); }
.canvas-tile[data-role="example"]  { border-left-color: var(--gold); }
.canvas-tile[data-role="bridge"]   { border-left-color: var(--purple); }
.canvas-tile[data-role="restated"] { border-left-color: var(--green); }
.canvas-tile[data-role="closer"]   { border-left-color: var(--red); }
.canvas-tile[data-role="filler"]   { border-left-color: var(--text-mute); border-left-style: dashed; opacity: 0.85; }
.canvas-tile-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.25rem; }
.canvas-tile-role {
  font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-mute);
}
.canvas-tile-text { color: var(--text); }
.canvas-tile-actions {
  display: flex; flex-direction: column; gap: 0.2rem;
  align-items: center;
}
.canvas-tile-actions button {
  width: 28px; height: 22px; padding: 0; border-radius: 6px;
  background: var(--bg-elev-2); border: 1px solid var(--border);
  color: var(--text-dim); font-size: 0.78rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.1s ease;
}
.canvas-tile-actions button:hover:not([disabled]) { color: var(--text); border-color: var(--accent); }
.canvas-tile-actions button[disabled] { opacity: 0.3; cursor: not-allowed; }
.canvas-tile-actions .remove { color: var(--red); }
.canvas-tile-actions .remove:hover { background: var(--red); color: #fff; border-color: var(--red); }

/* Pool */
.pool-section { margin-bottom: 1rem; }
.pool-label {
  font-family: var(--font-display); font-size: 0.85rem; font-weight: 700;
  color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 0.5rem;
}
.pool-grid {
  display: grid; gap: 0.5rem;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
}
@media (max-width: 520px) { .pool-grid { grid-template-columns: 1fr 1fr; gap: 0.4rem; } }
.pool-tile {
  position: relative;
  padding: 0.6rem 0.75rem; min-height: 64px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm);
  cursor: pointer; text-align: left;
  font-size: 0.82rem; line-height: 1.4;
  user-select: none;
  transition: transform 0.1s ease, border-color 0.15s ease, opacity 0.15s ease;
}
.pool-tile:hover:not(.used) { transform: translateY(-2px); }
.pool-tile.used { opacity: 0.32; cursor: not-allowed; }
.pool-tile[data-role="hook"]     { border-left-color: var(--pink); }
.pool-tile[data-role="point"]    { border-left-color: var(--accent); }
.pool-tile[data-role="reason"]   { border-left-color: var(--orange); }
.pool-tile[data-role="example"]  { border-left-color: var(--gold); }
.pool-tile[data-role="bridge"]   { border-left-color: var(--purple); }
.pool-tile[data-role="restated"] { border-left-color: var(--green); }
.pool-tile[data-role="closer"]   { border-left-color: var(--red); }
.pool-tile[data-role="filler"]   { border-left-color: var(--text-mute); border-left-style: dashed; opacity: 0.85; }
.pool-tile-role {
  font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-mute); display: block; margin-bottom: 0.2rem;
}
.pool-tile-text { color: var(--text); }

/* Composer actions */
.composer-actions {
  display: flex; gap: 0.5rem; flex-wrap: wrap;
  margin: 1rem 0; align-items: center;
}
.composer-actions .spacer { flex: 1; }
.composer-best {
  font-size: 0.8rem; color: var(--text-dim); font-weight: 600;
}
.composer-best strong { color: var(--accent); }

/* Score screen — Composer */
.composer-result {
  max-width: 900px; margin: 0 auto;
}
.composer-result-hero {
  padding: 1.5rem 1.4rem; margin-bottom: 1rem;
  background: linear-gradient(135deg, var(--bg-elev) 0%, var(--bg-elev-2) 100%);
  border: 2px solid var(--orange); border-radius: var(--radius-lg);
  text-align: center;
  animation: pop-in 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.composer-result-hero.great { border-color: var(--accent); box-shadow: var(--shadow-glow); }
.composer-result-hero.solid { border-color: var(--gold); }
.composer-result-hero h2 {
  font-family: var(--font-display); font-size: 1.6rem; font-weight: 900;
  margin-bottom: 0.25rem;
}
.composer-result-score {
  font-family: var(--font-display); font-size: 3.5rem; font-weight: 900; line-height: 1;
  color: var(--accent);
}
.composer-result-score-label {
  font-size: 0.75rem; color: var(--text-mute); text-transform: uppercase;
  letter-spacing: 0.08em; font-weight: 700; margin-top: 0.4rem;
}
.composer-result-rewards {
  display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;
  margin-top: 0.85rem;
}

/* Score axis breakdown */
.score-axes {
  padding: 1rem 1.2rem; margin-bottom: 1rem;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.score-axes h3 {
  font-family: var(--font-display); font-size: 0.85rem; font-weight: 700;
  color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 0.75rem;
}
.score-axis {
  display: flex; align-items: center; gap: 0.65rem;
  padding: 0.5rem 0;
  border-bottom: 1px dashed var(--border);
}
.score-axis:last-child { border-bottom: none; }
.score-axis-label {
  flex: 0 0 130px; font-weight: 600; font-size: 0.85rem;
}
.score-axis-bar-wrap {
  flex: 1; height: 8px; background: var(--bg-elev-2); border-radius: 999px;
  overflow: hidden;
}
.score-axis-bar { height: 100%; transition: width 0.5s ease; }
.score-axis-bar.positive { background: linear-gradient(90deg, var(--accent), var(--green)); }
.score-axis-bar.neutral  { background: var(--gold); }
.score-axis-bar.negative { background: var(--red); }
.score-axis-value {
  flex: 0 0 60px; text-align: right;
  font-family: var(--font-display); font-weight: 800; font-size: 0.92rem;
}
.score-axis-value.negative { color: var(--red); }
.score-axis-detail { flex-basis: 100%; font-size: 0.75rem; color: var(--text-mute); margin-top: 0.15rem; }
@media (max-width: 600px) {
  .score-axis { flex-wrap: wrap; }
  .score-axis-label { flex-basis: auto; }
  .score-axis-bar-wrap { flex-basis: 100%; order: 3; }
}

/* Combos triggered */
.combos {
  padding: 1rem 1.2rem; margin-bottom: 1rem;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.combos h3 {
  font-family: var(--font-display); font-size: 0.85rem; font-weight: 700;
  color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 0.75rem;
}
.combo {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.55rem 0.85rem; margin-bottom: 0.4rem;
  background: var(--bg-elev); border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
}
.combo.penalty { border-left-color: var(--red); }
.combo-icon { font-size: 1.3rem; line-height: 1; flex-shrink: 0; }
.combo-body { flex: 1; min-width: 0; }
.combo-name {
  font-family: var(--font-display); font-weight: 800; font-size: 0.92rem;
}
.combo-desc { font-size: 0.78rem; color: var(--text-dim); margin-top: 0.1rem; }
.combo-bonus {
  font-family: var(--font-display); font-weight: 900; font-size: 1rem;
  color: var(--accent);
}
.combo.penalty .combo-bonus { color: var(--red); }

/* Composition transcript on score screen */
.composer-transcript {
  padding: 1rem 1.2rem; margin-bottom: 1rem;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.composer-transcript h3 {
  font-family: var(--font-display); font-size: 0.85rem; font-weight: 700;
  color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 0.65rem;
}
.composer-transcript-line {
  padding: 0.4rem 0.6rem; margin-bottom: 0.3rem;
  background: var(--bg-elev); border-radius: var(--radius-sm);
  font-size: 0.85rem; line-height: 1.4;
  border-left: 3px solid var(--accent);
}
.composer-transcript-line[data-role="hook"]     { border-left-color: var(--pink); }
.composer-transcript-line[data-role="point"]    { border-left-color: var(--accent); }
.composer-transcript-line[data-role="reason"]   { border-left-color: var(--orange); }
.composer-transcript-line[data-role="example"]  { border-left-color: var(--gold); }
.composer-transcript-line[data-role="bridge"]   { border-left-color: var(--purple); }
.composer-transcript-line[data-role="restated"] { border-left-color: var(--green); }
.composer-transcript-line[data-role="closer"]   { border-left-color: var(--red); }
.composer-transcript-line[data-role="filler"]   { border-left-color: var(--text-mute); opacity: 0.7; }

/* ================================================================
   RESPONSIVE TWEAKS
   ================================================================ */
@media (max-width: 520px) {
  .header { gap: 0.5rem; }
  .header-stats { gap: 0.3rem; }
  .stat-chip { font-size: 0.75rem; padding: 0.3rem 0.55rem; }
  .brand { font-size: 1.05rem; }
  .brand-mark { width: 30px; height: 30px; font-size: 0.95rem; }
  .hero { padding: 1.1rem 1rem; }
  .tile-pool { grid-template-columns: 1fr 1fr; }
  .tile { font-size: 0.78rem; padding: 0.55rem 0.7rem; }
  .wordle-history-cell { width: 26px; height: 26px; font-size: 0.7rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<script>
'use strict';

// ================================================================
// STATE
// ================================================================
const STATE_KEY = 'speakgame-state-v1';

const state = {
  xp: 0,
  coins: 0,
  // Wordle progression
  wordleStreak: 0,           // current streak in consecutive days
  wordleLongestStreak: 0,    // best ever
  wordleLastPlayedDay: null, // YYYY-MM-DD of last day completed
  wordleDailyResult: null,   // {day, won, attempts, rows, xpEarned, coinsEarned} for today only
  wordleInProgress: null,    // {day, attempts: [], slots: [null,null,...], puzzleId} mid-game
  settings: {
    theme: 'dark',
    sound: true,
    animations: true
  }
};

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
  } catch (e) { /* quota or private mode — ignore */ }
}
function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    // Merge keys that exist; preserve defaults for new fields
    for (const k of Object.keys(state)) {
      if (parsed[k] !== undefined) {
        if (typeof state[k] === 'object' && state[k] !== null && !Array.isArray(state[k])) {
          Object.assign(state[k], parsed[k]);
        } else {

}

let _audioCtx = null;
function audioCtx() {
  if (_audioCtx) return _audioCtx;
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return null;
  _audioCtx = new Ctor();
  return _audioCtx;
}
function tone(freq, durMs, type = 'sine', volume = 0.06, attack = 0.005) {
  if (!state.settings.sound) return;
  const ctx = audioCtx();
  if (!ctx) return;
  // iOS Safari: resume after user gesture
  if (ctx.state === 'suspended') { ctx.resume().catch(()=>{}); }
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type; osc.frequency.value = freq;
  osc.connect(gain); gain.connect(ctx.destination);
  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(volume, now + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + durMs / 1000);
  osc.start(now); osc.stop(now + durMs / 1000 + 0.02);
}

function todayKey() {
  // YYYY-MM-DD in user's local timezone — matches "daily reset at local midnight"
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function dayOfYear() {
  const d = new Date();
  const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
}
function todayPuzzleNumber() {

  return dayOfYear();
}
function todayPuzzle() {
  const idx = dayOfYear() % WORDLE_PUZZLES.length;
  return WORDLE_PUZZLES[idx];
}

// Seeded RNG (mulberry32) for stable daily decoy selection.
function seedFromString(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return () => {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return ((h ^= h >>> 16) >>> 0) / 4294967296;
  };
}
function shuffleWithRng(arr, rng) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

// Build today's tile pool: 4 correct + N decoys; same seed -> same arrangement.
function buildTilePool(puzzle, dayKey) {
  const rng = seedFromString(`${puzzle.id}|${dayKey}`);
  const correctIds = puzzle.slots.map(s => s.correctId);
  const allOthers = PHRASES
    .filter(p => !correctIds.includes(p.id))
    .map(p => p.id);
  const shuffledOthers = shuffleWithRng(allOthers, rng);
  const decoys = shuffledOthers.slice(0, WORDLE_TILE_POOL_SIZE - correctIds.length);
  return shuffleWithRng([...correctIds, ...decoys], rng);
}

// Build today's tile pool: pull tiles from each non-filler role + 2 filler traps.
// Pool is regenerated each composition (fresh random) so each session is varied.
function buildComposerPool(promptId, seed) {
  const rng = seed ? seedFromString(promptId + '|' + seed) : Math.random.bind(Math);
  // Per-role draw counts — slightly weighted toward roles likely needed for variety.
  const draws = { hook: 2, point: 3, reason: 3, example: 3, bridge: 2, restated: 2, closer: 2, filler: 2 };
  const out = [];
  for (const [role, count] of Object.entries(draws)) {
    const pool = PHRASES.filter(p => p.role === role);
    const shuffled = shuffleArr(pool.slice(), rng);
    for (let i = 0; i < count && i < shuffled.length; i++) out.push(shuffled[i].id);
  }
  return shuffleArr(out, rng);
}

// Multi-axis scoring engine. Returns:
// { total, axes: [{label, value, max, detail}], combos: [{combo, fired}], xpEarned, coinsEarned }
function scoreComposition(composition, prompt) {
  const tiles = composition.map(id => phraseById(id)).filter(Boolean);
  const roles = tiles.map(t => t.role);
  const sug = prompt.suggested;

  // 1. Framework coverage (0-25): credit per suggested role that appears.
  const sugSet = new Set(sug);
  const hit = sug.filter(r => roles.includes(r));
  const coveragePct = sug.length ? hit.length / sug.length : 0;
  const frameworkScore = Math.round(coveragePct * 25);
  const frameworkDetail = `${hit.length}/${sug.length} suggested roles present (${sug.join(' → ')})`;

  // 2. Sequence (0-25): how well does the order of present suggested roles match the suggested order?
  // Compute the longest common subsequence of roles vs sug.
  const presentInOrder = roles.filter(r => sugSet.has(r));
  let i = 0; let inOrder = 0;
  for (const r of presentInOrder) {
    if (sug.indexOf(r, i) >= 0) { i = sug.indexOf(r, i) + 1; inOrder++; }
  }
  const seqPct = sug.length ? inOrder / sug.length : 0;
  const sequenceScore = Math.round(seqPct * 25);
  const sequenceDetail = `${inOrder} role${inOrder === 1 ? '' : 's'} in suggested order`;

  // 3. Specificity (0-20): bonus for Example tiles + tiles containing numbers/percentages/dollar signs
  let specificityScore = 0;
  let numericTiles = 0;
  tiles.forEach(t => {
    if (t.role === 'example') specificityScore += 4;
    if (/\d/.test(t.text)) { specificityScore += 3; numericTiles++; }
  });
  specificityScore = Math.min(20, specificityScore);
  const specificityDetail = numericTiles > 0
    ? `${numericTiles} tile${numericTiles === 1 ? '' : 's'} with concrete numbers`
    : 'No numeric specificity — add an Example with a number.';

  // 4. Length sweet-spot (0-15): 5-7 tiles = full credit; sliding penalty either side.
  const len = tiles.length;
  let lengthScore = 0;
  let lengthDetail = '';
  if (len === 0)        { lengthScore = 0;  lengthDetail = 'Empty composition.'; }
  else if (len <= 2)    { lengthScore = 3;  lengthDetail = 'Too short — develop the argument.'; }
  else if (len === 3)   { lengthScore = 8;  lengthDetail = 'Short but workable.'; }
  else if (len === 4)   { lengthScore = 12; lengthDetail = 'Close to ideal.'; }
  else if (len <= 7)    { lengthScore = 15; lengthDetail = 'Right in the sweet spot.'; }
  else if (len === 8)   { lengthScore = 12; lengthDetail = 'Slightly long — could tighten.'; }
  else                  { lengthScore = 7;  lengthDetail = 'Long — every extra tile dilutes.'; }

  // 5. Filler penalty (0 → -15): -5 per filler tile, capped at -15
  const fillerCount = roles.filter(r => r === 'filler').length;
  const fillerPenalty = -Math.min(15, fillerCount * 5);
  const fillerDetail = fillerCount === 0
    ? 'Clean — no buzzword phrases used.'
    : `${fillerCount} filler tile${fillerCount === 1 ? '' : 's'} — buzzwords cost credibility.`;

  // 6. Combos (variable +/-)
  const comboResults = COMBOS.map(c => ({ combo: c, fired: c.detect(roles) }));
  const comboFired = comboResults.filter(c => c.fired);
  const comboBonus = comboFired.reduce((s, c) => s + c.combo.bonus, 0);

  // Total — sum then cap at 100, floor at 0
  let total = frameworkScore + sequenceScore + specificityScore + lengthScore + fillerPenalty + comboBonus;
  total = Math.max(0, Math.min(100, Math.round(total)));

  const axes = [
    { label: 'Framework',   value: frameworkScore,   max: 25, kind: 'positive', detail: frameworkDetail },
    { label: 'Sequence',    value: sequenceScore,    max: 25, kind: 'positive', detail: sequenceDetail },
    { label: 'Specificity', value: specificityScore, max: 20, kind: 'positive', detail: specificityDetail },
    { label: 'Length',      value: lengthScore,      max: 15, kind: 'neutral',  detail: lengthDetail },
    { label: 'Filler',      value: fillerPenalty,    max: 0,  kind: 'negative', detail: fillerDetail }
  ];

  // Reward: XP + Coins scaled by total
  const xpEarned = Math.round(20 + (total / 100) * 60); // 20-80 XP
  const coinsEarned = Math.round(5 + (total / 100) * 30); // 5-35 Coins

  return { total, axes, combos: comboResults, xpEarned, coinsEarned };
}

  // Cycle to a different prompt than the current one
  let candidates = COMPOSER_PROMPTS;
  if (_composer && _composer.prompt) candidates = COMPOSER_PROMPTS.filter(p => p.id !== _composer.prompt.id);
  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  startComposerSession(pick.id);
}

function tryThisPromptAgain() {
  SFX.click();
  if (!_composer || !_composer.prompt) { startComposerSession(null); return; }
  startComposerSession(_composer.prompt.id);
}

function addTileToCanvas(tileId) {
  if (!_composer) return;
  if (_composer.result) return; // composition submitted
  if (_composer.composition.includes(tileId)) return; // each tile usable once
  if (_composer.composition.length >= 9) {
    showToast('Canvas is full — remove a tile first.', 'error');
    return;
  }
  _composer.composition.push(tileId);
  SFX.place();
  renderComposer();
}

function removeFromCanvas(idx) {
  if (!_composer || _composer.result) return;
  if (idx < 0 || idx >= _composer.composition.length) return;
  _composer.composition.splice(idx, 1);
  SFX.unplace();
  renderComposer();
}

function moveCanvasTile(idx, direction) {
  if (!_composer || _composer.result) return;
  const target = idx + direction;
  if (target < 0 || target >= _composer.composition.length) return;
  const arr = _composer.composition;
  [arr[idx], arr[target]] = [arr[target], arr[idx]];
  SFX.click();
  renderComposer();
}

function clearComposition() {
  if (!_composer || _composer.result) return;
  if (_composer.composition.length === 0) return;
  _composer.composition = [];
  SFX.unplace();
  renderComposer();
}

function submitComposition() {
  if (!_composer || _composer.result) return;
  if (_composer.composition.length < 2) {
    showToast('Place at least 2 tiles before composing.', 'error');
    return;
  }
  SFX.submit();
  const result = scoreComposition(_composer.composition, _composer.prompt);
  _composer.result = result;

  // Apply rewards + bookkeeping
  state.xp += result.xpEarned;
  state.coins += result.coinsEarned;
  state.composer.totalCompositions++;
  if (result.total > state.composer.bestScore) state.composer.bestScore = result.total;
  refreshHeaderStats();
  saveState();

  // Sound for outcome
  if (result.total >= 80) setTimeout(() => SFX.win(), 200);
  else if (result.total >= 60) setTimeout(() => SFX.correct(), 200);
  else setTimeout(() => SFX.miss(), 200);

  renderComposer();
}

// ----- Renderers -----
function renderComposer() {
  const container = document.getElementById('composer-content');
  if (!container) return;
  if (!_composer) {
    container.innerHTML = renderComposerIntro();
    return;
  }
  if (_composer.result) {
    container.innerHTML = renderComposerResult(_composer.result);
    return;
  }
  container.innerHTML = renderComposerCompose();
}

              <span class="role-pill" data-role="${r}">${r}</span>

                <div class="canvas-tile" data-role="${t.role}">
                  <div class="canvas-tile-body">
                    <span class="canvas-tile-role">${i + 1}. ${t.role}</span>
                    <span class="canvas-tile-text">${t.text}</span>
                  </div>

function confirmLeaveComposer() {
  if (_composer && _composer.composition.length > 0 && !_composer.result) {
    if (!confirm('Leave this composition? Your current canvas will be lost.')) return;
  }
  _composer = null;
  navigate('home');
}

function renderComposerResult(result) {
  const c = _composer;
  const prompt = c.prompt;
  const tiles = c.composition.map(id => phraseById(id));
  const tier = result.total >= 80 ? 'great' : result.total >= 60 ? 'solid' : '';
  const headline = result.total >= 90 ? 'Outstanding.'
    : result.total >= 80 ? 'Strong composition.'
    : result.total >= 65 ? 'Solid attempt.'
    : result.total >= 45 ? 'Workable. Tighten it.'
    : 'Rough — try again with a different shape.';

  return `
    <div class="wordle-back" onclick="navigate('home')">← Back to modes</div>

    <div class="composer-result">
      <div class="composer-result-hero ${tier}">
        <div class="composer-result-score">${result.total}</div>
        <div class="composer-result-score-label">out of 100</div>
        <h2 style="margin-top:0.75rem">${headline}</h2>
        <div style="color:var(--text-dim);font-size:0.9rem">${prompt.framework}</div>
        <div class="composer-result-rewards">
          <span class="reward-pill xp">+${result.xpEarned} XP</span>
          <span class="reward-pill coins">+${result.coinsEarned} 🪙</span>
          ${result.total > (state.composer.bestScore - result.total === 0 ? -1 : 0) && result.total === state.composer.bestScore && state.composer.totalCompositions > 1
            ? '<span class="reward-pill heal">🏆 New best</span>'
            : ''}
        </div>
      </div>

      <div class="score-axes">
        <h3>Score breakdown</h3>
        ${result.axes.map(a => {
          const pct = a.kind === 'negative'
            ? Math.min(100, (Math.abs(a.value) / 15) * 100)
            : a.max ? Math.min(100, (a.value / a.max) * 100) : 0;
          const sign = a.value < 0 ? '' : '+';
          return `
            <div class="score-axis">
              <div class="score-axis-label">${a.label}</div>
              <div class="score-axis-bar-wrap">
                <div class="score-axis-bar ${a.kind}" style="width:${pct}%"></div>
              </div>
              <div class="score-axis-value ${a.value < 0 ? 'negative' : ''}">${sign}${a.value}${a.max ? '/' + a.max : ''}</div>
              <div class="score-axis-detail">${a.detail}</div>
            </div>
          `;
        }).join('')}
      </div>

      <div class="combos">
        <h3>Combos</h3>
        ${result.combos.filter(c => c.fired).length === 0
          ? `<p style="color:var(--text-mute);font-size:0.85rem">No named combos triggered. Try a Hook + Example + Closer arc, or a tight Point → Reason → Example → Restated chain.</p>`
          : result.combos.filter(c => c.fired).map(c => `
              <div class="combo ${c.combo.penalty ? 'penalty' : ''}">
                <div class="combo-icon">${c.combo.icon}</div>
                <div class="combo-body">
                  <div class="combo-name">${c.combo.name}</div>
                  <div class="combo-desc">${c.combo.desc}</div>
                </div>
                <div class="combo-bonus">${c.combo.bonus > 0 ? '+' : ''}${c.combo.bonus}</div>
              </div>
            `).join('')}
      </div>

      <div class="composer-transcript">
        <h3>Your composition</h3>
        ${tiles.length === 0 ? '<p style="color:var(--text-mute)">No tiles placed.</p>' : tiles.map((t, i) => `
          <div class="composer-transcript-line" data-role="${t.role}">
            <strong style="font-size:0.7rem;color:var(--text-mute);text-transform:uppercase;letter-spacing:0.05em">${i+1}. ${t.role}</strong>
            <div>${t.text}</div>
          </div>
        `).join('')}
      </div>

      <div style="display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:center;margin-top:1rem">
        <button class="btn btn-ghost" onclick="_composer = null; navigate('home')">
          Back to modes
        </button>
        <button class="btn btn-secondary" onclick="tryThisPromptAgain()">
          Try this prompt again
        </button>
        <button class="btn btn-primary" onclick="newComposerPrompt()">
          New prompt →
        </button>
      </div>
    </div>
  `;
}

// Resolve a card id, supporting "+" suffix for upgraded variants.
function cardById(id) {
  if (!id) return null;
  const upgraded = id.endsWith('+');
  const baseId = upgraded ? id.slice(0, -1) : id;
  const base = CARD_LIBRARY.find(c => c.id === baseId);
  if (!base) return null;
  if (!upgraded || !base.upgrade) return base;
  // Build the upgraded card by overlaying upgrade fields on the base.
  const up = base.upgrade;
  return {
    ...base,
    name: base.name + '+',
    cost: up.cost !== undefined ? up.cost : base.cost,
    text: up.text || base.text,
    effect: up.effect || base.effect,
    _upgraded: true,
    _id: id
  };
}
function cardsByRarity(rarity) { return CARD_LIBRARY.filter(c => c.rarity === rarity); }
function isUpgradedId(id) { return typeof id === 'string' && id.endsWith('+'); }
function upgradedIdOf(id) { return isUpgradedId(id) ? id : id + '+'; }

  'c03', 'c03',         // 2× Cite a Reason

// Initialize state.deckRun on first load if missing
if (!state.deckRun) {
  state.deckRun = {
    active: false,
    deck: [],
    composureMax: 70,
    composure: 70,
    coinsThisRun: 0,
    fightsCompleted: 0,
    totalFights: 5,
    nodes: [],            // [{kind:'fight', audienceId, done, isBoss}, ...]
    pendingReward: null,  // {choices:[cardId,cardId,cardId]} when between fights
