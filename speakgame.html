@media (min-width: 700px) { .framework-cards { grid-template-columns: repeat(4, 1fr); } }
.framework-card {
  padding: 0.75rem 0.85rem; min-height: 90px;
  background: var(--bg-elev); border: 2px solid var(--border);
  border-radius: var(--radius); cursor: pointer; text-align: left;
  transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  display: flex; flex-direction: column; gap: 0.25rem;
}
.framework-card:hover { transform: translateY(-2px); }
.framework-card.selected {
  background: var(--accent-soft); box-shadow: var(--shadow-glow);
}
.framework-card[data-color="accent"].selected { border-color: var(--accent); }
.framework-card[data-color="gold"].selected   { border-color: var(--gold); background: rgba(255,209,102,0.10); box-shadow: 0 0 18px var(--gold-soft); }

<script>
'use strict';

// ================================================================
// STATE
// ================================================================
const STATE_KEY = 'speakgame-state-v1';

const state = {
  xp: 0,
  coins: 0,
  // Wordle progression
  wordleStreak: 0,           // current streak in consecutive days
  wordleLongestStreak: 0,    // best ever
  wordleLastPlayedDay: null, // YYYY-MM-DD of last day completed
  wordleDailyResult: null,   // {day, won, attempts, rows, xpEarned, coinsEarned} for today only
  wordleInProgress: null,    // {day, attempts: [], slots: [null,null,...], puzzleId} mid-game
  settings: {
    theme: 'dark',
    sound: true,
    animations: true
  }
};

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
  } catch (e) { /* quota or private mode — ignore */ }
}
function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    // Merge keys that exist; preserve defaults for new fields
    for (const k of Object.keys(state)) {
      if (parsed[k] !== undefined) {
        if (typeof state[k] === 'object' && state[k] !== null && !Array.isArray(state[k])) {
          Object.assign(state[k], parsed[k]);
        } else {
          state[k] = parsed[k];
        }
      }
    }
  } catch (e) { /* corrupted — ignore */ }
}

// ================================================================
// SOUND — Web Audio API, lightweight tones; no external assets
// ================================================================
let _audioCtx = null;
function audioCtx() {
  if (_audioCtx) return _audioCtx;
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return null;
  _audioCtx = new Ctor();
  return _audioCtx;
}
function tone(freq, durMs, type = 'sine', volume = 0.06, attack = 0.005) {
  if (!state.settings.sound) return;
  const ctx = audioCtx();
  if (!ctx) return;
  // iOS Safari: resume after user gesture
  if (ctx.state === 'suspended') { ctx.resume().catch(()=>{}); }
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type; osc.frequency.value = freq;
  osc.connect(gain); gain.connect(ctx.destination);
  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(volume, now + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + durMs / 1000);
  osc.start(now); osc.stop(now + durMs / 1000 + 0.02);
}
const SFX = {
  click:    () => tone(740, 50, 'square', 0.04),
  place:    () => tone(880, 70, 'sine',   0.05),
  unplace:  () => tone(520, 60, 'sine',   0.04),
  submit:   () => { tone(620, 80, 'triangle', 0.05); setTimeout(()=>tone(820, 90, 'triangle', 0.05), 70); },
  correct:  () => { tone(880, 90, 'sine', 0.06); setTimeout(()=>tone(1320, 100, 'sine', 0.06), 80); },
  miss:     () => tone(220, 200, 'sawtooth', 0.05),
  win:      () => {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 160, 'triangle', 0.07), i * 110));
  },
  lose:     () => {
    [330, 277, 247].forEach((f, i) => setTimeout(() => tone(f, 180, 'sawtooth', 0.05), i * 130));
  },
  coin:     () => { tone(1320, 80, 'triangle', 0.05); setTimeout(()=>tone(1760, 100, 'triangle', 0.05), 70); }
};

const WORDLE_MAX_ATTEMPTS = 6;
const WORDLE_TILE_POOL_SIZE = 16; // tiles shown to the player

// ================================================================
// DAILY SEED — deterministic per local day
// ================================================================
function todayKey() {
  // YYYY-MM-DD in user's local timezone — matches "daily reset at local midnight"
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function dayOfYear() {
  const d = new Date();
  const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
}
function todayPuzzleNumber() {
  // Stable counter shown to user; cycles weekly through WORDLE_PUZZLES.
  return dayOfYear();
}
function todayPuzzle() {
  const idx = dayOfYear() % WORDLE_PUZZLES.length;
  return WORDLE_PUZZLES[idx];
}

// Seeded RNG (mulberry32) for stable daily decoy selection.
function seedFromString(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return () => {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return ((h ^= h >>> 16) >>> 0) / 4294967296;
  };
}
function shuffleWithRng(arr, rng) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

// Build today's tile pool: 4 correct + N decoys; same seed -> same arrangement.
function buildTilePool(puzzle, dayKey) {
  const rng = seedFromString(`${puzzle.id}|${dayKey}`);
  const correctIds = puzzle.slots.map(s => s.correctId);
  const allOthers = PHRASES
    .filter(p => !correctIds.includes(p.id))
    .map(p => p.id);
  const shuffledOthers = shuffleWithRng(allOthers, rng);
  const decoys = shuffledOthers.slice(0, WORDLE_TILE_POOL_SIZE - correctIds.length);
  return shuffleWithRng([...correctIds, ...decoys], rng);
}

// ================================================================
// SESSION 6 — PULSE (time-pressure drill, Mavis-Beacon-style)
// Three difficulty tiers in one mode:
//   - Cascade  (Easy)    : phrases scroll horizontally; tap correct before they scroll off
//   - Survival (Medium)  : 5-second 4-option choice that chains, timer shrinks every 5 in a row
//   - Hot Seat (Hard)    : build a full framework arc against a 30s clock from a scrolling stream
//
// Retention layer (runs under all tiers):
//   - state.phraseMastery: { phraseId: level (0-5) } — correct under pressure ups, wrong downs
//   - state.phraseMisses:  { phraseId: 'YYYY-MM-DD' } — phrases missed today
//   - "Yesterday's misses" warm-up: first 60s of any session is weighted toward phrases you
//     missed yesterday (or earlier, if you skipped a day)
// ================================================================

// --------- State ---------
if (!state.pulse) {
  state.pulse = {
    phraseMastery: {},     // phraseId -> 0..5
    phraseMisses:  {},     // phraseId -> 'YYYY-MM-DD' (last miss date)
    bestCascadeScore: 0,
    bestSurvivalStreak: 0,
    bestHotSeatTime: null, // shortest completion time, seconds (lower = better)
    totalRuns: 0,
    settings: { phraseSpeed: 8, framework: 'universal' }  // user-adjustable on the intro screen
  };
}
// Back-compat for pre-settings save states
if (!state.pulse.settings) state.pulse.settings = { phraseSpeed: 8, framework: 'universal' };
if (!state.pulse.settings.framework) state.pulse.settings.framework = 'universal';

let _pulse = null;  // transient — current session

// Tear down all timers/intervals on exit (called from multiple places)
function tearDownPulse() {
  if (!_pulse) return;
  if (_pulse.intervals) _pulse.intervals.forEach(id => clearInterval(id));
  if (_pulse.timeouts)  _pulse.timeouts.forEach(id => clearTimeout(id));
  _pulse.intervals = [];
  _pulse.timeouts = [];
}

// --------- Retention helpers ---------
function recordHit(phraseId) {
  const cur = state.pulse.phraseMastery[phraseId] || 0;
  state.pulse.phraseMastery[phraseId] = Math.min(5, cur + 1);
}
function recordMiss(phraseId) {
  const cur = state.pulse.phraseMastery[phraseId] || 0;
  state.pulse.phraseMastery[phraseId] = Math.max(0, cur - 1);
  state.pulse.phraseMisses[phraseId] = todayKey();
}
function masteryLevel(phraseId) {
  return state.pulse.phraseMastery[phraseId] || 0;
}

// Returns "yesterday's" (and earlier-unmastered) miss IDs — phrases missed before today
// that still have mastery < 4.
function yesterdayMissIds() {
  const today = todayKey();
  const out = [];
  for (const [id, date] of Object.entries(state.pulse.phraseMisses)) {
    if (date === today) continue;       // already drilled today
    if (masteryLevel(id) >= 4) continue; // already learned
    out.push(id);
  }
  return out;
}

// Weighted pool selection: low-mastery phrases over-represented.
// `roleFilter` (optional): only return phrases of that role.
// `count`: how many distinct IDs to pull.
// `boostIds`: array of phrase IDs to over-represent further (yesterday's misses).
// `fwId` (optional): restrict to phrases in this framework. Default = current framework.
//                    Filler is always universal across frameworks.
function weightedPhrasePool(count, roleFilter, boostIds, fwId) {
  fwId = fwId || currentFrameworkId();
  let candidates;
  if (roleFilter === 'filler') {
    // Filler trap pool is universal — buzzwords work as decoys in any framework
    candidates = PHRASES.filter(p => p.role === 'filler');
  } else if (roleFilter) {
    candidates = phrasesByFrameworkAndRole(fwId, roleFilter);
  } else {
    // No role filter — return any phrase in this framework (plus universal fillers)
    candidates = phrasesByFramework(fwId);
  }
  const boost = new Set(boostIds || []);
  const pool = [];
  candidates.forEach(p => {
    const w = 1 + (5 - masteryLevel(p.id)) + (boost.has(p.id) ? 3 : 0);
    for (let i = 0; i < w; i++) pool.push(p.id);
  });
  const out = [];
  const seen = new Set();
  while (out.length < count && pool.length > 0) {
    const idx = Math.floor(Math.random() * pool.length);
    const id = pool[idx];
    if (!seen.has(id)) { seen.add(id); out.push(id); }
    pool.splice(idx, 1);
  }
  return out;
}

// --------- Entry / start ---------
function startPulse(tier) {
  SFX.click();
  tearDownPulse();
  state.pulse.totalRuns++;
  const warmupIds = yesterdayMissIds();
  _pulse = {
    tier,                  // 'easy' | 'medium' | 'hard'
    score: 0,
    lives: 3,
    streak: 0,
    longestStreak: 0,
    correct: 0,
    wrong: 0,
    missed: 0,
    elapsed: 0,
    over: false,
    masteryDelta: {},      // { phraseId: { before, after, hits, misses } }
    intervals: [],
    timeouts: [],
    warmupIds            // for boosted spawning
  };
  if (tier === 'easy')    startCascade();
  if (tier === 'medium')  startSurvival();
  if (tier === 'hard')    startHotSeat();
  renderPulse();
}

function noteMasteryDelta(phraseId, kind) {
  const md = _pulse.masteryDelta[phraseId] || { before: masteryLevel(phraseId), after: null, hits: 0, misses: 0 };
  if (kind === 'hit')  md.hits++;
  if (kind === 'miss') md.misses++;
  md.after = masteryLevel(phraseId);
  _pulse.masteryDelta[phraseId] = md;
}

// ================================================================
// TIER 1: CASCADE (Easy)
// Round = 60 seconds. A target framework role rotates every 8 seconds.
// Phrases of all roles scroll right-to-left. Tap a phrase matching
// the current target = +score + mastery; wrong role = -1 life;
// filler = -1 life; off-screen correct phrase = +missed counter.
// ================================================================
function startCascade() {
  _pulse.timeLeft = 60;
  _pulse.targetRole = pickCascadeTarget();
  _pulse.targetTimer = 0;       // seconds since the current target appeared
  _pulse.activePhrases = [];    // { id, role, el, spawnAt }
  // Baseline from user-selected speed. Spawn cadence scales with it.
  _pulse.baseDuration  = pulsePhraseMs();
  _pulse.baseSpawn     = pulseSpawnMs();
  _pulse.phraseDuration = _pulse.baseDuration;
  _pulse.spawnInterval  = _pulse.baseSpawn;
  _pulse.spawnSince = 0;
  _pulse.tickAccum = 0;

  // Master tick (100ms): countdown, target rotation, spawn cadence escalation
  const tickId = setInterval(() => {
    if (!_pulse || _pulse.over) return;
    _pulse.timeLeft -= 0.1;
    _pulse.targetTimer += 0.1;
    _pulse.elapsed += 0.1;
    _pulse.tickAccum += 100;

    // Rotate target every 8 seconds
    if (_pulse.targetTimer >= 8) {
      _pulse.targetRole = pickCascadeTarget(_pulse.targetRole);
      _pulse.targetTimer = 0;
      // Update the target indicator without full re-render
      const el = document.querySelector('.pulse-target-role');
      if (el) el.textContent = _pulse.targetRole;
      const det = document.querySelector('.pulse-target-detail');
      if (det) det.textContent = roleHint(_pulse.targetRole);
    }

    // Escalate difficulty over time — both rates scale with the user's chosen baseline.
    if (_pulse.elapsed > 20) _pulse.spawnInterval  = Math.round(_pulse.baseSpawn    * 0.85);
    if (_pulse.elapsed > 35) _pulse.spawnInterval  = Math.round(_pulse.baseSpawn    * 0.70);
    if (_pulse.elapsed > 35) _pulse.phraseDuration = Math.round(_pulse.baseDuration * 0.85);
    if (_pulse.elapsed > 50) _pulse.phraseDuration = Math.round(_pulse.baseDuration * 0.70);

    // Update HUD timer bar
    const bar = document.querySelector('.pulse-hud-timer-fill');
    if (bar) {
      const pct = Math.max(0, (_pulse.timeLeft / 60) * 100);
      bar.style.width = pct + '%';
      bar.classList.toggle('warn', pct < 50 && pct >= 20);
      bar.classList.toggle('danger', pct < 20);
    }

    // Time up?
    if (_pulse.timeLeft <= 0) {
      finishPulse(true);
      return;
    }
  }, 100);
  _pulse.intervals.push(tickId);

  // Spawn loop — recursive with dynamic interval
  function scheduleNextSpawn() {
    if (!_pulse || _pulse.over || _pulse.tier !== 'easy') return;
    const t = setTimeout(() => {
      spawnCascadePhrase();
      scheduleNextSpawn();
    }, _pulse.spawnInterval);
    _pulse.timeouts.push(t);
  }
  scheduleNextSpawn();
}

function pickCascadeTarget(exclude) {
  // Use the currently-selected framework's role list.
  const fw = currentFramework();
  const pool = fw.roles.filter(r => r !== exclude);
  return pool[Math.floor(Math.random() * pool.length)];
}

function roleHint(role) {
  return (ROLE_INFO[role] && ROLE_INFO[role].purpose) || '';

// ===== FRAMEWORK DEFINITIONS =====
// Each framework has its own set of roles and a canonical arc (used by Hot Seat).
// Filler is always universal — buzzwords are buzzwords in any framework.
const FRAMEWORKS = [
  { id: 'universal',
    name: 'Universal PREP+',
    short: 'PREP',
    color: 'accent',
    desc: 'The everyday framework. Hook → Point → Reason → Example → Restated, with bridges and closers as connectors.',
    roles: ['hook','point','reason','example','restated','bridge','closer'],
    arc:   ['hook','point','reason','example','restated'] },
  { id: 'star',
    name: 'STAR',
    short: 'STAR',
    color: 'gold',
    desc: 'Behavioral stories. For "tell me about a time..." questions. Situation → Task → Action → Result.',
    roles: ['situation','task','action','result'],
    arc:   ['situation','task','action','result'] },
  { id: 'aida',
    name: 'AIDA',
    short: 'AIDA',
    color: 'pink',
    desc: 'Persuasive pitches. Attention → Interest → Desire → Call-to-Action.',
    roles: ['attention','interest','desire','cta'],
    arc:   ['attention','interest','desire','cta'] },
  { id: 'psi',
    name: 'Problem → Solution → Impact',
    short: 'PSI',
    color: 'orange',
    desc: 'Change proposals. Lead with the pain, present the fix, show why it matters.',
    roles: ['problem','solution','impact'],
    arc:   ['problem','solution','impact'] }
];
function frameworkById(id) { return FRAMEWORKS.find(f => f.id === id) || FRAMEWORKS[0]; }
function currentFrameworkId() {
  return (state.pulse && state.pulse.settings && state.pulse.settings.framework) || 'universal';
}
function currentFramework() { return frameworkById(currentFrameworkId()); }

// Framework-aware phrase pool helpers.
// "Universal" includes any phrase without an explicit framework tag (back-compat).
function phrasesByFramework(fwId) {
  if (fwId === 'universal') {
    return PHRASES.filter(p => !p.framework || p.framework === 'universal');
  }
  return PHRASES.filter(p => p.framework === fwId);
}
function phrasesByFrameworkAndRole(fwId, role) {
  // Filler always pulls from the universal trap pool — buzzwords are framework-agnostic
  if (role === 'filler') return PHRASES.filter(p => p.role === 'filler');
  return phrasesByFramework(fwId).filter(p => p.role === role);
}

// Read the user-selected baseline phrase duration (seconds → ms).
function pulsePhraseMs() {
  const sec = (state.pulse && state.pulse.settings && state.pulse.settings.phraseSpeed) || 8;
  return Math.round(sec * 1000);
}
// Spawn interval scales with phrase duration so density stays sane at any speed.
function pulseSpawnMs() {
  return Math.max(700, Math.round(pulsePhraseMs() * 0.175));
}

function setPulseSpeed(value) {
  const v = parseFloat(value);
  if (isNaN(v)) return;
  if (!state.pulse.settings) state.pulse.settings = {};
  state.pulse.settings.phraseSpeed = Math.max(3, Math.min(12, v));
  // Update the visible value without a full re-render
  const lbl = document.getElementById('pulse-speed-value');
  if (lbl) lbl.textContent = state.pulse.settings.phraseSpeed.toFixed(1) + 's per phrase';
  saveState();
}
function toggleFrameworkGuide() {
  const el = document.getElementById('framework-guide');
  if (el) el.classList.toggle('open');
  SFX.click();
}

function setPulseFramework(fwId) {
  if (!frameworkById(fwId)) return;
  if (!state.pulse.settings) state.pulse.settings = {};
  state.pulse.settings.framework = fwId;
  SFX.click();
  saveState();
  // Re-render the intro so the picker + guide + tier cards update
  renderPulse();
}

let _cascadeSpawnId = 0;
function spawnCascadePhrase() {
  if (!_pulse || _pulse.over) return;
  const stage = document.querySelector('.cascade-stage');
  if (!stage) return;

  // 70% chance to spawn a phrase from the current framework (any role);
  // 30% chance to throw in a filler trap (universal).
  const useFiller = Math.random() < 0.30;
  let phraseId;
  if (useFiller) {
    const fillers = weightedPhrasePool(1, 'filler', _pulse.warmupIds);
    phraseId = fillers[0];
  } else {
    // Pick from any non-filler role in the current framework, weighted by mastery
    const all = weightedPhrasePool(3, null, _pulse.warmupIds).filter(id => phraseById(id).role !== 'filler');
    phraseId = all[Math.floor(Math.random() * all.length)] || phrasesByFramework(currentFrameworkId())[0].id;
  }
  if (!phraseId) return;
  const phrase = phraseById(phraseId);
  if (!phrase) return;

  const lane = Math.floor(Math.random() * 4);
  const spawnId = ++_cascadeSpawnId;
  const el = document.createElement('button');
  el.className = 'cascade-phrase';
  el.dataset.role = phrase.role;
  el.dataset.phraseId = phraseId;
  el.dataset.spawnId = String(spawnId);
  el.textContent = phrase.text;
  el.style.animationDuration = _pulse.phraseDuration + 'ms';
  // Slight random vertical jitter within the lane
  el.style.top = (Math.random() * 16) + 'px';
  el.onclick = () => onCascadeTap(spawnId);

  const laneEl = stage.querySelector(`.cascade-lane[data-lane="${lane}"]`);
  if (!laneEl) return;
  laneEl.appendChild(el);

  // Track active
  _pulse.activePhrases.push({ id: phraseId, role: phrase.role, spawnId, el, handled: false });

  // Remove on animation end (off-screen)
  el.addEventListener('animationend', () => {
    if (!el.parentNode) return;
    const entry = _pulse.activePhrases.find(p => p.spawnId === spawnId);
    if (entry && !entry.handled) {
      // Off-screen: if this was a CORRECT target role, that's a miss (lose life + record miss)
      if (entry.role === _pulse.targetRole) {
        _pulse.missed++;
        _pulse.lives = Math.max(0, _pulse.lives - 1);
        recordMiss(entry.id);
        noteMasteryDelta(entry.id, 'miss');
        _pulse.streak = 0;
        floatDelta(_pulse.targetEl(), '-1 ❤', 'loss');
        SFX.miss();
        if (_pulse.lives <= 0) { finishPulse(false); return; }
        refreshPulseHUD();
      }
      entry.handled = true;
    }
    try { el.remove(); } catch (e) {}
    _pulse.activePhrases = _pulse.activePhrases.filter(p => p.spawnId !== spawnId);
  });
}

function onCascadeTap(spawnId) {
  if (!_pulse || _pulse.over) return;
  // Hot Seat tier uses its own tap logic (arc-aware)
  if (_pulse.tier === 'hard') { return onHotSeatTap(spawnId); }
  const entry = _pulse.activePhrases.find(p => p.spawnId === spawnId);
  if (!entry || entry.handled) return;
  entry.handled = true;
  const isCorrect = entry.role === _pulse.targetRole;
  const isFiller  = entry.role === 'filler';

  if (isCorrect) {
    _pulse.score += 10 + Math.floor(_pulse.streak * 1.5);
    _pulse.streak++;
    _pulse.longestStreak = Math.max(_pulse.longestStreak, _pulse.streak);
    _pulse.correct++;
    recordHit(entry.id);
    noteMasteryDelta(entry.id, 'hit');
    entry.el.classList.add('hit');
    floatDelta(entry.el.parentNode, `+${10 + Math.floor(_pulse.streak * 1.5)}`, 'gain', true);
    SFX.correct();
  } else {
    _pulse.wrong++;
    _pulse.lives = Math.max(0, _pulse.lives - 1);
    _pulse.streak = 0;
    if (!isFiller) {
      // Tapped a wrong-role real phrase: penalize THAT phrase's mastery a bit
      recordMiss(entry.id);
      noteMasteryDelta(entry.id, 'miss');
    }
    entry.el.classList.add('miss');
    floatDelta(entry.el.parentNode, isFiller ? '−1 ❤  buzzword!' : '−1 ❤', 'loss', true);
    SFX.miss();
    if (_pulse.lives <= 0) { finishPulse(false); return; }
  }
  refreshPulseHUD();
}

// Get the target indicator element to anchor float-delta animations (fallback to stage)
function pulseTargetEl() {
  return document.querySelector('.pulse-target') || document.querySelector('.cascade-stage');
}
// Add helper to _pulse so it's available
function attachPulseHelpers() {
  if (!_pulse) return;
  _pulse.targetEl = pulseTargetEl;
}

function floatDelta(parent, text, kind, small) {
  if (!parent) return;
  if (state.settings && state.settings.animations === false) return;
  if (getComputedStyle(parent).position === 'static') parent.style.position = 'relative';
  const el = document.createElement('div');
  el.className = 'pulse-delta ' + (kind || '') + (small ? ' small' : '');
  el.textContent = text;
  parent.appendChild(el);
  setTimeout(() => { try { el.remove(); } catch (e) {} }, 800);
}

function refreshPulseHUD() {
  const sEl = document.getElementById('pulse-score');
  if (sEl) sEl.textContent = _pulse.score;
  const lEl = document.getElementById('pulse-lives');
  if (lEl) lEl.textContent = '❤️'.repeat(_pulse.lives) + '🤍'.repeat(3 - _pulse.lives);
  const stEl = document.getElementById('pulse-streak');
  if (stEl) stEl.textContent = _pulse.streak;
}

// ================================================================
// TIER 2: SURVIVAL (Medium)
// 5-second slot with 4 phrase options. Pick correct → next slot.
// Wrong or timeout = run over. Every 5 correct, timer shrinks by 0.4s.
// ================================================================
function startSurvival() {
  _pulse.timePerSlot = 5;     // seconds
  _pulse.minTimePerSlot = 1.6;
  _pulse.slotTimeLeft = _pulse.timePerSlot;
  _pulse.lives = 1;            // survival is one-strike
  rollSurvivalSlot();

  const tickId = setInterval(() => {
    if (!_pulse || _pulse.over) return;
    _pulse.slotTimeLeft -= 0.05;
    _pulse.elapsed += 0.05;
    if (_pulse.slotTimeLeft <= 0) {
      // Timeout — game over
      _pulse.wrong++;
      _pulse.lives = 0;
      // Record the correct phrase as a miss
      if (_pulse.currentSurvivalCorrect) {
        recordMiss(_pulse.currentSurvivalCorrect);
        noteMasteryDelta(_pulse.currentSurvivalCorrect, 'miss');
      }
      SFX.miss();
      finishPulse(false);
      return;
    }
    const bar = document.querySelector('.survival-big-timer-fill');
    if (bar) {
      const pct = Math.max(0, (_pulse.slotTimeLeft / _pulse.timePerSlot) * 100);
      bar.style.width = pct + '%';
      bar.classList.toggle('warn', pct < 50 && pct >= 25);
      bar.classList.toggle('danger', pct < 25);
    }
  }, 50);
  _pulse.intervals.push(tickId);
}

function rollSurvivalSlot() {
  // Pick a target role from the current framework + 3 distractors.
  // Distractors come from OTHER roles in the SAME framework, with a chance to
  // include a universal filler trap — keeps choices coherent inside the framework.
  const targetRole = pickCascadeTarget(_pulse.targetRole);
  _pulse.targetRole = targetRole;
  const correctPool = weightedPhrasePool(1, targetRole, _pulse.warmupIds);
  const correct = correctPool[0];
  const fwId = currentFrameworkId();
  const distractors = [];
  while (distractors.length < 3) {
    const useFiller = Math.random() < 0.30;
    let candidateIds;
    if (useFiller) {
      candidateIds = PHRASES.filter(p => p.role === 'filler').map(p => p.id);
    } else {
      candidateIds = phrasesByFramework(fwId)
        .filter(p => p.role !== targetRole && p.role !== 'filler')
        .map(p => p.id);
    }
    if (candidateIds.length === 0) continue;
    const pick = candidateIds[Math.floor(Math.random() * candidateIds.length)];
    if (pick && !distractors.includes(pick) && pick !== correct) distractors.push(pick);
  }
  const options = shuffleArr([correct, ...distractors]);
  _pulse.currentSurvivalOptions = options;
  _pulse.currentSurvivalCorrect = correct;
  _pulse.slotTimeLeft = _pulse.timePerSlot;
  renderPulse();
}

function survivalPick(phraseId) {
  if (!_pulse || _pulse.over) return;
  const correct = _pulse.currentSurvivalCorrect;
  if (phraseId === correct) {
    _pulse.score += 15 + Math.floor(_pulse.streak * 2);
    _pulse.streak++;
    _pulse.longestStreak = Math.max(_pulse.longestStreak, _pulse.streak);
    _pulse.correct++;
    recordHit(phraseId);
    noteMasteryDelta(phraseId, 'hit');
    SFX.correct();
    // Every 5 correct, shrink timer
    if (_pulse.streak > 0 && _pulse.streak % 5 === 0 && _pulse.timePerSlot > _pulse.minTimePerSlot) {
      _pulse.timePerSlot = Math.max(_pulse.minTimePerSlot, _pulse.timePerSlot - 0.4);
      showToast(`Speed up! ${_pulse.timePerSlot.toFixed(1)}s per slot.`, 'success');
    }
    // Visual flash
    const el = document.querySelector(`.survival-option[data-id="${phraseId}"]`);
    if (el) {
      el.classList.add('flash-correct');
      setTimeout(() => { rollSurvivalSlot(); }, 200);
    } else {
      rollSurvivalSlot();
    }
  } else {
    _pulse.wrong++;
    _pulse.lives = 0;
    recordMiss(phraseId);
    noteMasteryDelta(phraseId, 'miss');
    // Also note the user MISSED the correct one (penalty soft)
    if (correct) {
      recordMiss(correct);
      noteMasteryDelta(correct, 'miss');
    }
    SFX.lose();
    const el = document.querySelector(`.survival-option[data-id="${phraseId}"]`);
    if (el) el.classList.add('flash-wrong');
    finishPulse(false);
  }
}

// ================================================================
// TIER 3: HOT SEAT (Hard)
// Pick a random scenario (from COMPOSER_PROMPTS). Build the full
// suggested arc by tapping scrolling phrases. 30s global timer.
// Out of time OR arc complete = end.
// ================================================================
function startHotSeat() {
  // Pick a scenario tagged for the currently-selected framework.
  // The framework's canonical arc determines the slot sequence, regardless of which
  // specific scenario the player draws — so a STAR Hot Seat always asks for situation→task→action→result.
  const fwId = currentFrameworkId();
  const fw = currentFramework();
  const pool = HOTSEAT_SCENARIOS.filter(s => s.framework === fwId);
  if (pool.length === 0) {
    showToast('No scenarios for this framework yet.', 'error');
    _pulse = null;
    navigate('pulse');
    return;
  }
  _pulse.scenario = pool[Math.floor(Math.random() * pool.length)];
  _pulse.arc = fw.arc.slice();                       // role sequence comes from the FRAMEWORK
  _pulse.arcFilled = _pulse.arc.map(() => null);     // phraseId per slot
  _pulse.arcIdx = 0;
  _pulse.timeLeft = 40;     // a touch more generous so the new readable speed still fits an arc
  // Pull the baseline phrase duration + spawn cadence from the user-selected speed,
  // with a slight tightening (Hot Seat should feel a bit punchier than Cascade).
  _pulse.baseDuration  = Math.round(pulsePhraseMs() * 0.9);
  _pulse.baseSpawn     = Math.round(pulseSpawnMs() * 0.9);
  _pulse.phraseDuration = _pulse.baseDuration;
  _pulse.spawnInterval  = _pulse.baseSpawn;
  _pulse.activePhrases = [];
  _pulse.targetRole = _pulse.arc[0];
  _pulse.lives = 3;

  // Tick
  const tickId = setInterval(() => {
    if (!_pulse || _pulse.over) return;
    _pulse.timeLeft -= 0.1;
    _pulse.elapsed += 0.1;
    if (_pulse.timeLeft <= 0) {
      finishPulse(_pulse.arcIdx === _pulse.arc.length);
      return;
    }
    const bar = document.querySelector('.pulse-hud-timer-fill');
    if (bar) {
      const pct = Math.max(0, (_pulse.timeLeft / 40) * 100);
      bar.style.width = pct + '%';
      bar.classList.toggle('warn', pct < 50 && pct >= 20);
      bar.classList.toggle('danger', pct < 20);
    }
  }, 100);
  _pulse.intervals.push(tickId);

  // Spawn cadence
  function nextSpawn() {
    if (!_pulse || _pulse.over || _pulse.tier !== 'hard') return;
    const t = setTimeout(() => {
      spawnCascadePhrase(); // reuse cascade spawner — same scrolling mechanic
      nextSpawn();
    }, _pulse.spawnInterval);
    _pulse.timeouts.push(t);
  }
  nextSpawn();
}

// Hot Seat tap: phrase must match the CURRENT arc slot's role (not a global target).
// Reached via the tier-check at the top of onCascadeTap.
function onHotSeatTap(spawnId) {
  if (!_pulse || _pulse.over) return;
  const entry = _pulse.activePhrases.find(p => p.spawnId === spawnId);
  if (!entry || entry.handled) return;
  entry.handled = true;
  const needRole = _pulse.arc[_pulse.arcIdx];
  if (entry.role === needRole) {
    _pulse.arcFilled[_pulse.arcIdx] = entry.id;
    _pulse.arcIdx++;
    _pulse.score += 20 + Math.floor(_pulse.streak * 2);
    _pulse.streak++;
    _pulse.longestStreak = Math.max(_pulse.longestStreak, _pulse.streak);
    _pulse.correct++;
    recordHit(entry.id);
    noteMasteryDelta(entry.id, 'hit');
    entry.el.classList.add('hit');
    floatDelta(entry.el.parentNode, `+${20 + Math.floor(_pulse.streak * 2)}`, 'gain', true);
    SFX.correct();
    if (_pulse.arcIdx >= _pulse.arc.length) {
      // Arc complete — WIN. Time bonus scales with seconds remaining on the 40s clock.
      _pulse.timeBonusEarned = Math.max(0, Math.round(_pulse.timeLeft * 5));
      _pulse.score += _pulse.timeBonusEarned;
      finishPulse(true);
      return;
    }
    _pulse.targetRole = _pulse.arc[_pulse.arcIdx];
    // Re-render the arc tracker via partial update — we can just trigger renderPulse for simplicity
    renderPulse();
  } else {
    _pulse.wrong++;
    _pulse.lives = Math.max(0, _pulse.lives - 1);
    _pulse.streak = 0;
    if (entry.role !== 'filler') {
      recordMiss(entry.id);
      noteMasteryDelta(entry.id, 'miss');
    }
    entry.el.classList.add('miss');
    floatDelta(entry.el.parentNode, entry.role === 'filler' ? '−1 ❤  buzzword!' : '−1 ❤  wrong role', 'loss', true);
    SFX.miss();
    if (_pulse.lives <= 0) finishPulse(false);
  }
  refreshPulseHUD();
}

// ================================================================
// FINISH + RESULT
// ================================================================
function finishPulse(won) {
  if (!_pulse || _pulse.over) return;
  _pulse.over = true;
  _pulse.won = won;
  tearDownPulse();

  // Update bests
  if (_pulse.tier === 'easy'   && _pulse.score > state.pulse.bestCascadeScore)   state.pulse.bestCascadeScore   = _pulse.score;
  if (_pulse.tier === 'medium' && _pulse.longestStreak > state.pulse.bestSurvivalStreak) state.pulse.bestSurvivalStreak = _pulse.longestStreak;
  if (_pulse.tier === 'hard' && won) {
    const t = 40 - _pulse.timeLeft;
    if (state.pulse.bestHotSeatTime == null || t < state.pulse.bestHotSeatTime) state.pulse.bestHotSeatTime = t;
  }

  // Rewards — generous to keep pulse appealing as a daily warm-up
  let xpEarned, coinsEarned;
  if (_pulse.tier === 'easy') {
    xpEarned    = Math.round(20 + _pulse.score / 8);
    coinsEarned = Math.round(5  + _pulse.score / 12);
  } else if (_pulse.tier === 'medium') {
    xpEarned    = Math.round(25 + _pulse.longestStreak * 4);
    coinsEarned = Math.round(8  + _pulse.longestStreak * 2);
  } else {
    xpEarned    = won ? 80 + Math.round((40 - _pulse.timeLeft) * 2) : 20;
    coinsEarned = won ? 40 + Math.round((40 - _pulse.timeLeft)) : 5;
  }
  _pulse.xpEarned = xpEarned;
  _pulse.coinsEarned = coinsEarned;
  state.xp += xpEarned;
  state.coins += coinsEarned;
  refreshHeaderStats();
  saveState();

  if (won && _pulse.tier === 'hard') SFX.win();
  else if (_pulse.score > 0) SFX.correct();
  else SFX.lose();

  renderPulse();
}

// ================================================================
// RENDERING
// ================================================================
function renderPulse() {
  const container = document.getElementById('pulse-content');
  if (!container) return;
  if (!_pulse) {
    container.innerHTML = renderPulseIntro();
    return;
  }
  if (_pulse.over) {
    container.innerHTML = renderPulseResult();
    return;
  }
  if (_pulse.tier === 'easy')   { container.innerHTML = renderCascade(); attachPulseHelpers(); return; }
  if (_pulse.tier === 'medium') { container.innerHTML = renderSurvival(); return; }
  if (_pulse.tier === 'hard')   { container.innerHTML = renderHotSeat(); attachPulseHelpers(); return; }
}

function renderPulseIntro() {
  const warmup = yesterdayMissIds();
  const sp = state.pulse;
  const curSpeed = (sp.settings && sp.settings.phraseSpeed) || 8;
  const curFw = currentFramework();
  return `
    <div class="wordle-back" onclick="navigate('home')">← Back to modes</div>
    <div class="pulse-screen">
      <div class="pulse-intro-banner">
        <h2>⚡ Pulse</h2>
        <p>Time pressure builds the reflex. Three tiers train the same thing: spotting the right framework piece <strong>fast</strong>. Phrases you miss come back tomorrow at higher priority.</p>
      </div>

      ${warmup.length > 0 ? `
        <div class="warmup-callout">
          <span class="ico">🎯</span>
          <div>
            <strong>${warmup.length} phrase${warmup.length === 1 ? '' : 's'} from earlier sessions</strong> will be over-represented in your next round. Drill them to bank the win.
          </div>
        </div>

      <div class="framework-picker">

function renderMasterySummaryRow() {
  const total = PHRASES.length;

  PHRASES.forEach(p => { levels[masteryLevel(p.id)]++; });
  return `
    <div style="display:flex;gap:0.3rem;flex-wrap:wrap;margin-top:0.6rem;font-size:0.78rem;color:var(--text-dim)">
      ${levels.map((cnt, lvl) => `
        <span style="display:inline-flex;align-items:center;gap:0.25rem;padding:0.15rem 0.5rem;border-radius:999px;background:var(--bg-elev-2);border:1px solid var(--border)">
          <strong style="color:${lvl === 5 ? 'var(--gold)' : lvl >= 3 ? 'var(--accent)' : 'var(--text)'}">L${lvl}</strong>: ${cnt}
        </span>
      `).join('')}
      <span style="color:var(--text-mute);font-size:0.72rem;align-self:center">(${total} phrases total)</span>
    </div>
  `;
}

function renderPulseResult() {
  const won = _pulse.won;
  const tier = _pulse.tier;
  const tierName = tier === 'easy' ? 'Cascade' : tier === 'medium' ? 'Survival' : 'Hot Seat';
  const heroCls = won ? '' : 'lose';

  // Mastery delta summary — show top 5 changes by abs(delta), and which went up vs down
  const deltas = Object.entries(_pulse.masteryDelta || {}).map(([id, d]) => {
    const ph = phraseById(id);
    if (!ph) return null;
    const change = d.after - d.before;
    return { id, ph, before: d.before, after: d.after, change, hits: d.hits, misses: d.misses };
  }).filter(Boolean);
  deltas.sort((a, b) => Math.abs(b.change) - Math.abs(a.change));
  const topDeltas = deltas.slice(0, 8);

  let headline;
  if (tier === 'easy') headline = won ? `Cascade survived — ${_pulse.score} points.` : `Knocked out at ${_pulse.score} points.`;
  else if (tier === 'medium') headline = `${_pulse.longestStreak} in a row.`;
  else headline = won ? `Arc completed in ${(40 - _pulse.timeLeft).toFixed(1)}s.` : 'Time ran out.';

  return `
    <div class="wordle-back" onclick="navigate('home')">← Back to modes</div>
    <div class="pulse-result">

      <div class="pulse-result-hero ${heroCls}">
        <div style="font-size:2.4rem;line-height:1">${tier === 'easy' ? '🌊' : tier === 'medium' ? '🔥' : '🎯'}</div>
        <h2>${headline}</h2>
        <div style="color:var(--text-dim);font-size:0.9rem">Pulse · ${tierName}</div>
        <div class="pulse-result-stat-grid">
          <div class="pulse-result-stat">
            <div class="pulse-result-stat-label">Correct</div>
            <div class="pulse-result-stat-value" style="color:var(--green)">${_pulse.correct}</div>
          </div>
          <div class="pulse-result-stat">
            <div class="pulse-result-stat-label">Wrong / Missed</div>
            <div class="pulse-result-stat-value" style="color:var(--red)">${_pulse.wrong + _pulse.missed}</div>
          </div>
          <div class="pulse-result-stat">
            <div class="pulse-result-stat-label">Best streak</div>
            <div class="pulse-result-stat-value" style="color:var(--gold)">${_pulse.longestStreak}</div>
          </div>
        </div>
        <div style="display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;margin-top:0.85rem">
          <span class="reward-pill xp">+${_pulse.xpEarned} XP</span>
          <span class="reward-pill coins">+${_pulse.coinsEarned} 🪙</span>
          ${tier === 'hard' && won && _pulse.timeBonusEarned > 0 ? `<span class="reward-pill heal">⏱ +${_pulse.timeBonusEarned} time bonus</span>` : ''}
        </div>
      </div>

      ${topDeltas.length > 0 ? `
        <div class="mastery-summary">
          <h3>Mastery changes</h3>
          ${topDeltas.map(d => {
            const pips = Array.from({length: 5}, (_, i) => {
              if (i < d.after) {
                return `<span class="mastery-pip ${d.after === 5 ? 'full' : 'filled'}"></span>`;
              }
              return '<span class="mastery-pip"></span>';
            }).join('');
            const deltaClass = d.change > 0 ? 'up' : d.change < 0 ? 'down' : '';
            const deltaText = d.change > 0 ? `+${d.change}` : d.change < 0 ? `${d.change}` : '±0';
            return `
              <div class="mastery-row">
                <span style="display:inline-block;width:50px">${pips}</span>
                <span class="phrase-text" title="${d.ph.text}">${d.ph.text.slice(0, 70)}${d.ph.text.length > 70 ? '…' : ''}</span>
                <span class="delta ${deltaClass}">${deltaText}</span>
              </div>
            `;
          }).join('')}
          <p style="font-size:0.75rem;color:var(--text-mute);margin-top:0.5rem">
            Low-level phrases come up more often. Phrases at L5 stay sticky.
          </p>
        </div>
      ` : ''}

      <div style="display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;margin-top:1rem">
        <button class="btn btn-ghost" onclick="_pulse=null;navigate('home')">Home</button>
        <button class="btn btn-secondary" onclick="startPulse('${tier}')">Run it back</button>
        <button class="btn btn-primary" onclick="_pulse=null;renderPulse()">Pick another tier</button>
      </div>

    </div>
  `;
}

function exitPulse() {
  if (_pulse && !_pulse.over) {
    if (!confirm('Exit this run? Progress and rewards will be lost.')) return;
  }
  tearDownPulse();
  _pulse = null;
  navigate('home');
}

// ================================================================
// SESSION 5 — ARGUMENT TOWER (turn-based tactical TD)
// 3 lanes × 5 columns. Objections spawn on the left and march right.
// 3 reach the right edge = you lose your composure. Win = clear 4 waves.
// Towers fire at the leftmost objection in their lane each turn.
// Spells are one-shots cast on a lane.
// ================================================================

const TD_LANES = 3;
const TD_COLS = 5;

const TOWER_LIBRARY = [
  // Placed towers
  { id: 'tw01', name: 'Evidence',     icon: '📊', mana: 1, dmg: 2, kind: 'evidence',
    isTower: true,
    text: 'Deals 2 dmg / turn. 2× vs Cost concern.', bonusVs: 'cost' },
  { id: 'tw02', name: 'Track Record', icon: '🏆', mana: 1, dmg: 2, kind: 'authority',
    isTower: true,
    text: 'Deals 2 dmg / turn. 2× vs Authority.', bonusVs: 'authority' },
  { id: 'tw03', name: 'Vision',       icon: '🔭', mana: 2, dmg: 3, kind: 'vision',
    isTower: true,
    text: 'Deals 3 dmg / turn. 2× vs Status Quo.', bonusVs: 'status' },
  // Spells (one-shot, choose a lane)
  { id: 'tw04', name: 'Reframe',      icon: '🔄', mana: 3, dmg: 3, kind: 'aoe',
    isSpell: true,
    text: 'Deals 3 dmg to ALL objections in a lane.' },
  { id: 'tw05', name: 'Stall',        icon: '⏸️', mana: 1, dmg: 0, kind: 'control',
    isSpell: true,
    text: 'All objections in a lane skip their next move.' }
];
function towerById(id) { return TOWER_LIBRARY.find(t => t.id === id); }

const OBJECTION_LIBRARY = [
  { id: 'cost',      name: 'Cost concern',        icon: '💰', hp: 2, color: 'orange' },
  { id: 'authority', name: 'Authority challenge', icon: '⚖️', hp: 3, color: 'red' },
  { id: 'status',    name: 'Status quo bias',     icon: '🛡️', hp: 4, color: 'blue' },
  { id: 'boss',      name: 'The Doubt',           icon: '👁️', hp: 12, color: 'purple', isBoss: true }
];
function objectionById(id) { return OBJECTION_LIBRARY.find(o => o.id === id); }

// Waves: each entry's queue is sorted by turn. Each {turn, lane, kind}.
const TD_WAVES = [
  { name: 'Polite skeptics', startMana: 3, manaPerTurn: 3,
    queue: [
      { turn: 0, lane: 1, kind: 'cost' },
      { turn: 1, lane: 0, kind: 'cost' },
      { turn: 2, lane: 2, kind: 'authority' }
    ] },
  { name: 'Sharper questions', startMana: 4, manaPerTurn: 3,
    queue: [
      { turn: 0, lane: 0, kind: 'cost' },
      { turn: 0, lane: 2, kind: 'cost' },
      { turn: 1, lane: 1, kind: 'authority' },
      { turn: 2, lane: 0, kind: 'authority' },
      { turn: 3, lane: 2, kind: 'status' }
    ] },
  { name: 'Heated exchange', startMana: 4, manaPerTurn: 4,
    queue: [
      { turn: 0, lane: 0, kind: 'cost' },
      { turn: 0, lane: 1, kind: 'authority' },
      { turn: 1, lane: 2, kind: 'status' },
      { turn: 2, lane: 1, kind: 'cost' },
      { turn: 3, lane: 0, kind: 'status' },
      { turn: 4, lane: 2, kind: 'authority' },
      { turn: 5, lane: 1, kind: 'status' }
    ] },
  { name: 'The Doubt arrives', startMana: 5, manaPerTurn: 5, isBossWave: true,
    queue: [
      { turn: 0, lane: 0, kind: 'authority' },
      { turn: 0, lane: 2, kind: 'cost' },
      { turn: 1, lane: 1, kind: 'boss' },
      { turn: 2, lane: 0, kind: 'status' },
      { turn: 3, lane: 2, kind: 'status' },
      { turn: 4, lane: 1, kind: 'authority' }
    ] }
];

// ----- TD State -----
if (!state.td) {
  state.td = {
    runsCompleted: 0,
    runsLost: 0,
    bestWaveReached: 0
  };
}
let _td = null; // transient session

function startTD() {
  SFX.click();
  _td = newTDState(0);
  renderTower();
}

function newTDState(waveIdx) {
  const wave = TD_WAVES[waveIdx];
  return {
    waveIdx,
    turn: 0,
    composure: waveIdx === 0 ? 3 : (_td ? _td.composure : 3), // 3 composure points (lives)
    composureMax: 3,
    mana: wave.startMana,
    // Board: grid[lane][col] = { kind:'tower'|'objection', ...data } or null
    grid: Array.from({ length: TD_LANES }, () => Array(TD_COLS).fill(null)),
    // Objection list with derived lane/col for easy iteration
    queueRemaining: wave.queue.slice().sort((a,b) => a.turn - b.turn),
    selectedCardId: null,
    over: false,
    won: false,
    bossDefeated: false,
    waveResult: null  // 'won' | 'lost' | null
  };
}

function tdAt(lane, col) {
  return _td.grid[lane] && _td.grid[lane][col];
}

// ----- Card selection -----
function selectTowerCard(cardId) {
  if (!_td || _td.over) return;
  const card = towerById(cardId);
  if (!card) return;
  if (_td.mana < card.mana) { showToast('Not enough mana.', 'error'); return; }
  _td.selectedCardId = _td.selectedCardId === cardId ? null : cardId;
  SFX.click();
  renderTower();
}

// ----- Placement / spell casting -----
function onCellClick(lane, col) {
  if (!_td || _td.over) return;
  if (!_td.selectedCardId) return;
  const card = towerById(_td.selectedCardId);
  if (!card) return;
  if (_td.mana < card.mana) return;

  if (card.isTower) {
    // Must be an empty cell
    if (tdAt(lane, col)) { showToast('Cell occupied.', 'error'); return; }
    _td.grid[lane][col] = {
      kind: 'tower',
      towerId: card.id,
      icon: card.icon,
      name: card.name,
      dmg: card.dmg,
      bonusVs: card.bonusVs || null
    };
    _td.mana -= card.mana;
    _td.selectedCardId = null;
    SFX.place();
    renderTower();
    return;
  }
  if (card.isSpell) {
    // Cast on the lane this cell is in. Any cell click counts as the lane.
    if (card.kind === 'aoe') {
      // Damage every objection in the lane
      for (let c = 0; c < TD_COLS; c++) {
        const cell = tdAt(lane, c);
        if (cell && cell.kind === 'objection') {
          applyDamageToObjection(lane, c, card.dmg);
        }
      }
    } else if (card.kind === 'control') {
      for (let c = 0; c < TD_COLS; c++) {
        const cell = tdAt(lane, c);
        if (cell && cell.kind === 'objection') cell.slowed = true;
      }
    }
    _td.mana -= card.mana;
    _td.selectedCardId = null;
    SFX.submit();
    renderTower();
    return;
  }
}

function applyDamageToObjection(lane, col, raw) {
  const cell = tdAt(lane, col);
  if (!cell || cell.kind !== 'objection') return;
  cell.hp -= raw;
  if (cell.hp <= 0) {
    _td.grid[lane][col] = null;
    if (cell.isBoss) _td.bossDefeated = true;
  }
}

// ----- Towers fire -----
function towersFire() {
  for (let lane = 0; lane < TD_LANES; lane++) {
    // Collect all towers in this lane (in column order, left to right)
    for (let col = 0; col < TD_COLS; col++) {
      const cell = tdAt(lane, col);
      if (!cell || cell.kind !== 'tower') continue;
      // Find leftmost objection in this lane
      let targetCol = -1;
      for (let c = 0; c < TD_COLS; c++) {
        const t = tdAt(lane, c);
        if (t && t.kind === 'objection') { targetCol = c; break; }
      }
      if (targetCol < 0) continue; // no target
      const tcell = tdAt(lane, targetCol);
      const tower = towerById(cell.towerId);
      const bonus = tower && tower.bonusVs && tcell.kindId === tower.bonusVs;
      const dmg = bonus ? cell.dmg * 2 : cell.dmg;
      applyDamageToObjection(lane, targetCol, dmg);
    }
  }
}

// ----- Objections advance -----
function objectionsAdvance() {
  // Process from rightmost col to leftmost so we don't double-advance
  // Walk each lane right-to-left, moving objections one col right.
  // Slowed objections skip this turn and lose the slow flag.
  for (let lane = 0; lane < TD_LANES; lane++) {
    for (let col = TD_COLS - 1; col >= 0; col--) {
      const cell = tdAt(lane, col);
      if (!cell || cell.kind !== 'objection') continue;
      if (cell.slowed) { cell.slowed = false; continue; }
      const nextCol = col + 1;
      if (nextCol >= TD_COLS) {
        // Off the right edge — counts as a land
        _td.grid[lane][col] = null;
        _td.composure = Math.max(0, _td.composure - 1);
        SFX.miss();
        showToast(`Objection landed in lane ${lane + 1}!`, 'error');
      } else {
        // Move only if destination is empty (don't crash through towers)
        if (!tdAt(lane, nextCol)) {
          _td.grid[lane][nextCol] = cell;
          _td.grid[lane][col] = null;
        }
        // If a tower blocks, objection stays put (and the tower will keep firing — softlock unlikely because the tower will eventually kill it)
      }
    }
  }
}

// ----- Spawns -----
function spawnObjectionsForTurn() {
  const incoming = _td.queueRemaining.filter(e => e.turn === _td.turn);
  _td.queueRemaining = _td.queueRemaining.filter(e => e.turn !== _td.turn);
  for (const ent of incoming) {
    const lane = ent.lane;
    // If lane[0] is occupied, push back to next column we can find from left
    let col = 0;
    while (col < TD_COLS && tdAt(lane, col)) col++;
    if (col >= TD_COLS) continue; // lane full — skip spawn (shouldn't happen in normal play)
    const obj = objectionById(ent.kind);
    _td.grid[lane][col] = {
      kind: 'objection',
      kindId: obj.id,
      icon: obj.icon,
      name: obj.name,
      hp: obj.hp,
      hpMax: obj.hp,
      isBoss: !!obj.isBoss,
      slowed: false
    };
  }
}

// ----- Next turn -----
function nextTurn() {
  if (!_td || _td.over) return;
  SFX.submit();
  // 1. Towers fire (using the state at the start of player's input)
  towersFire();
  // 2. Spawns (this turn's batch)
  spawnObjectionsForTurn();
  // 3. Advance objections
  objectionsAdvance();
  // 4. Mana refresh
  _td.mana += TD_WAVES[_td.waveIdx].manaPerTurn;
  _td.turn++;

  // 5. Win / lose checks
  if (_td.composure <= 0) {
    _td.over = true;
    _td.won = false;
    _td.waveResult = 'lost';
    SFX.lose();
    finishTDRun(false);
    renderTower();
    return;
  }
  // Wave win = no remaining queue AND no objections on board
  const boardHasObj = _td.grid.some(lane => lane.some(c => c && c.kind === 'objection'));
  if (_td.queueRemaining.length === 0 && !boardHasObj) {
    // Wave cleared
    if (_td.waveIdx + 1 >= TD_WAVES.length) {
      // Final wave — run won
      _td.over = true;
      _td.won = true;
      _td.waveResult = 'won-run';
      SFX.win();
      finishTDRun(true);
    } else {
      // Advance to next wave (player will see victory then proceed)
      _td.waveResult = 'won-wave';
      SFX.win();
    }
    renderTower();
    return;
  }

  renderTower();
}

function nextWave() {
  if (!_td) return;
  // Carry forward composure
  const carryComp = _td.composure;
  _td = newTDState(_td.waveIdx + 1);
  _td.composure = carryComp;
  SFX.click();
  renderTower();
}

function finishTDRun(won) {
  state.td.runsCompleted += won ? 1 : 0;
  state.td.runsLost += won ? 0 : 1;
  state.td.bestWaveReached = Math.max(state.td.bestWaveReached, _td.waveIdx + (won ? 1 : 0));
  // Reward: per-wave XP + Coins; boss bonus on full clear
  const baseXp = won ? 150 : 20 + _td.waveIdx * 25;
  const baseCoins = won ? 80 : 5 + _td.waveIdx * 12;
  state.xp += baseXp;
  state.coins += baseCoins;
  _td.xpEarned = baseXp;
  _td.coinsEarned = baseCoins;
  refreshHeaderStats();
  saveState();
}

function exitTD() {
  if (_td && !_td.over) {
    if (!confirm('Leave this Tower run? Progress will be lost.')) return;
  }
  _td = null;
  navigate('home');
}

// ----- Rendering -----
function renderTower() {
  const container = document.getElementById('tower-content');
  if (!container) return;
  if (!_td) {
    container.innerHTML = renderTowerIntro();
    return;
  }
  if (_td.over) {
    container.innerHTML = renderTowerEndOfRun();
    return;
  }
  if (_td.waveResult === 'won-wave') {
    container.innerHTML = renderTowerWaveCleared();
    return;
  }
  container.innerHTML = renderTowerBoard();
}

function renderCell(lane, col) {
  const cell = tdAt(lane, col);
  const isPlaceable = _td.selectedCardId &&
    towerById(_td.selectedCardId).isTower && !cell;
  const isTargetable = _td.selectedCardId &&
    towerById(_td.selectedCardId).isSpell;
  const isDanger = col === TD_COLS - 1;
  const classes = ['cell',
    isDanger ? 'danger' : '',
    isPlaceable ? 'placeable' : '',
    isTargetable ? 'targetable' : ''
  ].filter(Boolean).join(' ');
  const click = (isPlaceable || isTargetable) ? `onclick="onCellClick(${lane}, ${col})"` : '';
  let content = '';
  if (cell) {
    if (cell.kind === 'tower') {
      content = `<div class="tower"><span class="ico">${cell.icon}</span><span class="lbl">${cell.name.split(' ')[0]}</span></div>`;
    } else if (cell.kind === 'objection') {
      const pct = Math.max(0, Math.round((cell.hp / cell.hpMax) * 100));
      content = `
        <div class="objection ${cell.slowed ? 'slowed' : ''} ${cell.isBoss ? 'boss' : ''}">

          <div class="hp-bar-wrap"><div class="hp-bar" style="width:${pct}%"></div></div>

    content = `<span class="cell-empty-coord">L${lane+1}-${col+1}</span>`;
  }
  return `<div class="${classes}" ${click}>${content}</div>`;
}

// ================================================================
// SESSION 4 — COMPOSER MODE
// Sandbox: a prompt + a pool of phrase tiles. Build a response by
// tapping tiles onto a canvas in order. Score is multi-axis:
// framework coverage / sequence / specificity / length / filler-penalty
// + bonuses for named combos that fire on patterns.
// ================================================================

// Each prompt declares its framework name and an "ideal" sequence of roles.
// Scoring is permissive: many sequences score well, but matching the
// suggested order gives the highest framework + sequence bonus.
const COMPOSER_PROMPTS = [
  { id: 'cm01',
    framework: 'AIDA pitch',
    prompt: 'You\'re pitching a new product to a skeptical investor in 60 seconds. Make them lean forward and ask for the next meeting.',
    suggested: ['hook', 'point', 'example', 'closer'] },
  { id: 'cm02',
    framework: 'Tough quarter all-hands',
    prompt: 'Open the all-hands as CEO during a tough quarter. Acknowledge reality, set direction, and rally the team.',
    suggested: ['hook', 'point', 'reason', 'example', 'restated'] },
  { id: 'cm03',
    framework: 'Persuasive PREP',
    prompt: 'Convince your team to commit to a 6-week sprint that will be painful but necessary.',
    suggested: ['point', 'reason', 'example', 'restated'] },
  { id: 'cm04',
    framework: 'Pivot pitch to the board',
    prompt: 'Tell the board the company needs to pivot the product. Make the case in two minutes.',
    suggested: ['hook', 'point', 'reason', 'example', 'closer'] },
  { id: 'cm05',
    framework: 'Hostile Q&A bridge',
    prompt: 'A regulator asks a sharp question about an incident. Answer truthfully and bridge to what changes next.',
    suggested: ['point', 'reason', 'example', 'bridge', 'closer'] },
  { id: 'cm06',
    framework: 'Renewal save',
    prompt: 'A long-time customer is wavering on renewal. Turn them around in one short call.',
    suggested: ['hook', 'point', 'example', 'restated', 'closer'] }
];
function composerPromptById(id) { return COMPOSER_PROMPTS.find(p => p.id === id); }

// Combos detected after compose. Each takes the composition (array of role strings)
// and returns { fired: bool, bonus: number }.
const COMBOS = [
  { id: 'cb-punchline', icon: '🎯', name: 'Punchline',     bonus: 12, penalty: false,
    desc: 'Hook → … → Closer, with at least one Example between.',
    detect: roles => {
      const hookIdx   = roles.indexOf('hook');
      const closerIdx = roles.lastIndexOf('closer');
      if (hookIdx < 0 || closerIdx < 0 || closerIdx <= hookIdx) return false;
      const between = roles.slice(hookIdx + 1, closerIdx);
      return between.includes('example');
    } },
  { id: 'cb-prep', icon: '🧱', name: 'Tight PREP',         bonus: 18, penalty: false,
    desc: 'Point → Reason → Example → Restated, in order.',
    detect: roles => {
      // Look for the subsequence p r e x (allowing bridges between)
      const filtered = roles.filter(r => ['point','reason','example','restated','bridge'].includes(r));
      const seq = filtered.filter(r => r !== 'bridge'); // bridges are allowed but don't break the chain
      let i = 0; const target = ['point','reason','example','restated'];
      for (const r of seq) {
        if (r === target[i]) i++;
        if (i === target.length) return true;
      }
      return false;
    } },
  { id: 'cb-arc', icon: '🌅', name: 'Story Arc',           bonus: 12, penalty: false,
    desc: 'Hook → Example → Bridge → Restated.',
    detect: roles => {
      const target = ['hook','example','bridge','restated'];
      let i = 0;
      for (const r of roles) {
        if (r === target[i]) i++;
        if (i === target.length) return true;
      }
      return false;
    } },
  { id: 'cb-receipts', icon: '🧾', name: 'Receipts',       bonus: 8, penalty: false,
    desc: 'Two or more Examples consecutively.',
    detect: roles => {
      for (let i = 0; i < roles.length - 1; i++) {
        if (roles[i] === 'example' && roles[i+1] === 'example') return true;
      }
      return false;
    } },
  { id: 'cb-buzzsalad', icon: '🥴', name: 'Buzzword Salad', bonus: -20, penalty: true,
    desc: 'Three or more Filler phrases used.',
    detect: roles => roles.filter(r => r === 'filler').length >= 3 }
];

// Build today's tile pool: pull tiles from each non-filler role + 2 filler traps.
// Pool is regenerated each composition (fresh random) so each session is varied.
function buildComposerPool(promptId, seed) {
  const rng = seed ? seedFromString(promptId + '|' + seed) : Math.random.bind(Math);
  // Per-role draw counts — slightly weighted toward roles likely needed for variety.
  const draws = { hook: 2, point: 3, reason: 3, example: 3, bridge: 2, restated: 2, closer: 2, filler: 2 };
  const out = [];
  for (const [role, count] of Object.entries(draws)) {
    const pool = PHRASES.filter(p => p.role === role);
    const shuffled = shuffleArr(pool.slice(), rng);
    for (let i = 0; i < count && i < shuffled.length; i++) out.push(shuffled[i].id);
  }
  return shuffleArr(out, rng);
}

// Multi-axis scoring engine. Returns:
// { total, axes: [{label, value, max, detail}], combos: [{combo, fired}], xpEarned, coinsEarned }
function scoreComposition(composition, prompt) {
  const tiles = composition.map(id => phraseById(id)).filter(Boolean);
  const roles = tiles.map(t => t.role);
  const sug = prompt.suggested;

  // 1. Framework coverage (0-25): credit per suggested role that appears.
  const sugSet = new Set(sug);
  const hit = sug.filter(r => roles.includes(r));
  const coveragePct = sug.length ? hit.length / sug.length : 0;
  const frameworkScore = Math.round(coveragePct * 25);
  const frameworkDetail = `${hit.length}/${sug.length} suggested roles present (${sug.join(' → ')})`;

  // 2. Sequence (0-25): how well does the order of present suggested roles match the suggested order?
  // Compute the longest common subsequence of roles vs sug.
  const presentInOrder = roles.filter(r => sugSet.has(r));
  let i = 0; let inOrder = 0;
  for (const r of presentInOrder) {
    if (sug.indexOf(r, i) >= 0) { i = sug.indexOf(r, i) + 1; inOrder++; }
  }
  const seqPct = sug.length ? inOrder / sug.length : 0;
  const sequenceScore = Math.round(seqPct * 25);
  const sequenceDetail = `${inOrder} role${inOrder === 1 ? '' : 's'} in suggested order`;

  // 3. Specificity (0-20): bonus for Example tiles + tiles containing numbers/percentages/dollar signs
  let specificityScore = 0;
  let numericTiles = 0;
  tiles.forEach(t => {
    if (t.role === 'example') specificityScore += 4;
    if (/\d/.test(t.text)) { specificityScore += 3; numericTiles++; }
  });
  specificityScore = Math.min(20, specificityScore);
  const specificityDetail = numericTiles > 0
    ? `${numericTiles} tile${numericTiles === 1 ? '' : 's'} with concrete numbers`
    : 'No numeric specificity — add an Example with a number.';

  // 4. Length sweet-spot (0-15): 5-7 tiles = full credit; sliding penalty either side.
  const len = tiles.length;
  let lengthScore = 0;
  let lengthDetail = '';
  if (len === 0)        { lengthScore = 0;  lengthDetail = 'Empty composition.'; }
  else if (len <= 2)    { lengthScore = 3;  lengthDetail = 'Too short — develop the argument.'; }
  else if (len === 3)   { lengthScore = 8;  lengthDetail = 'Short but workable.'; }
  else if (len === 4)   { lengthScore = 12; lengthDetail = 'Close to ideal.'; }
  else if (len <= 7)    { lengthScore = 15; lengthDetail = 'Right in the sweet spot.'; }
  else if (len === 8)   { lengthScore = 12; lengthDetail = 'Slightly long — could tighten.'; }
  else                  { lengthScore = 7;  lengthDetail = 'Long — every extra tile dilutes.'; }

  // 5. Filler penalty (0 → -15): -5 per filler tile, capped at -15
  const fillerCount = roles.filter(r => r === 'filler').length;
  const fillerPenalty = -Math.min(15, fillerCount * 5);
  const fillerDetail = fillerCount === 0
    ? 'Clean — no buzzword phrases used.'
    : `${fillerCount} filler tile${fillerCount === 1 ? '' : 's'} — buzzwords cost credibility.`;

  // 6. Combos (variable +/-)
  const comboResults = COMBOS.map(c => ({ combo: c, fired: c.detect(roles) }));
  const comboFired = comboResults.filter(c => c.fired);
  const comboBonus = comboFired.reduce((s, c) => s + c.combo.bonus, 0);

  // Total — sum then cap at 100, floor at 0
  let total = frameworkScore + sequenceScore + specificityScore + lengthScore + fillerPenalty + comboBonus;
  total = Math.max(0, Math.min(100, Math.round(total)));

  const axes = [
    { label: 'Framework',   value: frameworkScore,   max: 25, kind: 'positive', detail: frameworkDetail },
    { label: 'Sequence',    value: sequenceScore,    max: 25, kind: 'positive', detail: sequenceDetail },
    { label: 'Specificity', value: specificityScore, max: 20, kind: 'positive', detail: specificityDetail },
    { label: 'Length',      value: lengthScore,      max: 15, kind: 'neutral',  detail: lengthDetail },
    { label: 'Filler',      value: fillerPenalty,    max: 0,  kind: 'negative', detail: fillerDetail }
  ];

  // Reward: XP + Coins scaled by total
  const xpEarned = Math.round(20 + (total / 100) * 60); // 20-80 XP
  const coinsEarned = Math.round(5 + (total / 100) * 30); // 5-35 Coins

  return { total, axes, combos: comboResults, xpEarned, coinsEarned };
}

// ----- Composer state -----
if (!state.composer) {
  state.composer = {
    totalCompositions: 0,
    bestScore: 0
  };
}
let _composer = null; // transient session

function startComposerSession(promptId) {
  // Pick the prompt: explicit > rotate next > random
  let prompt;
  if (promptId) prompt = composerPromptById(promptId);
  if (!prompt) prompt = COMPOSER_PROMPTS[Math.floor(Math.random() * COMPOSER_PROMPTS.length)];
  const poolSeed = String(Date.now()) + Math.random().toString(36).slice(2, 7);
  _composer = {
    prompt,
    composition: [],
    pool: buildComposerPool(prompt.id, poolSeed),
    poolSeed,
    result: null
  };
  renderComposer();
}

function newComposerPrompt() {
  SFX.click();
  // Cycle to a different prompt than the current one
  let candidates = COMPOSER_PROMPTS;
  if (_composer && _composer.prompt) candidates = COMPOSER_PROMPTS.filter(p => p.id !== _composer.prompt.id);
  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  startComposerSession(pick.id);
}

function tryThisPromptAgain() {
  SFX.click();
  if (!_composer || !_composer.prompt) { startComposerSession(null); return; }
  startComposerSession(_composer.prompt.id);
}

function addTileToCanvas(tileId) {
  if (!_composer) return;
  if (_composer.result) return; // composition submitted
  if (_composer.composition.includes(tileId)) return; // each tile usable once
  if (_composer.composition.length >= 9) {
    showToast('Canvas is full — remove a tile first.', 'error');
    return;
  }
  _composer.composition.push(tileId);
  SFX.place();
  renderComposer();
}

function removeFromCanvas(idx) {
  if (!_composer || _composer.result) return;
  if (idx < 0 || idx >= _composer.composition.length) return;
  _composer.composition.splice(idx, 1);
  SFX.unplace();
  renderComposer();
}

function moveCanvasTile(idx, direction) {
  if (!_composer || _composer.result) return;
  const target = idx + direction;
  if (target < 0 || target >= _composer.composition.length) return;
  const arr = _composer.composition;
  [arr[idx], arr[target]] = [arr[target], arr[idx]];
  SFX.click();
  renderComposer();
}

function clearComposition() {
  if (!_composer || _composer.result) return;
  if (_composer.composition.length === 0) return;
  _composer.composition = [];
  SFX.unplace();
  renderComposer();
}

function submitComposition() {
  if (!_composer || _composer.result) return;
  if (_composer.composition.length < 2) {
    showToast('Place at least 2 tiles before composing.', 'error');
    return;
  }
  SFX.submit();
  const result = scoreComposition(_composer.composition, _composer.prompt);
  _composer.result = result;

  // Apply rewards + bookkeeping
  state.xp += result.xpEarned;
  state.coins += result.coinsEarned;
  state.composer.totalCompositions++;
  if (result.total > state.composer.bestScore) state.composer.bestScore = result.total;
  refreshHeaderStats();
  saveState();

  // Sound for outcome
  if (result.total >= 80) setTimeout(() => SFX.win(), 200);
  else if (result.total >= 60) setTimeout(() => SFX.correct(), 200);
  else setTimeout(() => SFX.miss(), 200);

  renderComposer();
}

// ----- Renderers -----
function renderComposer() {
  const container = document.getElementById('composer-content');
  if (!container) return;
  if (!_composer) {
    container.innerHTML = renderComposerIntro();
    return;
  }
  if (_composer.result) {
    container.innerHTML = renderComposerResult(_composer.result);
    return;
  }
  container.innerHTML = renderComposerCompose();
}

function confirmLeaveComposer() {
  if (_composer && _composer.composition.length > 0 && !_composer.result) {
    if (!confirm('Leave this composition? Your current canvas will be lost.')) return;
  }
  _composer = null;
  navigate('home');
}

function renderComposerResult(result) {
  const c = _composer;
  const prompt = c.prompt;
  const tiles = c.composition.map(id => phraseById(id));
  const tier = result.total >= 80 ? 'great' : result.total >= 60 ? 'solid' : '';
  const headline = result.total >= 90 ? 'Outstanding.'
    : result.total >= 80 ? 'Strong composition.'
    : result.total >= 65 ? 'Solid attempt.'
    : result.total >= 45 ? 'Workable. Tighten it.'
    : 'Rough — try again with a different shape.';

  return `
    <div class="wordle-back" onclick="navigate('home')">← Back to modes</div>

    <div class="composer-result">
      <div class="composer-result-hero ${tier}">
        <div class="composer-result-score">${result.total}</div>
        <div class="composer-result-score-label">out of 100</div>
        <h2 style="margin-top:0.75rem">${headline}</h2>
        <div style="color:var(--text-dim);font-size:0.9rem">${prompt.framework}</div>
        <div class="composer-result-rewards">
          <span class="reward-pill xp">+${result.xpEarned} XP</span>
          <span class="reward-pill coins">+${result.coinsEarned} 🪙</span>
          ${result.total > (state.composer.bestScore - result.total === 0 ? -1 : 0) && result.total === state.composer.bestScore && state.composer.totalCompositions > 1
            ? '<span class="reward-pill heal">🏆 New best</span>'
            : ''}
        </div>
      </div>

      <div class="score-axes">
        <h3>Score breakdown</h3>
        ${result.axes.map(a => {
          const pct = a.kind === 'negative'
            ? Math.min(100, (Math.abs(a.value) / 15) * 100)
            : a.max ? Math.min(100, (a.value / a.max) * 100) : 0;
          const sign = a.value < 0 ? '' : '+';
          return `
            <div class="score-axis">
              <div class="score-axis-label">${a.label}</div>
              <div class="score-axis-bar-wrap">
                <div class="score-axis-bar ${a.kind}" style="width:${pct}%"></div>
              </div>
              <div class="score-axis-value ${a.value < 0 ? 'negative' : ''}">${sign}${a.value}${a.max ? '/' + a.max : ''}</div>
              <div class="score-axis-detail">${a.detail}</div>
            </div>
          `;
        }).join('')}
      </div>

      <div class="combos">
        <h3>Combos</h3>
        ${result.combos.filter(c => c.fired).length === 0
          ? `<p style="color:var(--text-mute);font-size:0.85rem">No named combos triggered. Try a Hook + Example + Closer arc, or a tight Point → Reason → Example → Restated chain.</p>`
          : result.combos.filter(c => c.fired).map(c => `
              <div class="combo ${c.combo.penalty ? 'penalty' : ''}">
                <div class="combo-icon">${c.combo.icon}</div>
                <div class="combo-body">
                  <div class="combo-name">${c.combo.name}</div>
                  <div class="combo-desc">${c.combo.desc}</div>
                </div>
                <div class="combo-bonus">${c.combo.bonus > 0 ? '+' : ''}${c.combo.bonus}</div>
              </div>
            `).join('')}
      </div>

      <div class="composer-transcript">
        <h3>Your composition</h3>
        ${tiles.length === 0 ? '<p style="color:var(--text-mute)">No tiles placed.</p>' : tiles.map((t, i) => `
          <div class="composer-transcript-line" data-role="${t.role}">
            <strong style="font-size:0.7rem;color:var(--text-mute);text-transform:uppercase;letter-spacing:0.05em">${i+1}. ${t.role}</strong>
            <div>${t.text}</div>
          </div>
        `).join('')}
      </div>

      <div style="display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:center;margin-top:1rem">
        <button class="btn btn-ghost" onclick="_composer = null; navigate('home')">
          Back to modes
        </button>
        <button class="btn btn-secondary" onclick="tryThisPromptAgain()">
          Try this prompt again
        </button>
        <button class="btn btn-primary" onclick="newComposerPrompt()">
          New prompt →
        </button>
      </div>
    </div>
  `;
}

// Resolve a card id, supporting "+" suffix for upgraded variants.
function cardById(id) {
  if (!id) return null;
  const upgraded = id.endsWith('+');
  const baseId = upgraded ? id.slice(0, -1) : id;
  const base = CARD_LIBRARY.find(c => c.id === baseId);
  if (!base) return null;
  if (!upgraded || !base.upgrade) return base;
  // Build the upgraded card by overlaying upgrade fields on the base.
  const up = base.upgrade;
  return {
    ...base,
    name: base.name + '+',
    cost: up.cost !== undefined ? up.cost : base.cost,
    text: up.text || base.text,
    effect: up.effect || base.effect,
    _upgraded: true,
    _id: id
  };
}
function cardsByRarity(rarity) { return CARD_LIBRARY.filter(c => c.rarity === rarity); }
function isUpgradedId(id) { return typeof id === 'string' && id.endsWith('+'); }
function upgradedIdOf(id) { return isUpgradedId(id) ? id : id + '+'; }

// Initialize state.deckRun on first load if missing
if (!state.deckRun) {
  state.deckRun = {
    active: false,
    deck: [],
    composureMax: 70,
    composure: 70,
    coinsThisRun: 0,
    fightsCompleted: 0,
    totalFights: 5,
