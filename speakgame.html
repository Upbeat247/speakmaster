<title>SpeakGame — A game of rhetoric</title>

<style>
/* ================================================================
   THEME VARIABLES — dark mode primary, light mode also supported
   ================================================================ */
:root {
  /* Dark theme (default) */
  --bg: #0a1726;
  --bg-elev: #122236;
  --bg-elev-2: #1a2d45;
  --bg-card: #14253b;
  --border: #243752;
  --border-strong: #34527a;

  --text: #e6eef8;
  --text-dim: #9ab0c8;
  --text-mute: #5e7796;

  --accent: #2dd4bf;          /* neon teal — primary action */
  --accent-soft: rgba(45,212,191,0.14);
  --accent-glow: rgba(45,212,191,0.45);

  --gold: #ffd166;
  --gold-soft: rgba(255,209,102,0.16);
  --orange: #ff8a4c;
  --pink: #ff5d8f;
  --red: #ef5350;
  --red-soft: rgba(239,83,80,0.18);
  --green: #4ade80;
  --green-soft: rgba(74,222,128,0.18);
  --yellow: #facc15;
  --yellow-soft: rgba(250,204,21,0.18);
  --purple: #a78bfa;

  --shadow: 0 8px 30px rgba(0,0,0,0.45);
  --shadow-lg: 0 18px 50px rgba(0,0,0,0.55);
  --shadow-glow: 0 0 30px var(--accent-glow);

  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 18px;
  --radius-xl: 28px;

  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --font-display: "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
}
[data-theme="light"] {
  --bg: #fdfaf5;
  --bg-elev: #ffffff;
  --bg-elev-2: #f5efe4;
  --bg-card: #ffffff;
  --border: #e8dccb;
  --border-strong: #cdb999;

  --text: #1f1a14;
  --text-dim: #5a5045;
  --text-mute: #95887a;

  --accent: #0d9488;
  --accent-soft: rgba(13,148,136,0.10);
  --accent-glow: rgba(13,148,136,0.25);

  --gold: #d4a017;
  --gold-soft: rgba(212,160,23,0.12);
  --orange: #ea580c;
  --pink: #be185d;
  --red: #b91c1c;
  --red-soft: rgba(185,28,28,0.10);
  --green: #15803d;
  --green-soft: rgba(21,128,61,0.12);
  --yellow: #ca8a04;
  --yellow-soft: rgba(202,138,4,0.12);
  --purple: #7c3aed;

  --shadow: 0 4px 14px rgba(60,40,10,0.10);
  --shadow-lg: 0 10px 30px rgba(60,40,10,0.15);
  --shadow-glow: 0 0 24px var(--accent-glow);
}

/* ================================================================
   GLOBAL RESET + BASE
   ================================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 16px; line-height: 1.45;
  overscroll-behavior: none;
  /* iOS safe-area handling */
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); text-decoration: none; }
[hidden] { display: none !important; }

/* ================================================================
   LAYOUT — header + main + view system
   ================================================================ */
.app {
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
  max-width: 1400px; margin: 0 auto;
  padding: 1rem;
}
@media (min-width: 900px) { .app { padding: 1.5rem 2rem; } }

.header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; margin-bottom: 1.25rem;
  padding-bottom: 1rem; border-bottom: 1px solid var(--border);
}
.brand {
  display: flex; align-items: center; gap: 0.6rem;
  font-family: var(--font-display); font-weight: 800; font-size: 1.25rem;
  letter-spacing: -0.01em;
  cursor: pointer;
}
.brand-mark {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; color: #0a1726; font-size: 1.1rem;
  box-shadow: var(--shadow-glow);
}
.brand-name span { color: var(--accent); }

.header-stats {
  display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  justify-content: flex-end;
}
.stat-chip {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.4rem 0.7rem; border-radius: 999px;
  background: var(--bg-elev); border: 1px solid var(--border);
  font-size: 0.85rem; font-weight: 600;
}
.stat-chip.xp { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.stat-chip.coins { color: var(--gold); border-color: var(--gold); background: var(--gold-soft); }
.stat-chip-ico { font-size: 1rem; line-height: 1; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px;
  background: var(--bg-elev); border: 1px solid var(--border);
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform 0.1s ease, border-color 0.15s ease;
}
.icon-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.icon-btn:active { transform: translateY(0); }
.icon-btn svg { width: 18px; height: 18px; }

main { flex: 1; }
.view { display: none; }
.view.active { display: block; animation: fade-in 0.18s ease; }
@keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* ================================================================
   HOME — mode picker
   ================================================================ */
.hero {
  padding: 1.5rem; margin-bottom: 1.25rem;
  background: linear-gradient(135deg, var(--bg-elev) 0%, var(--bg-elev-2) 100%);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at top right, var(--accent-glow), transparent 50%);
  opacity: 0.5; pointer-events: none;
}
.hero h1 {
  font-family: var(--font-display); font-weight: 900;
  font-size: clamp(1.6rem, 4vw, 2.4rem); line-height: 1.1;
  letter-spacing: -0.02em;
  margin-bottom: 0.4rem;
  position: relative;
}
.hero h1 span { color: var(--accent); }
.hero p {
  color: var(--text-dim); max-width: 560px;
  position: relative;
}

.mode-grid {
  display: grid; gap: 1rem;
  grid-template-columns: 1fr;
}
@media (min-width: 640px) { .mode-grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1100px) { .mode-grid { grid-template-columns: repeat(2, 1fr); gap: 1.2rem; } }

.mode-card {
  position: relative;
  padding: 1.5rem; min-height: 180px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); cursor: pointer;
  display: flex; flex-direction: column; gap: 0.65rem;
  transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  overflow: hidden;
  text-align: left;
}
.mode-card:hover:not(.locked) {
  border-color: var(--accent); transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
}
.mode-card.locked { opacity: 0.55; cursor: not-allowed; }
.mode-card::before {
  content: ''; position: absolute; inset: 0;
  background: var(--accent-tint, transparent);
  opacity: 0.06; pointer-events: none;
}
.mode-card[data-accent="teal"]   { --accent-tint: var(--accent); }
.mode-card[data-accent="gold"]   { --accent-tint: var(--gold); }
.mode-card[data-accent="orange"] { --accent-tint: var(--orange); }
.mode-card[data-accent="purple"] { --accent-tint: var(--purple); }

.mode-card-head {
  display: flex; align-items: center; gap: 0.75rem;
}
.mode-card-icon {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--bg-elev-2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; line-height: 1; flex-shrink: 0;
}
.mode-card[data-accent="teal"] .mode-card-icon   { color: var(--accent); border-color: var(--accent); }
.mode-card[data-accent="gold"] .mode-card-icon   { color: var(--gold); border-color: var(--gold); }
.mode-card[data-accent="orange"] .mode-card-icon { color: var(--orange); border-color: var(--orange); }
.mode-card[data-accent="purple"] .mode-card-icon { color: var(--purple); border-color: var(--purple); }
.mode-card h3 {
  font-family: var(--font-display); font-size: 1.15rem; font-weight: 800;
  letter-spacing: -0.01em;
}
.mode-card-tag {
  font-size: 0.68rem; font-weight: 700; color: var(--text-mute);
  letter-spacing: 0.06em; text-transform: uppercase;
}
.mode-card p { color: var(--text-dim); font-size: 0.92rem; line-height: 1.45; flex: 1; }
.mode-card-footer {
  display: flex; align-items: center; justify-content: space-between;
  gap: 0.5rem; padding-top: 0.5rem;
  border-top: 1px solid var(--border);
}
.mode-card-status {
  font-size: 0.78rem; color: var(--text-dim); font-weight: 600;
}
.mode-card-status.fresh { color: var(--accent); }
.mode-card-status.done { color: var(--green); }
.mode-card-cta {
  font-size: 0.85rem; font-weight: 700; color: var(--accent);
  display: inline-flex; align-items: center; gap: 0.3rem;
}
.locked-pill {
  display: inline-block; padding: 0.15rem 0.55rem; border-radius: 999px;
  background: var(--bg-elev); border: 1px solid var(--border);
  color: var(--text-mute); font-size: 0.65rem; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
}

/* ================================================================
   BUTTONS
   ================================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 0.5rem; padding: 0.7rem 1.1rem; border-radius: var(--radius);
  font-weight: 700; font-size: 0.95rem; cursor: pointer;
  background: var(--bg-elev); border: 1px solid var(--border);
  color: var(--text); transition: all 0.15s ease;
  user-select: none;
}
.btn:hover { transform: translateY(-1px); border-color: var(--text-mute); }
.btn:active { transform: translateY(0); }
.btn-primary {
  background: var(--accent); border-color: var(--accent);
  color: #0a1726; box-shadow: var(--shadow-glow);
}
.btn-primary:hover { filter: brightness(1.1); border-color: var(--accent); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-dim); }
.btn-ghost:hover { color: var(--text); background: var(--bg-elev); }
.btn-sm { padding: 0.4rem 0.7rem; font-size: 0.82rem; }
.btn-lg { padding: 0.85rem 1.4rem; font-size: 1.02rem; }
.btn[disabled] { opacity: 0.5; pointer-events: none; }

/* ================================================================
   WORDLE MODE
   ================================================================ */
.wordle {
  display: grid; gap: 1.25rem;
  grid-template-columns: 1fr;
}
@media (min-width: 1100px) {
  .wordle { grid-template-columns: 1fr 360px; }
}

.wordle-back {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-size: 0.85rem; color: var(--text-dim); font-weight: 600;
  margin-bottom: 0.75rem; cursor: pointer;
}
.wordle-back:hover { color: var(--accent); }

.wordle-main { min-width: 0; }

.wordle-prompt-card {
  padding: 1.25rem 1.4rem;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); margin-bottom: 1rem;
}
.wordle-meta {
  display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;
  margin-bottom: 0.6rem;
  font-size: 0.75rem; color: var(--text-mute);
  letter-spacing: 0.04em; text-transform: uppercase; font-weight: 700;
}
.wordle-meta-divider { color: var(--border-strong); }
.wordle-prompt {
  font-family: var(--font-display); font-size: 1.1rem; line-height: 1.45;
  font-weight: 600;
}
.wordle-prompt em { font-style: normal; color: var(--accent); font-weight: 700; }

.wordle-slots {
  display: grid; gap: 0.6rem; margin-bottom: 1.2rem;
  grid-template-columns: 1fr;
}
.wordle-slot {
  position: relative;
  display: flex; align-items: center;
  min-height: 56px; padding: 0.7rem 1rem;
  background: var(--bg-elev); border: 2px dashed var(--border);
  border-radius: var(--radius); transition: all 0.15s ease;
  font-size: 0.92rem; line-height: 1.35;
}
.wordle-slot:hover { border-color: var(--text-mute); }
.wordle-slot.selected { border-color: var(--accent); background: var(--accent-soft); border-style: solid; }
.wordle-slot.filled { border-style: solid; }
.wordle-slot-label {
  font-size: 0.65rem; font-weight: 700; color: var(--text-mute);
  letter-spacing: 0.08em; text-transform: uppercase;
  position: absolute; top: -8px; left: 14px;
  padding: 0 0.4rem; background: var(--bg);
}
.wordle-slot-content { width: 100%; }
.wordle-slot-empty {
  color: var(--text-mute); font-style: italic; font-size: 0.85rem;
}
.wordle-slot-text { color: var(--text); }
.wordle-slot-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--bg-elev-2); color: var(--text-mute);
  display: none; align-items: center; justify-content: center; font-size: 0.85rem;
}
.wordle-slot.filled .wordle-slot-clear { display: inline-flex; }
.wordle-slot-clear:hover { color: var(--red); }

.tile-pool {
  display: grid; gap: 0.5rem;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  margin-bottom: 1.25rem;
}
@media (min-width: 900px) {
  .tile-pool { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
}
.tile {
  padding: 0.7rem 0.9rem; min-height: 60px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); cursor: pointer;
  font-size: 0.85rem; line-height: 1.4;
  text-align: left; user-select: none;
  transition: transform 0.1s ease, border-color 0.15s ease, opacity 0.15s ease;
  position: relative;
}
.tile:hover { transform: translateY(-2px); border-color: var(--accent); }
.tile.used { opacity: 0.35; cursor: not-allowed; }
.tile.used:hover { transform: none; border-color: var(--border); }
.tile.feedback-correct { border-color: var(--green); background: var(--green-soft); }
.tile.feedback-misplaced { border-color: var(--yellow); background: var(--yellow-soft); }
.tile.feedback-wrong { border-color: var(--border); opacity: 0.4; }

.wordle-actions {
  display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem;
  align-items: center;
}
.wordle-actions .spacer { flex: 1; }
.wordle-attempts-left {
  font-size: 0.85rem; color: var(--text-dim); font-weight: 600;
}

/* Attempts history grid (a la Wordle) */
.wordle-history {
  padding: 1rem 1.1rem;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.wordle-history h4 {
  font-family: var(--font-display); font-size: 0.92rem; font-weight: 700;
  margin-bottom: 0.6rem; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.wordle-history-row {
  display: flex; gap: 0.35rem; margin-bottom: 0.4rem;
}
.wordle-history-cell {
  width: 32px; height: 32px; border-radius: 6px;
  background: var(--bg-elev); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; font-weight: 700;
}
.wordle-history-cell.correct  { background: var(--green); color: #0a1726; border-color: var(--green); }
.wordle-history-cell.misplaced { background: var(--yellow); color: #0a1726; border-color: var(--yellow); }
.wordle-history-cell.wrong    { background: var(--bg-elev-2); color: var(--text-mute); }

.wordle-side {
  display: flex; flex-direction: column; gap: 1rem;
}
.side-card {
  padding: 1rem 1.2rem;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.side-card h4 {
  font-family: var(--font-display); font-size: 0.85rem; font-weight: 700;
  color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 0.6rem;
}
.streak-big {
  font-family: var(--font-display); font-size: 2.5rem; font-weight: 900;
  line-height: 1; color: var(--accent);
}
.streak-sub { font-size: 0.85rem; color: var(--text-dim); margin-top: 0.25rem; }

/* End-of-game overlay */
.endgame {
  padding: 1.5rem 1.4rem; margin-bottom: 1rem;
  background: linear-gradient(135deg, var(--bg-elev) 0%, var(--bg-elev-2) 100%);
  border: 2px solid var(--accent); border-radius: var(--radius-lg);
  text-align: center;
  animation: pop-in 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.endgame.lose { border-color: var(--orange); }
.endgame h2 {
  font-family: var(--font-display); font-size: 1.5rem; font-weight: 900;
  margin-bottom: 0.4rem;
}
.endgame p { color: var(--text-dim); margin-bottom: 0.85rem; }
.endgame-rewards {
  display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;
  margin-bottom: 0.85rem;
}
.endgame-reward {
  padding: 0.4rem 0.85rem; border-radius: 999px;
  background: var(--bg-elev); border: 1px solid var(--border);
  font-weight: 700;
}
.endgame-reward.xp { color: var(--accent); border-color: var(--accent); }
.endgame-reward.coins { color: var(--gold); border-color: var(--gold); }
.endgame-share-grid {
  font-family: var(--font-mono); font-size: 1.3rem; line-height: 1.2;
  margin: 0.85rem 0; user-select: all;
  white-space: pre;
}
@keyframes pop-in {
  0% { transform: scale(0.9); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* Tile flip animation when feedback arrives */
@keyframes flip-cell {
  0%   { transform: rotateX(0); }
  50%  { transform: rotateX(90deg); }
  100% { transform: rotateX(0); }
}
.wordle-history-cell.flipping { animation: flip-cell 0.45s ease; }

/* ================================================================
   SETTINGS
   ================================================================ */
.settings-card {
  padding: 1.2rem; margin-bottom: 1rem;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.settings-card h3 {
  font-family: var(--font-display); font-size: 0.92rem; font-weight: 700;
  color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em;
  margin-bottom: 0.75rem;
}
.setting-row {
  display: flex; justify-content: space-between; align-items: center;
  gap: 1rem; padding: 0.65rem 0;
  border-bottom: 1px solid var(--border);
}
.setting-row:last-child { border-bottom: none; }
.setting-label { font-weight: 600; }
.setting-desc { font-size: 0.8rem; color: var(--text-dim); margin-top: 0.2rem; }
.setting-toggle {
  width: 46px; height: 26px; border-radius: 999px;
  background: var(--bg-elev-2); border: 1px solid var(--border);
  position: relative; cursor: pointer; transition: background 0.18s ease;
  flex-shrink: 0;
}
.setting-toggle::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--text-dim); transition: all 0.18s ease;
}
.setting-toggle.on { background: var(--accent); border-color: var(--accent); }
.setting-toggle.on::after { left: 22px; background: #0a1726; }

/* ================================================================
   TOAST
   ================================================================ */
.toast {
  position: fixed; bottom: max(1rem, env(safe-area-inset-bottom));
  left: 50%; transform: translateX(-50%);
  padding: 0.7rem 1.1rem; border-radius: 999px;
  background: var(--bg-elev-2); border: 1px solid var(--border-strong);
  font-size: 0.9rem; font-weight: 600;
  box-shadow: var(--shadow-lg);
  z-index: 9999; opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { color: var(--red); border-color: var(--red); }
.toast.success { color: var(--green); border-color: var(--green); }

/* ================================================================
   DECK MODE — run map, fight UI, cards, audience
   ================================================================ */

/* --- Deck home / run map --- */
.deck-screen { max-width: 980px; margin: 0 auto; }

.run-banner {
  padding: 1.5rem 1.4rem; margin-bottom: 1.25rem;
  background: linear-gradient(135deg, var(--bg-elev) 0%, var(--bg-elev-2) 100%);
  border: 1px solid var(--gold); border-radius: var(--radius-lg);
  position: relative; overflow: hidden;
}
.run-banner::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at top right, var(--gold-soft), transparent 60%);
  pointer-events: none;
}
.run-banner h2 {
  font-family: var(--font-display); font-size: 1.5rem; font-weight: 900;
  margin-bottom: 0.25rem; position: relative;
}
.run-banner p { color: var(--text-dim); position: relative; }

.run-stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem;
  margin: 0.85rem 0 0.5rem; position: relative;
}
.run-stat {
  padding: 0.6rem 0.8rem; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius);
}
.run-stat-label {
  font-size: 0.65rem; font-weight: 700; color: var(--text-mute);
  text-transform: uppercase; letter-spacing: 0.06em;
}
.run-stat-value {
  font-family: var(--font-display); font-size: 1.4rem; font-weight: 800;
  margin-top: 0.15rem;
}
.run-stat-value.coins { color: var(--gold); }
.run-stat-value.composure { color: var(--green); }
.run-stat-value.composure.low { color: var(--orange); }
.run-stat-value.composure.critical { color: var(--red); }

.run-map {
  display: flex; flex-direction: column; gap: 0.6rem;
  margin-bottom: 1.25rem;
}
.map-node {
  display: flex; align-items: center; gap: 0.85rem;
  padding: 0.95rem 1.1rem;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer;
  transition: transform 0.15s ease, border-color 0.15s ease;
  position: relative;
}
.map-node:hover:not(.locked):not(.done) {
  transform: translateX(4px); border-color: var(--accent);
}
.map-node.done { opacity: 0.6; cursor: default; border-color: var(--green); }
.map-node.locked { opacity: 0.4; cursor: not-allowed; }
.map-node.current { border-color: var(--accent); box-shadow: var(--shadow-glow); }
.map-node.boss { border-color: var(--gold); }
.map-node.boss.current { box-shadow: 0 0 30px var(--gold-soft); }
.map-node-icon {
  width: 42px; height: 42px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; flex-shrink: 0;
  background: var(--bg-elev-2); border: 1px solid var(--border);
}
.map-node.done .map-node-icon { background: var(--green-soft); border-color: var(--green); }
.map-node.boss .map-node-icon { background: var(--gold-soft); border-color: var(--gold); }
.map-node-body { flex: 1; min-width: 0; }
.map-node-title { font-weight: 700; font-size: 1rem; }
.map-node-sub { font-size: 0.78rem; color: var(--text-dim); margin-top: 0.15rem; }
.map-node-cta {
  font-size: 0.82rem; font-weight: 700; color: var(--accent);
  white-space: nowrap;
}
.map-node.done .map-node-cta { color: var(--green); }
.map-node.locked .map-node-cta { color: var(--text-mute); }

/* --- Deck inspection (between fights) --- */
.deck-section { margin-bottom: 1.25rem; }
.deck-section h3 {
  font-family: var(--font-display); font-size: 0.85rem; font-weight: 700;
  color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 0.5rem;
}
.card-grid {
  display: grid; gap: 0.6rem;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
}

/* --- Card visuals --- */
.card {
  position: relative;
  padding: 0.75rem 0.85rem; min-height: 130px;
  background: var(--bg-card); border: 2px solid var(--border);
  border-radius: var(--radius); cursor: pointer;
  display: flex; flex-direction: column; gap: 0.45rem;
  font-size: 0.82rem; line-height: 1.35; user-select: none;
  transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.12s ease;
  overflow: hidden;
}
.card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: var(--shadow); }
.card[data-type="attack"]  { border-color: var(--orange); }
.card[data-type="skill"]   { border-color: var(--accent); }
.card[data-type="power"]   { border-color: var(--purple); }
.card[data-type="combo"]   { border-color: var(--gold); }
.card[data-rarity="rare"]      { box-shadow: 0 0 18px rgba(167,139,250,0.25); }
.card[data-rarity="uncommon"]  { box-shadow: 0 0 12px rgba(45,212,191,0.18); }
.card.played { opacity: 0.55; transform: scale(0.96); pointer-events: none; }
.card.unaffordable { opacity: 0.42; cursor: not-allowed; }
.card.unaffordable:hover { transform: none; }
.card.selected { transform: translateY(-8px); box-shadow: var(--shadow-glow), 0 12px 24px rgba(0,0,0,0.4); }

.card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 0.4rem;
}
.card-name { font-family: var(--font-display); font-weight: 800; font-size: 0.92rem; line-height: 1.15; }
.card-cost {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--bg-elev-2); border: 1px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 0.85rem; color: var(--accent);
  flex-shrink: 0;
}
.card[data-cost="0"] .card-cost { color: var(--green); }
.card-type-pill {
  display: inline-block; padding: 0.05rem 0.45rem;
  border-radius: 999px; font-size: 0.62rem; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  background: var(--bg-elev-2); color: var(--text-mute);
  border: 1px solid var(--border);
}
.card[data-type="attack"] .card-type-pill { color: var(--orange); border-color: var(--orange); }
.card[data-type="skill"]  .card-type-pill { color: var(--accent); border-color: var(--accent); }
.card[data-type="power"]  .card-type-pill { color: var(--purple); border-color: var(--purple); }
.card[data-type="combo"]  .card-type-pill { color: var(--gold); border-color: var(--gold); }
.card-text { color: var(--text-dim); font-size: 0.78rem; flex: 1; }
.card-text strong { color: var(--text); font-weight: 700; }
.card-text .hl { color: var(--accent); font-weight: 700; }

/* Compact card variant for hand on small screens */
.card.compact { min-height: 110px; font-size: 0.75rem; }

/* --- Fight screen --- */
.fight {
  display: grid; grid-template-rows: auto auto 1fr auto;
  gap: 0.85rem;
}
@media (min-width: 1000px) {
  .fight { grid-template-rows: auto auto 1fr auto; }
}

.audience-panel {
  padding: 1rem 1.1rem;
  background: var(--bg-card); border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  position: relative;
}
.audience-head {
  display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.65rem;
}
.audience-emoji {
  width: 48px; height: 48px; border-radius: 14px;
  background: var(--bg-elev-2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; flex-shrink: 0;
}
.audience-name {
  font-family: var(--font-display); font-size: 1.1rem; font-weight: 800;
}
.audience-desc { font-size: 0.78rem; color: var(--text-dim); }
.skepticism-bar-wrap {
  height: 18px; border-radius: 999px;
  background: var(--bg-elev-2); border: 1px solid var(--border);
  position: relative; overflow: hidden;
}
.skepticism-bar {
  height: 100%; background: linear-gradient(90deg, var(--red), var(--orange));
  transition: width 0.4s ease;
}
.skepticism-label {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem; font-weight: 800; color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.6);
}
.audience-state {
  display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem;
  flex-wrap: wrap; font-size: 0.8rem;
}
.audience-state .badge {
  display: inline-flex; align-items: center; gap: 0.3rem;
  padding: 0.2rem 0.55rem; border-radius: 999px;
  background: var(--bg-elev); border: 1px solid var(--border);
  font-weight: 700;
}
.audience-state .badge.resistance { color: var(--purple); border-color: var(--purple); }
.audience-state .badge.conviction { color: var(--red); border-color: var(--red); }
.intent-card {
  margin-top: 0.6rem; padding: 0.55rem 0.8rem;
  background: var(--bg-elev-2); border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
}
.intent-card .intent-label {
  font-size: 0.65rem; color: var(--text-mute); font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.15rem;
}
.intent-card.attack { border-left-color: var(--red); }
.intent-card.defend { border-left-color: var(--purple); }
.intent-card.buff { border-left-color: var(--orange); }

/* Player stats strip */
.player-strip {
  display: grid; grid-template-columns: 1fr auto auto; gap: 0.75rem;
  padding: 0.7rem 1rem;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius);
  align-items: center;
}
.composure-block {
  display: flex; flex-direction: column; gap: 0.25rem; min-width: 0;
}
.composure-label {
  font-size: 0.7rem; color: var(--text-mute); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.composure-bar-wrap {
  height: 14px; border-radius: 999px;
  background: var(--bg-elev-2); border: 1px solid var(--border);
  overflow: hidden; position: relative;
}
.composure-bar {
  height: 100%; background: linear-gradient(90deg, var(--green) 0%, var(--accent) 100%);
  transition: width 0.4s ease;
}
.composure-text {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem; font-weight: 800; color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.7);
}
.block-pill {
  padding: 0.3rem 0.6rem; border-radius: 999px;
  background: var(--purple); color: #fff;
  font-weight: 800; font-size: 0.85rem;
  display: inline-flex; align-items: center; gap: 0.25rem;
  border: none; min-width: 50px; justify-content: center;
}
.block-pill.zero { background: var(--bg-elev-2); color: var(--text-mute); border: 1px solid var(--border); }
.energy-pill {
  padding: 0.3rem 0.7rem; border-radius: 999px;
  background: var(--accent); color: #0a1726;
  font-weight: 800; font-size: 0.95rem;
  display: inline-flex; align-items: center; gap: 0.25rem;
  border: none;
}
.energy-pill.empty { background: var(--bg-elev-2); color: var(--text-mute); }

/* Play log (cards played this turn) */
.play-log {
  min-height: 70px; padding: 0.7rem;
  background: var(--bg-elev); border: 1px dashed var(--border);
  border-radius: var(--radius);
  display: flex; flex-wrap: wrap; gap: 0.4rem;
  align-items: center; justify-content: center;
  color: var(--text-mute); font-size: 0.85rem;
}
.play-log.empty::before {
  content: 'Played cards appear here'; font-style: italic;
}
.play-log .mini-card {
  padding: 0.3rem 0.55rem; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 0.75rem; font-weight: 700;
  animation: card-pop 0.35s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes card-pop {
  0%   { transform: scale(0.3) translateY(20px); opacity: 0; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}

/* Hand of cards */
.hand-area {
  display: flex; flex-direction: column; gap: 0.5rem;
}
.hand-meta {
  display: flex; align-items: center; justify-content: space-between;
  gap: 0.5rem; font-size: 0.78rem; color: var(--text-dim);
}
.hand-meta .pile { font-weight: 700; }
.hand-meta .pile span { color: var(--text); }
.hand {
  display: grid; gap: 0.5rem;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
}
@media (max-width: 700px) {
  .hand {
    grid-template-columns: none;
    grid-auto-flow: column;
    grid-auto-columns: 78%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding-bottom: 0.5rem;
  }
  .hand .card { scroll-snap-align: start; }
}
.end-turn-btn {
  width: 100%; padding: 0.85rem; border-radius: var(--radius);
  background: var(--orange); color: #0a1726;
  font-weight: 800; font-size: 1rem; cursor: pointer;
  border: none; transition: filter 0.15s ease, transform 0.1s ease;
}
.end-turn-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.end-turn-btn:active { transform: translateY(0); }

/* --- Reward picker --- */
.reward-screen { max-width: 900px; margin: 0 auto; text-align: center; }
.reward-screen h2 {
  font-family: var(--font-display); font-size: 1.8rem; font-weight: 900;
  margin-bottom: 0.35rem;
}
.reward-screen .victory-sub {
  color: var(--text-dim); margin-bottom: 1.25rem;
}
.reward-rewards {
  display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;
  margin-bottom: 1.5rem;
}
.reward-pill {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.45rem 0.95rem; border-radius: 999px;
  background: var(--bg-elev); border: 1px solid var(--border);
  font-weight: 700; font-size: 0.92rem;
}
.reward-pill.xp { color: var(--accent); border-color: var(--accent); }
.reward-pill.coins { color: var(--gold); border-color: var(--gold); }
.reward-pill.heal { color: var(--green); border-color: var(--green); }

.card-pick-row {
  display: grid; gap: 0.85rem; margin-bottom: 1rem;
  grid-template-columns: 1fr;
}
@media (min-width: 700px) {
  .card-pick-row { grid-template-columns: repeat(3, 1fr); max-width: 700px; margin: 0 auto 1rem; }
}
.card-pick-row .card { min-height: 160px; cursor: pointer; }
.card-pick-row .card:hover { transform: translateY(-6px); }

/* --- End of run --- */
.run-end {
  max-width: 700px; margin: 0 auto; padding: 2rem 1.5rem;
  background: linear-gradient(135deg, var(--bg-elev) 0%, var(--bg-elev-2) 100%);
  border: 2px solid var(--accent); border-radius: var(--radius-lg);
  text-align: center;
}
.run-end.lost { border-color: var(--orange); }
.run-end .crown {
  font-size: 3rem; line-height: 1; margin-bottom: 0.5rem;
}
.run-end h2 {
  font-family: var(--font-display); font-size: 2rem; font-weight: 900;
  margin-bottom: 0.4rem;
}
.run-end p { color: var(--text-dim); margin-bottom: 1.25rem; }

/* --- Coming-fight preview chip --- */
.preview-chip {
  display: inline-flex; align-items: center; gap: 0.35rem;
  font-size: 0.72rem; color: var(--text-mute); font-weight: 700;
  letter-spacing: 0.04em; text-transform: uppercase;
}

/* ================================================================
   RESPONSIVE TWEAKS
   ================================================================ */
@media (max-width: 520px) {
  .header { gap: 0.5rem; }
  .header-stats { gap: 0.3rem; }
  .stat-chip { font-size: 0.75rem; padding: 0.3rem 0.55rem; }

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<script>
'use strict';

// ================================================================
// STATE
// ================================================================
const STATE_KEY = 'speakgame-state-v1';

const state = {
  xp: 0,
  coins: 0,
  // Wordle progression
  wordleStreak: 0,           // current streak in consecutive days
  wordleLongestStreak: 0,    // best ever
  wordleLastPlayedDay: null, // YYYY-MM-DD of last day completed
  wordleDailyResult: null,   // {day, won, attempts, rows, xpEarned, coinsEarned} for today only
  wordleInProgress: null,    // {day, attempts: [], slots: [null,null,...], puzzleId} mid-game
  settings: {
    theme: 'dark',
    sound: true,
    animations: true
  }
};

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
  } catch (e) { /* quota or private mode — ignore */ }
}
function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    // Merge keys that exist; preserve defaults for new fields
    for (const k of Object.keys(state)) {
      if (parsed[k] !== undefined) {
        if (typeof state[k] === 'object' && state[k] !== null && !Array.isArray(state[k])) {
          Object.assign(state[k], parsed[k]);
        } else {
          state[k] = parsed[k];
        }
      }
    }
  } catch (e) { /* corrupted — ignore */ }
}

// ================================================================
// SOUND — Web Audio API, lightweight tones; no external assets
// ================================================================
let _audioCtx = null;
function audioCtx() {
  if (_audioCtx) return _audioCtx;
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return null;
  _audioCtx = new Ctor();
  return _audioCtx;
}
function tone(freq, durMs, type = 'sine', volume = 0.06, attack = 0.005) {
  if (!state.settings.sound) return;
  const ctx = audioCtx();
  if (!ctx) return;
  // iOS Safari: resume after user gesture
  if (ctx.state === 'suspended') { ctx.resume().catch(()=>{}); }
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type; osc.frequency.value = freq;
  osc.connect(gain); gain.connect(ctx.destination);
  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(volume, now + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + durMs / 1000);
  osc.start(now); osc.stop(now + durMs / 1000 + 0.02);
}
const SFX = {

// ================================================================
// DAILY SEED — deterministic per local day
// ================================================================
function todayKey() {
  // YYYY-MM-DD in user's local timezone — matches "daily reset at local midnight"
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function dayOfYear() {
  const d = new Date();
  const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
}
function todayPuzzleNumber() {
  // Stable counter shown to user; cycles weekly through WORDLE_PUZZLES.
  return dayOfYear();
}
function todayPuzzle() {
  const idx = dayOfYear() % WORDLE_PUZZLES.length;
  return WORDLE_PUZZLES[idx];
}

// Seeded RNG (mulberry32) for stable daily decoy selection.
function seedFromString(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return () => {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return ((h ^= h >>> 16) >>> 0) / 4294967296;
  };
}
function shuffleWithRng(arr, rng) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

// Build today's tile pool: 4 correct + N decoys; same seed -> same arrangement.
function buildTilePool(puzzle, dayKey) {
  const rng = seedFromString(`${puzzle.id}|${dayKey}`);
  const correctIds = puzzle.slots.map(s => s.correctId);
  const allOthers = PHRASES
    .filter(p => !correctIds.includes(p.id))
    .map(p => p.id);
  const shuffledOthers = shuffleWithRng(allOthers, rng);
  const decoys = shuffledOthers.slice(0, WORDLE_TILE_POOL_SIZE - correctIds.length);
  return shuffleWithRng([...correctIds, ...decoys], rng);
}

    runsLost: 0
  };
}

function startNewRun() {
  SFX.click();
  // Build the run map: 4 normal fights with distinct audiences + 1 boss
  const usedIds = [];
  const nodes = [];
  for (let i = 0; i < 4; i++) {
    const aud = pickNormalAudience(usedIds);
    usedIds.push(aud.id);
    nodes.push({ kind: 'fight', audienceId: aud.id, done: false, isBoss: false });
  }
  nodes.push({ kind: 'fight', audienceId: 'b01', done: false, isBoss: true });

  state.deckRun = {
    active: true,
    deck: STARTER_DECK_IDS.slice(),
    composureMax: 70,
    composure: 70,
    coinsThisRun: 0,
    fightsCompleted: 0,
    totalFights: 5,
    nodes,
    pendingReward: null,
    runsCompleted: state.deckRun?.runsCompleted || 0,
    runsLost: state.deckRun?.runsLost || 0
  };
  saveState();
  renderDeck();
}

function abandonRun() {
  if (!confirm('Abandon this run? Your deck and progress will be lost — your XP and Coins so far are kept.')) return;
  state.deckRun.active = false;
  saveState();
  renderDeck();
}

// ================================================================
// DECK MODE — Fight engine
// _fight is transient; lives only for the duration of one fight.
// ================================================================
let _fight = null;

function startFight(nodeIdx) {
  const node = state.deckRun.nodes[nodeIdx];
  if (!node || node.done) return;
  const audience = audienceById(node.audienceId);
  if (!audience) return;
  SFX.click();

  // Build draw pile from full deck, shuffled
  const draw = shuffleArr(state.deckRun.deck.slice());
  _fight = {
    nodeIdx,
    audience: {
      id: audience.id,
      name: audience.name,
      emoji: audience.emoji,
      desc: audience.desc,
      isBoss: audience.isBoss || false,
      skepticismMax: audience.skepticism,
      skepticism: audience.skepticism,
      resistance: 0,
      conviction: 0,
      intents: audience.intents.slice(),
      intentIdx: 0,
      skipNextIntent: false
    },
    composureMax: state.deckRun.composureMax,
    composure: state.deckRun.composure,
    block: 0,
    energyMax: 3,
    energy: 3,
    drawPile: draw,
    hand: [],
    discard: [],
    exhaust: [],
    playLog: [],          // mini cards shown for this turn
    powers: [],           // {cardId, kind}
    turnFlags: {
      attacksPlayed: 0,
      skillsPlayed: 0,
      doubleNextAttack: false
    },
    over: false,
    won: false
  };
  drawCards(5);
  renderDeck();
}

function shuffleArr(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function drawCards(n) {
  for (let i = 0; i < n; i++) {
    if (_fight.drawPile.length === 0) {
      if (_fight.discard.length === 0) return; // truly empty
      _fight.drawPile = shuffleArr(_fight.discard);
      _fight.discard = [];
    }
    _fight.hand.push(_fight.drawPile.shift());
  }
}

function getCurrentIntent() {
  return _fight.audience.intents[_fight.audience.intentIdx % _fight.audience.intents.length];
}

function playCard(handIdx) {
  if (!_fight || _fight.over) return;
  const cardId = _fight.hand[handIdx];
  if (!cardId) return;
  const card = cardById(cardId);
  if (!card) return;
  if (_fight.energy < card.cost) {
    showToast('Not enough energy.', 'error');
    return;
  }
  // Some cards have play conditions
  if (card.effect && card.effect.special === 'must-be-last' && _fight.hand.length > 1) {
    showToast('Mic Drop can only be played as your last card.', 'error');
    return;
  }

  _fight.energy -= card.cost;
  _fight.hand.splice(handIdx, 1);
  _fight.playLog.push(card.name);
  SFX.place();

  // Tally turn flags
  if (card.type === 'attack') _fight.turnFlags.attacksPlayed++;
  if (card.type === 'skill')  _fight.turnFlags.skillsPlayed++;

  // ----- APPLY EFFECTS -----
  const e = card.effect || {};
  let persuasion = e.persuasion || 0;

  // Combo bonus: comboWith ('attack'|'skill') checks prior plays this turn
  if (e.comboWith === 'attack' && _fight.turnFlags.attacksPlayed > 1) {
    // The current card already counted as an attack — bonus if any OTHER attack was played
    persuasion += e.comboBonus || 0;
  } else if (e.comboWith === 'skill' && _fight.turnFlags.skillsPlayed > (card.type === 'skill' ? 1 : 0)) {
    persuasion += e.comboBonus || 0;
  }

  // Special effects
  if (e.special === 'damage-equals-block') {
    persuasion += _fight.block;
  }
  if (e.special === 'big-if-discard-3' && _fight.discard.length >= 3) {
    persuasion += 6;
  }
  if (e.special === 'scale-with-attacks') {
    persuasion += 3 * _fight.turnFlags.attacksPlayed;
  }
  if (e.special === 'scale-with-discard') {
    persuasion += _fight.discard.length;
  }
  if (e.special === 'block-equals-intent') {
    const intent = getCurrentIntent();
    if (intent.kind === 'attack') {
      _fight.block += intent.value;
    }
  }
  if (e.special === 'recall-discard') {
    _fight.drawPile = shuffleArr([..._fight.drawPile, ..._fight.discard]);
    _fight.discard = [];
  }

  // Apply Confident Tone (+1 to all attacks) if active
  if (card.type === 'attack' && _fight.powers.some(p => p.special === 'attack-buff-1')) {
    persuasion += 1;
  }

  // Authority: double next attack
  if (_fight.turnFlags.doubleNextAttack && card.type === 'attack') {
    persuasion *= 2;
    _fight.turnFlags.doubleNextAttack = false;
  }
  if (e.special === 'double-next-attack') {
    _fight.turnFlags.doubleNextAttack = true;
  }

  // Block + persuasion application
  if (e.block) _fight.block += e.block;
  if (persuasion > 0) {
    const resisted = Math.max(0, persuasion - _fight.audience.resistance);
    _fight.audience.resistance = Math.max(0, _fight.audience.resistance - persuasion);
    _fight.audience.skepticism = Math.max(0, _fight.audience.skepticism - resisted);
  }

  // Self damage (Strong Hook)
  if (e.selfDamage) {
    _fight.composure = Math.max(0, _fight.composure - e.selfDamage);
  }

  // Energy gain
  if (e.gainEnergy) _fight.energy += e.gainEnergy;

  // Draw cards
  if (e.draw) drawCards(e.draw);

  // Power card → moves to powers, not discard
  if (e.powerful) {
    _fight.powers.push({ cardId: card.id, special: e.special });
  }

  // Skip next intent
  if (e.special === 'skip-next-intent') {
    _fight.audience.skipNextIntent = true;
  }

  // Draw if power (for c33)
  if (e.special === 'draw-if-power' && _fight.powers.length > 0) {
    drawCards(2);
  }

  // Where does the card go?
  if (e.exhaust || e.powerful) {
    _fight.exhaust.push(cardId);
  } else {
    _fight.discard.push(cardId);
  }

  // Check win
  if (_fight.audience.skepticism <= 0) {
    finishFight(true);
    return;
  }
  // Check lose (e.g., self-damage killed us)
  if (_fight.composure <= 0) {
    finishFight(false);
    return;
  }

  renderDeck();
}

function endTurn() {
  if (!_fight || _fight.over) return;
  SFX.submit();

  // Discard remaining hand
  while (_fight.hand.length > 0) {
    _fight.discard.push(_fight.hand.shift());
  }
  // Block expires
  _fight.block = 0;

  // --- AUDIENCE TURN ---
  const audience = _fight.audience;
  let intent = audience.intents[audience.intentIdx % audience.intents.length];

  if (audience.skipNextIntent) {
    audience.skipNextIntent = false;
    showToast('Audience intent skipped.', 'success');
  } else {
    if (intent.kind === 'attack') {
      const dmg = intent.value + audience.conviction;
      audience.conviction = 0; // conviction is consumed on attack
      const blocked = Math.min(_fight.block, dmg);
      const through = dmg - blocked;
      _fight.block -= blocked;
      _fight.composure = Math.max(0, _fight.composure - through);
      if (through > 0) SFX.miss();
    } else if (intent.kind === 'defend') {
      audience.resistance += intent.value;
    } else if (intent.kind === 'buff') {
      audience.conviction += intent.value;
    }
  }
  audience.intentIdx++;

  // Check lose
  if (_fight.composure <= 0) {
    finishFight(false);
    return;
  }

  // --- NEW PLAYER TURN ---
  _fight.energy = _fight.energyMax;
  _fight.block = 0;
  _fight.playLog = [];
  _fight.turnFlags = { attacksPlayed: 0, skillsPlayed: 0, doubleNextAttack: false };

  // Powers that trigger at start of turn
  for (const p of _fight.powers) {
    if (p.special === 'draw-extra') drawCards(1);
    if (p.special === 'turn-start-damage') {
      const through = Math.max(0, 3 - _fight.audience.resistance);
      _fight.audience.resistance = Math.max(0, _fight.audience.resistance - 3);
      _fight.audience.skepticism = Math.max(0, _fight.audience.skepticism - through);
      if (_fight.audience.skepticism <= 0) { finishFight(true); return; }
    }
  }

  drawCards(5);
  renderDeck();
}

function finishFight(won) {
  if (!_fight) return;
  _fight.over = true;
  _fight.won = won;

  if (won) {
    SFX.win();
    const node = state.deckRun.nodes[_fight.nodeIdx];
    node.done = true;
    state.deckRun.fightsCompleted++;
    state.deckRun.composure = _fight.composure; // persist remaining composure

    // Heal a bit between fights (not after boss — run ends anyway)
    const isBoss = node.isBoss;
    const baseXp = isBoss ? 100 : 30;
    const baseCoins = isBoss ? 60 : 18;
    const composureBonus = Math.round(_fight.composure / 8);
    const xpEarned = baseXp + composureBonus;
    const coinsEarned = baseCoins + composureBonus;

    state.xp += xpEarned;
    state.coins += coinsEarned;
    state.deckRun.coinsThisRun += coinsEarned;
    refreshHeaderStats();

    if (!isBoss) {
      // Heal 12 between fights
      state.deckRun.composure = Math.min(state.deckRun.composureMax, state.deckRun.composure + 12);
      // Offer 3 reward cards (common-weighted; small chance of uncommon/rare)
      state.deckRun.pendingReward = {
        fightLabel: node.audienceId,
        xpEarned,
        coinsEarned,
        choices: rollRewardCards()
      };
    } else {
      // Run complete!
      state.deckRun.runsCompleted++;
      state.deckRun.active = false;
      state.deckRun.lastResult = { won: true, xpEarned, coinsEarned, coinsThisRun: state.deckRun.coinsThisRun };
    }
    saveState();
  } else {
    SFX.lose();
    state.deckRun.runsLost++;
    state.deckRun.active = false;
    state.deckRun.composure = 0;
    // Consolation reward
    const xpEarned = 15 + state.deckRun.fightsCompleted * 8;
    state.xp += xpEarned;
    state.deckRun.lastResult = { won: false, xpEarned, fightsCompleted: state.deckRun.fightsCompleted };
    refreshHeaderStats();
    saveState();
  }
  renderDeck();
}

function rollRewardCards() {
  // 70% common, 25% uncommon, 5% rare per slot — sample 3 distinct
  const pool = [];
  for (let i = 0; i < 3; i++) {
    const r = Math.random();
    const rarity = r < 0.05 ? 'rare' : r < 0.30 ? 'uncommon' : 'common';
    const tier = cardsByRarity(rarity);
    let pick;
    let tries = 0;
    do {
      pick = tier[Math.floor(Math.random() * tier.length)];
      tries++;
    } while (pool.includes(pick.id) && tries < 10);
    pool.push(pick.id);
  }
  return pool;
}

function pickRewardCard(cardId) {
  if (!state.deckRun.pendingReward) return;
  if (!state.deckRun.pendingReward.choices.includes(cardId)) return;
  state.deckRun.deck.push(cardId);
  state.deckRun.pendingReward = null;
  SFX.coin();
  saveState();
  renderDeck();
}

function skipReward() {
  if (!state.deckRun.pendingReward) return;
  // Skip and heal a bit more instead
  state.deckRun.composure = Math.min(state.deckRun.composureMax, state.deckRun.composure + 8);
  state.deckRun.pendingReward = null;
  SFX.click();
  saveState();
  renderDeck();
}

function dismissRunResult() {
  state.deckRun.lastResult = null;
  saveState();
  renderDeck();
}

// ================================================================
// DECK MODE — Renderers
// ================================================================
function renderDeck() {
  const container = document.getElementById('deck-content');
  if (!container) return;
  const dr = state.deckRun;

  // 1. End-of-run modal takes priority
  if (dr.lastResult && !dr.active) {
    container.innerHTML = renderRunEnd(dr.lastResult);
    return;
  }
  // 2. Mid-fight has its own UI
  if (_fight && !_fight.over) {
    container.innerHTML = renderFight();
    return;
  }
  // 3. Between fights: reward picker
  if (dr.active && dr.pendingReward) {
    container.innerHTML = renderReward(dr.pendingReward);
    return;
  }
  // 4. Active run: show map
  if (dr.active) {
    container.innerHTML = renderRunMap();
    return;
  }
  // 5. No active run: show home
  container.innerHTML = renderDeckHome();
}

function renderDeckHome() {
  const dr = state.deckRun;
  const starterPreview = STARTER_DECK_IDS.map(id => cardById(id));
  return `

          <div class="run-stat"><div class="run-stat-label">Runs Lost</div><div class="run-stat-value">${dr.runsLost || 0}</div></div>

          Start a new run →
        </button>

          ${starterPreview.map(c => renderCardHTML(c)).join('')}
        </div>
      </div>

        <h3>How it works</h3>
        <p style="color:var(--text-dim);font-size:0.9rem;line-height:1.55">

        </p>
      </div>
    </div>
  `;
}

function composureClass(cur, max) {
  const pct = cur / max;
  if (pct <= 0.25) return 'critical';
  if (pct <= 0.5) return 'low';
  return '';
}

function renderRunMap() {
  const dr = state.deckRun;
  const compCls = composureClass(dr.composure, dr.composureMax);
  return `
    <div class="wordle-back" onclick="navigate('home')">← Back to modes</div>
    <div class="deck-screen">
      <div class="run-banner">
        <h2>Run in progress</h2>
        <p>${dr.fightsCompleted} / ${dr.totalFights} fights complete. Pick the next audience to face.</p>
        <div class="run-stats">
          <div class="run-stat">
            <div class="run-stat-label">Composure</div>
            <div class="run-stat-value composure ${compCls}">${dr.composure} / ${dr.composureMax}</div>
          </div>
          <div class="run-stat">
            <div class="run-stat-label">Deck Size</div>
            <div class="run-stat-value">${dr.deck.length}</div>
          </div>
          <div class="run-stat">
            <div class="run-stat-label">Coins This Run</div>
            <div class="run-stat-value coins">🪙 ${dr.coinsThisRun}</div>
          </div>

      </div>

      <h3 style="font-family:var(--font-display);font-size:0.85rem;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.6rem">The Run</h3>
      <div class="run-map">
        ${dr.nodes.map((n, i) => renderMapNode(n, i, dr)).join('')}
      </div>

      <details style="margin-top:1rem">
        <summary style="cursor:pointer;color:var(--text-dim);font-size:0.85rem;padding:0.4rem 0">
          View your deck (${dr.deck.length} cards)
        </summary>
        <div class="card-grid" style="margin-top:0.5rem">
          ${dr.deck.map(id => renderCardHTML(cardById(id))).join('')}
        </div>
      </details>

      <div style="text-align:center;margin-top:1.5rem">
        <button class="btn btn-ghost" onclick="abandonRun()" style="color:var(--orange);font-size:0.85rem">
          Abandon run
        </button>
      </div>
    </div>
  `;
}

function renderMapNode(node, idx, dr) {
  const aud = audienceById(node.audienceId);
  const done = node.done;
  const isCurrent = !done && idx === dr.fightsCompleted;
  const isLocked = !done && !isCurrent;
  const cls = [done ? 'done' : '', isCurrent ? 'current' : '', isLocked ? 'locked' : '', node.isBoss ? 'boss' : ''].filter(Boolean).join(' ');
  const click = isCurrent ? `onclick="startFight(${idx})"` : '';
  const cta = done ? '✓ Done' : isCurrent ? `Fight ${node.isBoss ? '👑' : '→'}` : 'Locked';
  return `
    <div class="map-node ${cls}" ${click}>
      <div class="map-node-icon">${aud ? aud.emoji : '?'}</div>
      <div class="map-node-body">
        <div class="map-node-title">${aud ? aud.name : 'Unknown'}${node.isBoss ? ' (Boss)' : ''}</div>
        <div class="map-node-sub">${aud ? aud.desc : ''}</div>
      </div>
      <div class="map-node-cta">${cta}</div>
    </div>
  `;
}

function renderCardHTML(card) {
  if (!card) return '';
  const typeLabel = card.type[0].toUpperCase() + card.type.slice(1);
  return `
    <div class="card" data-type="${card.type}" data-cost="${card.cost}" data-rarity="${card.rarity}">
      <div class="card-head">
        <span class="card-cost">${card.cost}</span>
        <span class="card-name">${card.name}</span>
      </div>
      <span class="card-type-pill">${typeLabel}</span>
      <div class="card-text">${card.text}</div>
    </div>
  `;
}

function renderCardHTMLForHand(card, handIdx, energy) {
  if (!card) return '';
  const typeLabel = card.type[0].toUpperCase() + card.type.slice(1);
  const unaffordable = card.cost > energy;
  const cls = unaffordable ? 'unaffordable' : '';
  const click = unaffordable ? '' : `onclick="playCard(${handIdx})"`;
  return `
    <div class="card ${cls}" data-type="${card.type}" data-cost="${card.cost}" data-rarity="${card.rarity}" ${click}>
      <div class="card-head">
        <span class="card-cost">${card.cost}</span>
        <span class="card-name">${card.name}</span>
      </div>
      <span class="card-type-pill">${typeLabel}</span>
      <div class="card-text">${card.text}</div>
    </div>
  `;
}

function renderFight() {
  const f = _fight;
  const a = f.audience;
  const intent = getCurrentIntent();
  const compCls = composureClass(f.composure, f.composureMax);
  const skepPct = Math.round((a.skepticism / a.skepticismMax) * 100);
  const compPct = Math.round((f.composure / f.composureMax) * 100);

  return `
    <div class="deck-screen fight">

      <div class="audience-panel">
        <div class="audience-head">
          <div class="audience-emoji">${a.emoji}</div>
          <div style="flex:1;min-width:0">

            <div class="audience-desc">${a.desc}</div>
          </div>
        </div>
        <div class="skepticism-bar-wrap">

        </div>
        <div class="audience-state">
          ${a.resistance > 0 ? `<span class="badge resistance">🛡 ${a.resistance} resistance</span>` : ''}
          ${a.conviction > 0 ? `<span class="badge conviction">🔥 +${a.conviction} conviction next attack</span>` : ''}
          ${a.skipNextIntent ? `<span class="badge">⏭ Intent skipped</span>` : ''}
        </div>
        <div class="intent-card ${intent.kind}">

          <div>${a.skipNextIntent ? '(skipped this turn)' : intent.label + (intent.kind === 'attack' ? ` — ${intent.value + a.conviction} damage` : intent.kind === 'defend' ? ` — gains ${intent.value} resistance` : '')}</div>
        </div>

        </button>

    </div>
  `;
}

function renderReward(reward) {
  const node = state.deckRun.nodes[state.deckRun.fightsCompleted - 1];
  const aud = audienceById(node.audienceId);
  return `

// ================================================================

// ================================================================
function navigate(view) {
  SFX.click();
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const target = document.getElementById('view-' + view);
  if (target) target.classList.add('active');
  if (view === 'home') renderHome();
  if (view === 'wordle') renderWordle();
  if (view === 'deck')  renderDeck();
  if (view === 'settings') renderSettings();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ================================================================
// WORDLE — gameplay
// ================================================================
let _wordle = null; // transient session state

function startWordleSession() {
  const today = todayKey();
  const puzzle = todayPuzzle();

  // Resume if mid-game
  if (state.wordleInProgress && state.wordleInProgress.day === today) {
    _wordle = {
      day: today,
      puzzleId: puzzle.id,
      puzzle,
      tilePool: buildTilePool(puzzle, today),
      attempts: state.wordleInProgress.attempts.slice(),
      slots: state.wordleInProgress.slots.slice(),
      selectedSlot: 0,
      finished: false
    };
  } else {
    _wordle = {
      day: today,
      puzzleId: puzzle.id,
      puzzle,
      tilePool: buildTilePool(puzzle, today),
      attempts: [],
      slots: puzzle.slots.map(() => null),
      selectedSlot: 0,
      finished: false
    };
    state.wordleInProgress = { day: today, attempts: [], slots: _wordle.slots.slice(), puzzleId: puzzle.id };
    saveState();
  }

  // If already finished today, present the endgame screen
  if (state.wordleDailyResult && state.wordleDailyResult.day === today) {
    _wordle.finished = true;
  }
}

function persistWordleProgress() {
  if (!_wordle || _wordle.finished) return;
  state.wordleInProgress = {
    day: _wordle.day,
    attempts: _wordle.attempts.slice(),
    slots: _wordle.slots.slice(),
    puzzleId: _wordle.puzzleId
  };
  saveState();
}

function renderWordle() {
  if (!_wordle || _wordle.day !== todayKey()) startWordleSession();
  const container = document.getElementById('wordle-content');
  const w = _wordle;
  const usedTileIds = new Set(w.slots.filter(Boolean));
  const attemptsLeft = WORDLE_MAX_ATTEMPTS - w.attempts.length;
  const allSlotsFilled = w.slots.every(Boolean);
  const todayResult = (state.wordleDailyResult && state.wordleDailyResult.day === w.day) ? state.wordleDailyResult : null;

  container.innerHTML = `
    <div class="wordle-back" onclick="navigate('home')">← Back to modes</div>

    <div class="wordle">

      <div class="wordle-main">

        ${todayResult ? renderEndgame(todayResult) : ''}

        <div class="wordle-prompt-card">
          <div class="wordle-meta">
            <span>SpeakGame #${todayPuzzleNumber()}</span>
            <span class="wordle-meta-divider">·</span>
            <span>${w.puzzle.framework}</span>
            <span class="wordle-meta-divider">·</span>
            <span>${attemptsLeft} ${attemptsLeft === 1 ? 'attempt' : 'attempts'} left</span>
          </div>
          <div class="wordle-prompt">${w.puzzle.prompt}</div>
        </div>

        <div class="wordle-slots">
          ${w.slots.map((tileId, i) => {
            const slot = w.puzzle.slots[i];
            const filled = !!tileId;
            const selected = !w.finished && !todayResult && i === w.selectedSlot && !filled;
            return `
              <div class="wordle-slot ${filled ? 'filled' : ''} ${selected ? 'selected' : ''}"
                   onclick="onSlotClick(${i})">
                <span class="wordle-slot-label">${slot.label}</span>
                <div class="wordle-slot-content">
                  ${filled
                    ? `<span class="wordle-slot-text">${phraseById(tileId).text}</span>`
                    : `<span class="wordle-slot-empty">Tap to fill from the pool below…</span>`}
                </div>
                ${filled ? `<button class="wordle-slot-clear" onclick="event.stopPropagation(); clearSlot(${i})" aria-label="Clear slot">✕</button>` : ''}
              </div>
            `;
          }).join('')}
        </div>

        ${!todayResult ? `
          <div class="tile-pool" id="tile-pool">
            ${w.tilePool.map(tileId => {
              const ph = phraseById(tileId);
              const used = usedTileIds.has(tileId);
              return `
                <button class="tile ${used ? 'used' : ''}"
                        ${used ? '' : `onclick="onTileClick('${tileId}')"`}
                        title="${ph.role}">
                  ${ph.text}
                </button>
              `;
            }).join('')}
          </div>

          <div class="wordle-actions">
            <button class="btn btn-ghost btn-sm" onclick="resetCurrentAttempt()">
              Clear slots
            </button>
            <div class="spacer"></div>
            <div class="wordle-attempts-left">${w.attempts.length} / ${WORDLE_MAX_ATTEMPTS} attempts used</div>
            <button class="btn btn-primary btn-lg" ${allSlotsFilled ? '' : 'disabled'}
                    onclick="submitWordleAttempt()">
              Submit attempt
            </button>
          </div>
        ` : ''}

      </div>

      <aside class="wordle-side">
        <div class="side-card">
          <h4>Attempts</h4>
          ${w.attempts.length === 0 ? `
            <p style="color:var(--text-mute);font-size:0.85rem">Your guesses will appear here, color-coded.</p>
          ` : w.attempts.map(a => `
            <div class="wordle-history-row">
              ${a.feedback.map(f => `
                <div class="wordle-history-cell ${f}">
                  ${f === 'correct' ? '✓' : f === 'misplaced' ? '◐' : '·'}
                </div>
              `).join('')}
            </div>
          `).join('')}
        </div>

        <div class="side-card">
          <h4>Streak</h4>
          <div class="streak-big">${state.wordleStreak}🔥</div>
          <div class="streak-sub">${state.wordleStreak === 0 ? 'Solve today to start' : 'consecutive day' + (state.wordleStreak === 1 ? '' : 's')}</div>
          <div class="streak-sub">Best: ${state.wordleLongestStreak}</div>
        </div>

        <div class="side-card">
          <h4>How it works</h4>
          <p style="font-size:0.85rem;color:var(--text-dim);line-height:1.5">
            🟩 <strong>Green</strong> — phrase is correct for that slot.<br>
            🟨 <strong>Yellow</strong> — correct phrase, wrong slot.<br>
            ⬜ <strong>Grey</strong> — not in today’s answer.<br><br>
            Filler-buzzword tiles are never the answer. Avoid them.
          </p>
        </div>
      </aside>

    </div>
  `;
}

function onTileClick(tileId) {
  if (!_wordle || _wordle.finished) return;
  const w = _wordle;
  // Already used?
  if (w.slots.includes(tileId)) return;
  // Find next empty slot starting at selectedSlot, wrapping
  let targetSlot = w.selectedSlot;
  if (w.slots[targetSlot] !== null) {
    // Find first empty
    const firstEmpty = w.slots.findIndex(s => s === null);
    if (firstEmpty === -1) {
      showToast('All slots are filled — submit or clear one.');
      return;
    }
    targetSlot = firstEmpty;
  }
  w.slots[targetSlot] = tileId;
  // Advance selectedSlot to next empty
  const next = w.slots.findIndex((s, i) => i > targetSlot && s === null);
  w.selectedSlot = next === -1 ? w.slots.findIndex(s => s === null) : next;
  if (w.selectedSlot === -1) w.selectedSlot = targetSlot;
  SFX.place();
  persistWordleProgress();
  renderWordle();
}

function onSlotClick(slotIdx) {
  if (!_wordle || _wordle.finished) return;
  _wordle.selectedSlot = slotIdx;
  SFX.click();
  renderWordle();
}

function clearSlot(slotIdx) {
  if (!_wordle || _wordle.finished) return;
  _wordle.slots[slotIdx] = null;
  _wordle.selectedSlot = slotIdx;
  SFX.unplace();
  persistWordleProgress();
  renderWordle();
}

function resetCurrentAttempt() {
  if (!_wordle || _wordle.finished) return;
  _wordle.slots = _wordle.puzzle.slots.map(() => null);
  _wordle.selectedSlot = 0;
  SFX.unplace();
  persistWordleProgress();
  renderWordle();
}

// Submit an attempt: compute per-slot feedback, check win, record.
function submitWordleAttempt() {
  const w = _wordle;
  if (!w || w.finished) return;
  if (!w.slots.every(Boolean)) {
    showToast('Fill every slot first.', 'error');
    return;
  }
  SFX.submit();

  const correctIds = w.puzzle.slots.map(s => s.correctId);
  const feedback = w.slots.map((tileId, i) => {
    if (tileId === correctIds[i]) return 'correct';
    if (correctIds.includes(tileId)) return 'misplaced';
    return 'wrong';
  });
  w.attempts.push({ slots: w.slots.slice(), feedback });

  const won = feedback.every(f => f === 'correct');
  const lost = !won && w.attempts.length >= WORDLE_MAX_ATTEMPTS;

  if (won) {
    SFX.win();
    finishWordleSession(true);
  } else if (lost) {
    SFX.lose();
    finishWordleSession(false);
  } else {
    SFX.miss();
    // Clear slots for next attempt, but keep selectedSlot at 0
    w.slots = w.puzzle.slots.map(() => null);
    w.selectedSlot = 0;
    persistWordleProgress();
    renderWordle();
  }
}

function finishWordleSession(won) {
  const w = _wordle;
  const attemptsUsed = w.attempts.length;
  // Rewards: sliding scale based on attempts. Lose = participation reward.
  const rewardTable = [
    { xp: 100, coins: 50 },
    { xp: 80,  coins: 40 },
    { xp: 65,  coins: 32 },
    { xp: 50,  coins: 25 },
    { xp: 40,  coins: 18 },
    { xp: 30,  coins: 12 }
  ];
  const reward = won ? rewardTable[attemptsUsed - 1] : { xp: 10, coins: 0 };

  // Streak bookkeeping
  if (won) {
    const today = w.day;
    const last = state.wordleLastPlayedDay;
    if (last) {
      const yesterday = (() => {
        const d = new Date(); d.setDate(d.getDate() - 1);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      })();
      if (last === yesterday) state.wordleStreak += 1;
      else if (last !== today) state.wordleStreak = 1;
      // if last === today, no change (already counted)
    } else {
      state.wordleStreak = 1;
    }
    state.wordleLongestStreak = Math.max(state.wordleLongestStreak, state.wordleStreak);
  } else {
    state.wordleStreak = 0;
  }
  state.wordleLastPlayedDay = w.day;

  // Apply reward
  state.xp += reward.xp;
  state.coins += reward.coins;
  if (reward.coins > 0) setTimeout(() => SFX.coin(), 250);

  // Build the share grid (3 emoji per attempt row)
  const emojiFor = f => f === 'correct' ? '🟩' : f === 'misplaced' ? '🟨' : '⬛';
  const gridText = w.attempts.map(a => a.feedback.map(emojiFor).join('')).join('\n');

  state.wordleDailyResult = {
    day: w.day,
    won,
    attempts: attemptsUsed,
    rows: w.attempts.map(a => a.feedback),
    xpEarned: reward.xp,
    coinsEarned: reward.coins,
    gridText
  };
  state.wordleInProgress = null;
  saveState();
  refreshHeaderStats();

  w.finished = true;
  renderWordle();
}

function renderEndgame(result) {
  const headline = result.won
    ? (result.attempts === 1 ? 'Perfect. First try.' : `Solved in ${result.attempts}.`)
    : 'Streak broken — back tomorrow.';
  const sub = result.won
    ? 'New puzzle at local midnight. Streak holds if you come back tomorrow.'
    : 'The solution is shown below in green. New puzzle at local midnight.';
  return `
    <div class="endgame ${result.won ? '' : 'lose'}">
      <h2>${headline}</h2>
      <p>${sub}</p>
      <div class="endgame-rewards">
        <span class="endgame-reward xp">+${result.xpEarned} XP</span>
        ${result.coinsEarned > 0 ? `<span class="endgame-reward coins">+${result.coinsEarned} 🪙</span>` : ''}
        ${result.won ? `<span class="endgame-reward">🔥 ${state.wordleStreak} streak</span>` : ''}
      </div>
      <div class="endgame-share-grid">SpeakGame #${todayPuzzleNumber()} ${result.won ? result.attempts : 'X'}/${WORDLE_MAX_ATTEMPTS}\n${result.gridText}</div>
      <button class="btn btn-primary" onclick="copyShareGrid()">Copy share grid</button>
      <button class="btn btn-ghost" onclick="navigate('home')">Back to modes</button>
    </div>
  `;
}

function copyShareGrid() {
  const result = state.wordleDailyResult;
  if (!result) return;
  const text = `SpeakGame #${todayPuzzleNumber()} ${result.won ? result.attempts : 'X'}/${WORDLE_MAX_ATTEMPTS}\n${result.gridText}`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => showToast('Copied to clipboard.', 'success'),
      () => showToast('Copy failed — long-press to select.', 'error')
    );
  } else {
    showToast('Long-press to copy.', 'error');
  }
}

function toggleSetting(key) {
  SFX.click();
  if (key === 'theme') {
    state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
    applyTheme();
  } else {
    state.settings[key] = !state.settings[key];
  }
  if (key === 'animations') applyAnimations();
  saveState();
  renderSettings();
}
function applyTheme() { document.body.setAttribute('data-theme', state.settings.theme); }
function applyAnimations() {
  document.body.style.setProperty('--anim-on', state.settings.animations ? '1' : '0');
  // The reduced-motion rules cover this if needed; we leave individual animations to honor the OS pref.
}

function resetEverything() {
  if (!confirm('Reset all SpeakGame progress? This deletes XP, Coins, streak, and today’s puzzle.')) return;
  localStorage.removeItem(STATE_KEY);
  location.reload();
}

// ================================================================
// TOAST
// ================================================================
let _toastTimer = null;
function showToast(msg, kind) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.classList.remove('show'); }, 2200);
}

// ================================================================
function init() {
  loadState();
  applyTheme();
  applyAnimations();
  refreshHeaderStats();
  renderHome();
}
